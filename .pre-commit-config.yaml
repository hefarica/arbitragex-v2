# Pre-commit hooks · arbitragex-v2
#
# OMEGA-102 Delta Pack · 2026-05-16
# Install locally with:
#
#   pip install pre-commit
#   pre-commit install
#
# These hooks run on `git commit` and block bad changes before they reach
# the network. They are intentionally a SUBSET of CI: CI runs the heavy
# tests (e2e, security.yml, codeql); local hooks focus on fast checks
# that catch the most common operator mistakes (unformatted code,
# committed secrets, accidentally staged .env files).

default_language_version:
  python: python3

repos:
  # ---- Generic hygiene -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
        exclude: ^\.github/workflows/  # GH Actions extensions (e.g. !reference) trip the parser
      - id: check-json
      - id: detect-private-key

  # ---- Block .env files from being committed --------------------------
  - repo: local
    hooks:
      - id: block-dotenv
        name: block .env* from being committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "^(\.env|\.env\..*|.*/\.env|.*/\.env\..*)$" | grep -vE "\.example$|\.template$|\.crucible$|\.edge$"; then echo "::error::refusing to commit .env file (production secrets must live outside the repo)"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  # ---- Secrets scanner -------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---- Rust ------------------------------------------------------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (Rust workspace)
        entry: bash -c 'cd backend && cargo fmt --all -- --check'
        language: system
        types_or: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (Rust workspace, warnings-as-errors)
        entry: bash -c 'cd backend && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        types_or: [rust]
        pass_filenames: false
        stages: [pre-push]
        # clippy is expensive; run on pre-push only, not every commit.

  # ---- TypeScript ------------------------------------------------------
  - repo: local
    hooks:
      - id: tsc-frontend
        name: tsc --noEmit (frontend)
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false
        stages: [pre-push]

  # ---- Solidity --------------------------------------------------------
  - repo: local
    hooks:
      - id: forge-build
        name: forge build (Solidity contracts)
        entry: bash -c 'cd contracts && forge build --sizes'
        language: system
        types_or: [solidity]
        pass_filenames: false
        stages: [pre-push]
