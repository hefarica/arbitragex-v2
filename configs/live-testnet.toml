# ArbitrageX v2 — LIVE_TESTNET overlay config.
#
# This file is intentionally separate from app.toml so the operator can stage
# testnet parameters without touching the canonical production config.
#
# SAFETY INVARIANTS (non-negotiable):
#   - paper_mode = true     → Only the operator can flip this, manually, in app.toml.
#   - kill_switch_enabled_default = true
#   - mainnet chain_id = 1  → explicitly absent from [[chains]].
#   - All RPC URLs are env placeholders; no literals in this file.

[system]
env = "live-testnet"
kill_switch_enabled_default = true
service_name_prefix = "arbx"

[execution]
private_only = true
paper_mode = true
max_parallel_executions = 2
retry_limit = 1
target_block_offset = 1
max_inclusion_wait_blocks = 5
max_value_eth = 0.1
flashbots_submit_timeout_ms = 5000
priority_fee_increment_pct = 10

[simulation]
provider = "anvil"
fork_block = "latest"
snapshot_pool_size = 2
sim_timeout_ms = 5000
reset_interval_s = 600
gas_limit_safety_factor = 1.3
max_slippage_for_pass_pct = 5.0
probe_amount_fraction = 1.0

# Testnet chains only. Mainnet is NOT listed.
[[chains]]
chain_id = 11155111
name = "sepolia"
enabled = true

[[chains]]
chain_id = 421614
name = "arbitrum-sepolia"
enabled = false

[[chains]]
chain_id = 11155420
name = "optimism-sepolia"
enabled = false

# Relays: disabled on testnet (Flashbots-style relays are mainnet-only).
[[relays]]
name = "flashbots"
enabled = false
chains = [1]
endpoint = ""

[[relays]]
name = "bloxroute"
enabled = false
chains = [1]
endpoint = ""
