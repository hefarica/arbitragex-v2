# ArbitrageX v2 — Canonical application config.
# Validated at boot against configs/schemas/app.schema.json.
# Secrets NEVER live here. Use env vars / docker secret / Vault.

[system]
env = "production-like"
kill_switch_enabled_default = true   # fail-closed in non-dev
service_name_prefix = "arbx"

[risk]
max_revert_rate_pct = 5.0
max_execution_variance_pct = 20.0
min_token_safety_score = 70
simulation_required_for_new_routes = true
max_gas_price_gwei = 200.0
max_slippage_pct = 1.5

[execution]
private_only = true
max_parallel_executions = 8
retry_limit = 2

[observability]
prometheus_enabled = true
structured_logs = true
log_level = "info"

[scoring]
min_accept_score = 55.0
weight_liquidity = 0.20
weight_depth = 0.15
weight_safety = 0.20
weight_slippage = 0.15
weight_gas = 0.15
weight_risk = 0.15

[token_safety]
provider = "internal_only"          # "goplus" | "honeypot_is" | "internal_only"
api_call_timeout_ms = 1500
ttl_seconds_ok = 3600
ttl_seconds_bad = 86400
min_acceptable_score = 70

[[circuit_breakers]]
name = "token_safety_api"
threshold = 5
window_ms = 60000
cooldown_ms = 120000

[[circuit_breakers]]
name = "db_writes"
threshold = 10
window_ms = 30000
cooldown_ms = 60000

[[circuit_breakers]]
name = "stream_consumer"
threshold = 20
window_ms = 60000
cooldown_ms = 30000

# Chains are configurable: no hardcoding inside services.
[[chains]]
chain_id = 1
name = "ethereum"
enabled = true

[[chains]]
chain_id = 10
name = "optimism"
enabled = false

[[chains]]
chain_id = 137
name = "polygon"
enabled = false

[[chains]]
chain_id = 42161
name = "arbitrum"
enabled = false

[[chains]]
chain_id = 8453
name = "base"
enabled = false

# Relays are configurable: selector-api loads this list and scores them per relay_scores table.
[[relays]]
name = "flashbots"
enabled = true
chains = [1]

[[relays]]
name = "bloxroute"
enabled = false
chains = [1]

[[relays]]
name = "eden"
enabled = false
chains = [1]

[[relays]]
name = "beaver"
enabled = false
chains = [1]

[[relays]]
name = "titan"
enabled = false
chains = [1]
