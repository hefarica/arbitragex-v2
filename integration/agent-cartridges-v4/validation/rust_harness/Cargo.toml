[package]
name = "arbx-agent-v4-conformance"
version = "0.1.0"
edition = "2021"
publish = false

# Validation project only. No existing repository manifest is changed.
# Versions observed in the supplied repository Cargo.lock.
[dependencies]
rhai = { version = "=1.25.1", features = ["sync", "no_optimize"] }
serde = { version = "1", features = ["derive"] }
