# ArbitrageX v2 — PRODUCTION stack.
#
# Every secret is required — compose will refuse to start if any env var below
# is unset. This is enforced by the `${VAR:?message}` syntax which makes `docker
# compose up` fail immediately when the variable is absent.
#
# Expected boot sequence in production:
#   1. Operator unseals Vault.
#   2. vault-agent renders /run/secrets/arbx.env from its template.
#   3. `docker compose -f docker/compose.prod.yml --env-file /run/secrets/arbx.env up -d`
#
# Paths exposed to the Internet:
#   - Only the Cloudflare Tunnel reaches this stack. No port is bound to 0.0.0.0.
#   - Postgres, Redis, Grafana, Prometheus, Loki bound to 127.0.0.1 only.
#   - edge service is the public entry point (behind CF Worker + Tunnel).

name: arbitragex-v2

networks:
  arbx-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:

x-common-logging: &common-logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:

  # ───────── Data plane ─────────

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: arbitragex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required for prod stack}
      ARBX_MIGRATOR_PASSWORD: ${ARBX_MIGRATOR_PASSWORD:?ARBX_MIGRATOR_PASSWORD required for prod}
      ARBX_RW_PASSWORD: ${ARBX_RW_PASSWORD:?ARBX_RW_PASSWORD required for prod}
      ARBX_RO_PASSWORD: ${ARBX_RO_PASSWORD:?ARBX_RO_PASSWORD required for prod}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d arbitragex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  redis:
    image: redis:7.2
    command: ["redis-server","--save","","--appendonly","no"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  # geth and anvil are dev profiles; not started in prod.

  # ───────── Backend services ─────────

  searcher-rs:
    build:
      context: ../backend
      dockerfile: searcher-rs/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      SEARCHER_HEALTH_PORT: "9001"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      RPC_WS_1: ${RPC_WS_1:?RPC_WS_1 required for mainnet detection}
      RPC_HTTP_1: ${RPC_HTTP_1:?RPC_HTTP_1 required for mainnet receipts}
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: searcher-rs is the heaviest Rust service (REVM + WS fan-out).
    deploy:
      resources:
        limits:
          memory: "4G"
          cpus: "2.0"
        reservations:
          memory: "512M"
    <<: *common-logging

  sim-ctl:
    build:
      context: ../backend
      dockerfile: sim-ctl/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      SIM_PORT: "3003"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      ANVIL_URL: http://anvil:8545
    volumes:
      - ../configs:/app/configs:ro
    ports: ["127.0.0.1:3003:3003"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: sim-ctl runs REVM simulations; 2G prevents OOM during burst.
    deploy:
      resources:
        limits:
          memory: "2G"
          cpus: "1.5"
        reservations:
          memory: "256M"
    <<: *common-logging

  relays-client:
    build:
      context: ../backend
      dockerfile: relays-client/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      RELAYS_PORT: "3005"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      # FLASHBOTS_SIGNER_KEY, BLOXROUTE_AUTH, EDEN_AUTH come from vault-agent
      # via env_file above. Relay itself is disabled until the matching secret exists.
    volumes:
      - ../configs:/app/configs:ro
    ports: ["127.0.0.1:3005:3005"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: relays-client manages Flashbots/BloxRoute HTTP connections.
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "128M"
    <<: *common-logging

  recon:
    build:
      context: ../backend
      dockerfile: recon/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      RECON_PORT: "3004"
    volumes:
      - ../configs:/app/configs:ro
    ports: ["127.0.0.1:3004:3004"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: recon does reconciliation queries; 1G is sufficient.
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "128M"
    <<: *common-logging

  selector-api:
    build:
      context: ..
      dockerfile: backend/selector-api/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      SELECTOR_PORT: "3002"
    ports: ["127.0.0.1:3002:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: selector-api is a lightweight TS service; 512M is generous.
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.5"
        reservations:
          memory: "64M"
    <<: *common-logging

  api-server:
    build:
      context: ..
      dockerfile: backend/api-server/Dockerfile
    env_file: ["../.env"]
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      ARBX_ADMIN_TOKEN: ${ARBX_ADMIN_TOKEN:?ARBX_ADMIN_TOKEN required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      API_PORT: "8080"
      SELECTOR_URL: http://selector-api:3002
      SIM_URL: http://sim-ctl:3003
      RECON_URL: http://recon:3004
      RELAYS_URL: http://relays-client:3005
      SEARCHER_URL: http://searcher-rs:9001
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: api-server handles REST + WS fan-out to all backend services.
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "128M"
    <<: *common-logging

  # ───────── Edge ─────────
  # In production the public Cloudflare Worker (deployed separately via wrangler)
  # fronts this stack. This `edge` service is the internal Express shim used by
  # the Cloudflare Tunnel for admin-only traffic (ops.<domain>).

  edge:
    build:
      context: ..
      dockerfile: edge/dev-local/Dockerfile
    env_file: ["../.env"]
    environment:
      API_SERVER_URL: http://api-server:8080
      ARBX_EDGE_TOKEN: ${ARBX_EDGE_TOKEN:?ARBX_EDGE_TOKEN required}
      EDGE_PORT: "8787"
    ports: ["127.0.0.1:8787:8787"]
    depends_on: [api-server]
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  # ───────── Frontend ─────────

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_EDGE_URL: ${NEXT_PUBLIC_EDGE_URL:?NEXT_PUBLIC_EDGE_URL required (public edge URL)}
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [edge]
    restart: unless-stopped
    networks: [arbx-net]
    # INF-1: frontend serves static Next.js output; 1G covers SSR memory overhead.
    deploy:
      resources:
        limits:
          memory: "1G"
          cpus: "1.0"
        reservations:
          memory: "128M"
    <<: *common-logging

  # ───────── Observability ─────────

  prometheus:
    # INF-7: bumped from v2.52.0 to v2.55.1 (latest stable as of 2026-05-07).
    image: prom/prometheus:v2.55.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    # INF-3: healthcheck via /-/healthy endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  grafana:
    # INF-7: bumped from 10.4.2 to 11.4.0 (latest stable as of 2026-05-07).
    image: grafana/grafana:11.4.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    # INF-3: healthcheck via /api/health endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # INF-3: healthcheck via /-/healthy endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  loki:
    image: grafana/loki:2.9.7
    ports: ["127.0.0.1:3100:3100"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    # INF-3: healthcheck via /ready endpoint.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

  token-enricher:
    build:
      context: ../backend
      dockerfile: token-enricher/Dockerfile
    env_file: ["../.env"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      ENRICHER_RPC_URLS: ${ENRICHER_RPC_URLS:?ENRICHER_RPC_URLS required}
      ENRICHER_METRICS_PORT: "9004"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RUST_LOG: ${RUST_LOG}
    ports: ["127.0.0.1:9004:9004"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [arbx-net]
    # F-3/F-7: resource limits prevent unbounded memory growth.
    deploy:
      resources:
        limits:
          memory: "512M"
          cpus: "0.5"
    <<: *common-logging

  promtail:
    image: grafana/promtail:2.9.7
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    # INF-3: promtail exposes /ready on port 9080.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9080/ready 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [arbx-net]
    <<: *common-logging

# ─────────── Secrets (rendered by vault-agent into host-side files) ───────────
#
# The files below are NOT committed. They are rendered at boot by vault-agent
# reading from Vault and writing to /run/secrets/ on the host. See
# `infra/vault-agent/templates/` for the rendering templates.

secrets:
  grafana_admin_password:
    file: /run/secrets/arbx/grafana_admin_password
