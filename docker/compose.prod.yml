name: arbitragex-v2
networks:
  arbx-net:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  grafana_data: null
  loki_data: null
  prometheus_data: null
  vault_data: null
  vault_logs: null
  minio_data: null
  thanos_store_data: null
  arbx_vault_data: null
x-common-logging:
  logging: &id001
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'
services:
  postgres:
    logging: *id001
    image: postgres:15
    environment:
      POSTGRES_DB: arbitragex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required for prod
        stack}
      ARBX_MIGRATOR_PASSWORD: ${ARBX_MIGRATOR_PASSWORD:?ARBX_MIGRATOR_PASSWORD required
        for prod}
      ARBX_RW_PASSWORD: ${ARBX_RW_PASSWORD:?ARBX_RW_PASSWORD required for prod}
      ARBX_RO_PASSWORD: ${ARBX_RO_PASSWORD:?ARBX_RO_PASSWORD required for prod}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d arbitragex
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
    - arbx-net
  redis:
    logging: *id001
    image: redis:7.2
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - PING
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
    - arbx-net
  searcher-rs:
    logging: *id001
    build:
      context: ../backend
      dockerfile: searcher-rs/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      SEARCHER_HEALTH_PORT: '9001'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      RPC_WS_1: ${RPC_WS_1:?RPC_WS_1 required for mainnet detection}
      RPC_HTTP_1: ${RPC_HTTP_1:?RPC_HTTP_1 required for mainnet receipts}
    volumes:
    - ../configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:9001/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 512M
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    env_file:
    - ../.env
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec anvil --fork-url "$$ANVIL_FORK_URL" --host 0.0.0.0 --port 8545
    expose:
    - "8545"
    networks:
    - arbx-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G
  sim-ctl:
    logging: *id001
    build:
      context: ../backend
      dockerfile: sim-ctl/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      SIM_PORT: '3003'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      ANVIL_URL: http://anvil:8545
    volumes:
    - ../configs:/app/configs:ro
    ports:
    - 127.0.0.1:3003:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:3003/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 256M
  math-engine:
    logging: *id001
    build:
      context: ../backend
      dockerfile: math-engine/Dockerfile
    env_file:
    - ../.env
    environment:
      MATH_ENGINE_PORT: '3006'
      RUST_LOG: ${RUST_LOG:-info}
    ports:
    - 127.0.0.1:3006:3006
    # Pure compute service — no DB/Redis dependency. Serves the 31 topological
    # operators (list/toggle/compute/264×31 matrix projection) over HTTP.
    # Read-only / paper-shadow: transforms MarketState, never signs/broadcasts.
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:3006/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 256M
  relays-client:
    logging: *id001
    build:
      context: ../backend
      dockerfile: relays-client/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      RELAYS_PORT: '3005'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    volumes:
    - ../configs:/app/configs:ro
    ports:
    - 127.0.0.1:3005:3005
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:3005/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
  recon:
    logging: *id001
    build:
      context: ../backend
      dockerfile: recon/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      RECON_PORT: '3004'
    volumes:
    - ../configs:/app/configs:ro
    ports:
    - 127.0.0.1:3004:3004
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      # recon image ships no wget/curl, so the previous wget healthcheck always
      # failed (false "unhealthy") even though /health serves 200. bash IS present
      # → use a wget-free TCP liveness probe on the recon port.
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/3004
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
  selector-api:
    logging: *id001
    build:
      context: ..
      dockerfile: backend/selector-api/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      SELECTOR_PORT: '3002'
    ports:
    - 127.0.0.1:3002:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 64M
  api-server:
    logging: *id001
    build:
      context: ..
      dockerfile: backend/api-server/Dockerfile
    env_file:
    - ../.env
    environment:
      ARBX_CONFIG_PATH: /app/configs/app.toml
      REDIS_URL: redis://redis:6379
      ARBX_ADMIN_TOKEN: ${ARBX_ADMIN_TOKEN:?ARBX_ADMIN_TOKEN required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      API_PORT: '8080'
      SELECTOR_URL: http://selector-api:3002
      SIM_URL: http://sim-ctl:3003
      RECON_URL: http://recon:3004
      RELAYS_URL: http://relays-client:3005
      SEARCHER_URL: http://searcher-rs:9001
      # Service control-plane (start/stop managed containers via the socket-proxy
      # sidecar). OFF by default — shadow/paper systems stay safe until opted in.
      ARBX_SERVICE_CONTROL: ${ARBX_SERVICE_CONTROL:-off}
      ARBX_SERVICE_CONTROL_ALLOWLIST: ${ARBX_SERVICE_CONTROL_ALLOWLIST:-searcher-rs,sim-ctl,relays-client,recon,token-enricher}
      DOCKER_PROXY_URL: http://socket-proxy:2375
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
    volumes:
    - type: bind
      source: /var/lib/arbx
      target: /var/lib/arbx
    # READ-ONLY repo mount for the 17 live-readiness verifiers (REPO_ROOT default /repo).
    # #155 added this as a SECOND `volumes:` key on this service — a duplicate mapping
    # key that PyYAML tolerates (takes the last) but docker compose's parser rejects,
    # which failed deploy run 27329677627 at parse time (before pull/up — VPS runtime
    # untouched). Single key now; :ro — the container can never write the repo; same
    # .env already injected via env_file → no new secret exposure.
    - ..:/repo:ro
  edge:
    logging: *id001
    build:
      context: ..
      dockerfile: edge/worker/Dockerfile.node
    env_file:
    - ../.env
    environment:
      API_SERVER_URL: http://api-server:8080
      ARBX_EDGE_TOKEN: ${ARBX_EDGE_TOKEN:?ARBX_EDGE_TOKEN required}
      EDGE_PORT: '8787'
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
    - 0.0.0.0:8787:8787
    depends_on:
    - api-server
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "require('http').get('http://localhost:8787/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
  frontend:
    logging: *id001
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_EDGE_URL: ${NEXT_PUBLIC_EDGE_URL:?NEXT_PUBLIC_EDGE_URL required (public edge URL)}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-${NEXT_PUBLIC_EDGE_URL/http/ws}}
        # OPTIONAL (default empty = WalletConnect stays fail-honest
        # 'walletconnect_project_id_missing'; injected/MetaMask unaffected). The
        # operator supplies the real id ONLY via VPS .env / CI secret — never
        # in-repo (arbx-no-hardcode-doctrine). Next frontend rebuild bakes it in.
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        # SEC-3 / RULE 03 class: next.config.js headers() is evaluated during
        # `next build` — HSTS bakes into routes-manifest at BUILD time. The
        # `environment:` ARBX_TLS_ENABLED entry below never reaches the bake;
        # THIS arg closes the chain:
        #   compose build.args -> Dockerfile ARG/ENV -> next.config headers().
        ARBX_TLS_ENABLED: ${ARBX_TLS_ENABLED:-true}
    environment:
      NEXT_PUBLIC_EDGE_URL: ${NEXT_PUBLIC_EDGE_URL:?NEXT_PUBLIC_EDGE_URL required
        (public edge URL)}
      INTERNAL_EDGE_URL: http://edge:8787
      # SEC-3: emit HSTS (next.config.js gates on this + NODE_ENV=production).
      # The public dapp is HTTPS today — the header belongs on.
      # NOTE (RULE 03 class): this runtime entry ALONE IS INSUFFICIENT — Next
      # evaluates headers() at `next build`, so HSTS only bakes via the
      # build.args ARBX_TLS_ENABLED above (frontend/Dockerfile ARG/ENV).
      # Kept here for runtime introspection only.
      ARBX_TLS_ENABLED: ${ARBX_TLS_ENABLED:-true}
      # V-AT-2: SSR server components (e.g. /audit-logs) need the admin token to
      # authenticate against the edge adminProxy via x-arbx-admin-token header.
      # The browser flow uses the httpOnly cookie; SSR has no browser session.
      ARBX_ADMIN_TOKEN: ${ARBX_ADMIN_TOKEN:?ARBX_ADMIN_TOKEN required}
      # SSR rate-limit exemption: server components fetch the edge via
      # INTERNAL_EDGE_URL without cf-connecting-ip (no Cloudflare on the docker
      # network), so all SSR traffic shares one "anon" rate-limit bucket and
      # self-DoSes (429) on pages that fan out parallel fetches. The edge worker
      # bypasses the rate limit when x-arbx-edge-token matches this value.
      # Same secret already used for edge↔api-server auth; reused here, not new.
      ARBX_EDGE_TOKEN: ${ARBX_EDGE_TOKEN:?ARBX_EDGE_TOKEN required}
    ports:
    - 0.0.0.0:5173:5173
    depends_on:
    - edge
    healthcheck:
      # READY-CIRC-01: liveness must probe a static asset, never `/`. `/` is
      # force-dynamic SSR that fetches readiness/decision from the edge →
      # api-server verifyAll() → PR-1 HEAD frontend `/` — the healthcheck and
      # the readiness cycle self-deadlock (5s timeout < 8s PR-1 abort →
      # unhealthy flaps every ~39s TTL beat). /favicon.ico serves the same
      # origin without SSR.
      test:
      - CMD-SHELL
      - node -e "require('http').get('http://localhost:5173/favicon.ico',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
  prometheus:
    logging: *id001
    image: prom/prometheus:v2.55.1
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.min-block-duration=2h
    - --storage.tsdb.max-block-duration=2h
    - --web.enable-lifecycle
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ../monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
    - prometheus_data:/prometheus
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:9090/-/healthy 2>/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - arbx-net
  grafana:
    logging: *id001
    image: grafana/grafana:11.4.0
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_operator_change_me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
    - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - grafana_data:/var/lib/grafana
    depends_on:
    - prometheus
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:3000/api/health 2>/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - arbx-net
  alertmanager:
    logging: *id001
    image: prom/alertmanager:v0.27.0
    ports:
    - 127.0.0.1:9093:9093
    volumes:
    - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:9093/-/healthy 2>/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - arbx-net
  loki:
    logging: *id001
    image: grafana/loki:2.9.7
    ports:
    - 127.0.0.1:3100:3100
    command:
    - -config.file=/etc/loki/config.yml
    volumes:
    - ../monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
    - loki_data:/loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:3100/ready 2>/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - arbx-net
  token-enricher:
    logging: *id001
    build:
      context: ../backend
      dockerfile: token-enricher/Dockerfile
    env_file:
    - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: redis://redis:6379
      ENRICHER_CHAINS: ${ENRICHER_CHAINS:?ENRICHER_CHAINS required (e.g. 1,137,42161)}
      ENRICHER_METRICS_PORT: '9004'
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RUST_LOG: ${RUST_LOG}
      # DexScreener price oracle — fills no_price_oracle for long-tail tokens by
      # populating arbx:token_prices:<chain> (by symbol). Default-OFF: runs ONLY
      # when set to "active". Read-only/shadow (no signer, no broadcast).
      ARBX_DEXSCREENER_ORACLE: ${ARBX_DEXSCREENER_ORACLE:-off}
      ARBX_MIN_PRICE_LIQUIDITY_USD: ${ARBX_MIN_PRICE_LIQUIDITY_USD:-50000}
      DEXSCREENER_PRICE_INTERVAL_MS: ${DEXSCREENER_PRICE_INTERVAL_MS:-15000}
      # GeckoTerminal price + icon tier — peer of DexScreener: same arbx:token_prices
      # hash (by symbol) PLUS icons (SETEX arbx:token-icons:{chain}:{addr}) read by
      # the api-server token-icon route. Default-OFF; read-only/shadow.
      ARBX_GECKOTERMINAL_ORACLE: ${ARBX_GECKOTERMINAL_ORACLE:-off}
      GECKOTERMINAL_PRICE_INTERVAL_MS: ${GECKOTERMINAL_PRICE_INTERVAL_MS:-60000}
      ARBX_GECKOTERMINAL_ICON_TTL_SECS: ${ARBX_GECKOTERMINAL_ICON_TTL_SECS:-3600}
    ports:
    - 127.0.0.1:9004:9004
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:9004/metrics 2>/dev/null | grep -q 'arbx_enricher_up
        1' || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  promtail:
    logging: *id001
    image: grafana/promtail:2.9.7
    command:
    - -config.file=/etc/promtail/config.yml
    volumes:
    - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - loki
    healthcheck:
      test:
      # promtail image ships no wget, so the previous wget healthcheck always
      # failed (false "unhealthy"). bash IS present → wget-free TCP liveness probe
      # on the promtail HTTP port.
      - CMD
      - bash
      - -c
      - exec 3<>/dev/tcp/127.0.0.1/9080
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
    - arbx-net
  # ───────── Service control-plane: least-privilege docker socket proxy ─────────
  # Network-internal ONLY (no host port). The api-server is the sole caller; it
  # restricts controllable service names via an allowlist + audit-logs every
  # start/stop. The proxy allows ONLY list/inspect/start/stop (see
  # docker/socket-proxy/server.js); create/delete/exec/prune → 403.
  socket-proxy:
    logging: *id001
    build:
      context: ./socket-proxy
    restart: unless-stopped
    networks:
    - arbx-net
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    user: "65532:65532"
    # Host docker group gid — run `getent group docker | cut -d: -f3` on the VPS
    # and set DOCKER_GID in .env. Required so the nonroot proxy can read the socket.
    group_add:
    - "${DOCKER_GID:-998}"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN_PORT: "2375"
    healthcheck:
      # /_ping is NOT allowlisted → proxy returns 403. 403 proves the process is
      # alive AND the filter is active (a permissive proxy would return 200).
      # distroless has no wget/curl → drive the check with node.
      test:
      - CMD
      - /nodejs/bin/node
      - -e
      - "require('http').get('http://127.0.0.1:2375/_ping',r=>process.exit(r.statusCode===403?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vault:
    logging: *id001
    image: hashicorp/vault:1.18.1
    container_name: arbitragex-v2-vault-1
    cap_add:
    - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: "{\n  \"storage\": {\"file\": {\"path\": \"/vault/data\"\
        }},\n  \"listener\": {\n    \"tcp\": {\n      \"address\": \"0.0.0.0:8200\"\
        ,\n      \"tls_cert_file\": \"/vault/tls/vault-cert.pem\",\n      \"tls_key_file\"\
        : \"/vault/tls/vault-key.pem\",\n      \"tls_min_version\": \"tls12\"\n  \
        \  }\n  },\n  \"ui\": true,\n  \"default_lease_ttl\": \"168h\",\n  \"max_lease_ttl\"\
        : \"720h\",\n  \"api_addr\": \"https://vault:8200\"\n}\n"
      VAULT_ADDR: https://vault:8200
      VAULT_CACERT: /vault/tls/vault-ca.pem
    command: server
    volumes:
    - vault_data:/vault/data
    - vault_logs:/vault/logs
    - ../monitoring/vault/tls:/vault/tls:ro
    ports:
    - 127.0.0.1:8200:8200
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  minio:
    logging: *id001
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: arbitragex-v2-minio-1
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required for prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required for
        prod}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  thanos-sidecar:
    logging: *id001
    image: quay.io/thanos/thanos:v0.36.1
    container_name: arbitragex-v2-thanos-sidecar-1
    # Run as nobody (65534) to match the prometheus container that owns
    # prometheus_data — the Thanos shipper must write /prometheus/thanos/
    # (upload bookkeeping). Without this, mkdir fails with EACCES and no
    # blocks ever upload to Minio (Thanos is "healthy" but functionally dead).
    user: "65534:65534"
    command:
    - sidecar
    - --tsdb.path=/prometheus
    - --prometheus.url=http://prometheus:9090
    - --objstore.config-file=/etc/thanos/objstore.yml
    - --grpc-address=0.0.0.0:10901
    - --http-address=0.0.0.0:10902
    volumes:
    # RW (not :ro): the shipper writes thanos.shipper.json + an upload/ staging
    # dir here. Prometheus writes only its own block dirs; no collision.
    - prometheus_data:/prometheus
    - ../monitoring/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:10902/-/healthy >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
  thanos-store:
    logging: *id001
    image: quay.io/thanos/thanos:v0.36.1
    container_name: arbitragex-v2-thanos-store-1
    command:
    - store
    - --data-dir=/data
    - --objstore.config-file=/etc/thanos/objstore.yml
    - --grpc-address=0.0.0.0:10901
    - --http-address=0.0.0.0:10902
    volumes:
    - thanos_store_data:/data
    - ../monitoring/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:10902/-/healthy >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  thanos-query:
    logging: *id001
    image: quay.io/thanos/thanos:v0.36.1
    container_name: arbitragex-v2-thanos-query-1
    command:
    - query
    - --http-address=0.0.0.0:10904
    - --grpc-address=0.0.0.0:10905
    - --store=thanos-sidecar:10901
    - --store=thanos-store:10901
    ports:
    - 127.0.0.1:10904:10904
    depends_on:
    - thanos-sidecar
    - thanos-store
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:10904/-/healthy >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
    - arbx-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
secrets:
  grafana_admin_password:
    file: /run/secrets/arbx/grafana_admin_password
