openapi: 3.1.0
info:
  title: ArbitrageX v2 — Public Operator API
  version: 0.2.0
  description: |
    Public operator/observer surface of the ArbitrageX V2 console.

    SOURCE OF TRUTH (FASE 4): this document is reconciled against the running
    code, not aspiration. The effective public contract is co-owned by:
      - `edge/worker` (Cloudflare Worker) — the public entry point. It exposes a
        mostly `/v1`-less path set and proxies to the internal api-server,
        rewriting paths (e.g. public `GET /api/opportunities/live` →
        upstream `GET /api/v1/opportunities/live`) and renaming a few
        (public `GET /api/killswitch/status` → upstream `GET /admin/killswitch/status`).
      - `backend/api-server` — the HTTP/data backend. Its own `/api/v1/*` and
        `/admin/*` paths are internal-shaped and are NOT the public contract.

    The paths below are the PUBLIC (edge) paths. Read endpoints are open; write
    and admin endpoints require the `x-arbx-admin-token` header (see security).

    Scope of this increment (FASE 4 Inc 1): the operator/read surface plus the
    kill-switch. The full admin-write surface (chains, topology, trading-config,
    cartridge lifecycle, credentials, relays, blacklist, circuit-breakers,
    scoring) is real but intentionally documented in a follow-up (Inc 1b), and
    several response bodies are described as open objects where the runtime shape
    is loose/honest-empty rather than fabricating a field list.
  contact:
    name: ArbitrageX SRE
    email: sre@arbitragex.io
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: >
      Public origin served by the edge worker (edge/worker), which proxies to
      the internal api-server. The concrete public hostname is
      environment-specific and intentionally not committed (the [env.production]
      block in wrangler.toml is commented out); paths below are relative to it.
tags:
  - name: Health
    description: Liveness and public health snapshot
  - name: Opportunities
    description: Live arbitrage opportunity feed (observe-only)
  - name: Executions
    description: Recent execution telemetry
  - name: Risk
    description: Risk alerts and circuit-breaker status
  - name: Recon
    description: Reconciliation (PnL / attempts / revert) summaries
  - name: Readiness
    description: Paper→live readiness gate (observe-only)
  - name: Operations
    description: Operational KPI / S-curve / variance mirrors
  - name: Strategies
    description: Strategy catalog, runtime status, cartridges (read)
  - name: Config
    description: Effective runtime configuration (read)
  - name: Wallet
    description: Wallet posture — read-only, BROADCAST_DISABLED
  - name: System
    description: Feature manifest and config drift
  - name: Admin
    description: Operator-gated controls (x-arbx-admin-token)
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Synthesized by the edge worker; never proxied.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Worker is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeHealth" }
  /status:
    get:
      tags: [Health]
      summary: Public health snapshot
      description: >
        api-server upstream probes + kill-switch state. For browser `Accept:
        text/html` the edge returns a 404 sentinel (handled by the SPA layer).
      security: []
      operationId: getStatus
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
  /api/opportunities/live:
    get:
      tags: [Opportunities]
      summary: Live arbitrage opportunity feed
      description: >
        Edge `GET /api/opportunities/live` → upstream `GET /api/v1/opportunities/live`.
        Observe-only. Item shape mirrors the opportunities store and is not
        strictly schematized at this layer.
      security: []
      operationId: getOpportunitiesLive
      parameters:
        - name: viable_only
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Opportunity snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/executions/recent:
    get:
      tags: [Executions]
      summary: Recent executions
      description: Edge `/api/executions/recent` → upstream `/api/v1/executions/recent` (executions JOIN opportunities).
      security: []
      operationId: getExecutionsRecent
      responses:
        "200":
          description: Recent executions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListEnvelope" }
  /api/risk/alerts:
    get:
      tags: [Risk]
      summary: Risk alerts feed
      description: Edge `/api/risk/alerts` → upstream `/api/v1/risk/alerts` (risk_events).
      security: []
      operationId: getRiskAlerts
      responses:
        "200":
          description: Risk alerts
          content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/risk/circuit-breakers/status:
    get:
      tags: [Risk]
      summary: Circuit-breaker status (the real guard surface)
      security: []
      operationId: getCircuitBreakerStatus
      responses:
        "200":
          description: Circuit-breaker status
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/risk/circuit-breakers/events:
    get:
      tags: [Risk]
      summary: Circuit-breaker events
      security: []
      operationId: getCircuitBreakerEvents
      responses:
        "200":
          description: Circuit-breaker events
          content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } }
  /api/recon/summary:
    get:
      tags: [Recon]
      summary: Reconciliation summary (PnL / attempts / revert)
      security: []
      operationId: getReconSummary
      responses:
        "200":
          description: Recon summary
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/recon/timeseries:
    get:
      tags: [Recon]
      summary: Reconciliation time-series (bucketed)
      security: []
      operationId: getReconTimeseries
      responses:
        "200":
          description: Bucketed recon series
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/readiness:
    get:
      tags: [Readiness]
      summary: Live-readiness gate (17 dynamically verified items)
      description: Edge `/api/readiness` → upstream `/api/v1/readiness`. Observe-only; never a false green. `?force` bypasses cache.
      security: []
      operationId: getReadiness
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Readiness report
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /api/readiness/blockers:
    get:
      tags: [Readiness]
      summary: Derived readiness blockers
      security: []
      operationId: getReadinessBlockers
      responses:
        "200": { description: Blockers, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/readiness/decision:
    get:
      tags: [Readiness]
      summary: GO / NO-GO decision
      security: []
      operationId: getReadinessDecision
      responses:
        "200": { description: Decision, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/readiness/steps:
    get:
      tags: [Readiness]
      summary: Readiness stepper state
      security: []
      operationId: getReadinessSteps
      responses:
        "200": { description: Steps, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/agents/status:
    get:
      tags: [Readiness]
      summary: Agent-team verdicts
      security: []
      operationId: getAgentsStatus
      responses:
        "200": { description: Agents status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/scoring/status:
    get:
      tags: [Readiness]
      summary: Confidence-scoring status
      security: []
      operationId: getScoringStatus
      responses:
        "200": { description: Scoring status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/scanner/heartbeat:
    get:
      tags: [Readiness]
      summary: Scanner heartbeat snapshot
      security: []
      operationId: getScannerHeartbeat
      responses:
        "200": { description: Heartbeat present, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: No heartbeat recorded yet }
  /api/operations/kpi:
    get:
      tags: [Operations]
      summary: Operations KPI mirror
      security: []
      operationId: getOperationsKpi
      responses:
        "200": { description: KPI, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/operations/scurve:
    get:
      tags: [Operations]
      summary: Operations S-curve mirror
      security: []
      operationId: getOperationsScurve
      responses:
        "200": { description: S-curve, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/operations/variance:
    get:
      tags: [Operations]
      summary: Operations variance mirror
      security: []
      operationId: getOperationsVariance
      responses:
        "200": { description: Variance, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/strategies/runtime-status:
    get:
      tags: [Strategies]
      summary: Strategy runtime status
      security: []
      operationId: getStrategiesRuntimeStatus
      responses:
        "200": { description: Runtime status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/strategy-catalog:
    get:
      tags: [Strategies]
      summary: Strategy catalog
      security: []
      operationId: getStrategyCatalog
      responses:
        "200": { description: Catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/strategy-catalog/active:
    get:
      tags: [Strategies]
      summary: Active strategies
      security: []
      operationId: getStrategyCatalogActive
      responses:
        "200": { description: Active strategies, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/cartridges:
    get:
      tags: [Strategies]
      summary: Strategy-forge cartridges (read)
      security: []
      operationId: getCartridges
      responses:
        "200": { description: Cartridges, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/cartridge-filters:
    get:
      tags: [Strategies]
      summary: Cartridge filters (read)
      security: []
      operationId: getCartridgeFilters
      responses:
        "200": { description: Filters, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/route-discovery-outcomes:
    get:
      tags: [Strategies]
      summary: Route-discovery outcomes
      security: []
      operationId: getRouteDiscoveryOutcomes
      responses:
        "200": { description: Outcomes, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/route-discovery-outcomes/summary:
    get:
      tags: [Strategies]
      summary: Route-discovery outcomes summary
      security: []
      operationId: getRouteDiscoveryOutcomesSummary
      responses:
        "200": { description: Summary, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/dexes:
    get:
      tags: [Strategies]
      summary: DEX registry (read)
      security: []
      operationId: getDexes
      responses:
        "200": { description: DEXes, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/pools:
    get:
      tags: [Strategies]
      summary: Pool registry (read)
      security: []
      operationId: getPools
      responses:
        "200": { description: Pools, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/config/current:
    get:
      tags: [Config]
      summary: Effective runtime configuration
      description: Edge `/api/config/current` → upstream `/api/v1/config/current`. Secrets excluded.
      security: []
      operationId: getConfigCurrent
      responses:
        "200": { description: Effective config, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/metrics/paper-shadow:
    get:
      tags: [Operations]
      summary: Paper-shadow metrics
      security: []
      operationId: getPaperShadowMetrics
      responses:
        "200": { description: Paper-shadow metrics, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/sim-ctl/fork-status:
    get:
      tags: [Operations]
      summary: Fork-simulation control status
      security: []
      operationId: getForkStatus
      responses:
        "200": { description: Fork status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/rpc/status:
    get:
      tags: [Operations]
      summary: RPC endpoint status
      security: []
      operationId: getRpcStatus
      responses:
        "200": { description: RPC status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/wallet/status:
    get:
      tags: [Wallet]
      summary: Wallet status (read-only)
      description: Read-only. The wallet surface is BROADCAST_DISABLED; intents return SIMULATION_REQUIRED.
      security: []
      operationId: getWalletStatus
      responses:
        "200": { description: Wallet status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/wallet/safety:
    get:
      tags: [Wallet]
      summary: Wallet safety posture (read-only)
      security: []
      operationId: getWalletSafety
      responses:
        "200": { description: Safety posture, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/contracts:
    get:
      tags: [System]
      summary: Contract registry (honest-empty)
      security: []
      operationId: getContracts
      responses:
        "200": { description: Contracts, content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } } }
  /api/capital-gates:
    get:
      tags: [System]
      summary: Capital safety gates
      security: []
      operationId: getCapitalGates
      responses:
        "200": { description: Capital gates, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/system/feature_manifest:
    get:
      tags: [System]
      summary: Feature manifest
      security: []
      operationId: getFeatureManifest
      responses:
        "200": { description: Feature manifest, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/system/drift:
    get:
      tags: [System]
      summary: Config-hash drift report
      security: []
      operationId: getSystemDrift
      responses:
        "200": { description: Drift report, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /api/killswitch/status:
    get:
      tags: [Admin]
      summary: Kill-switch state (read)
      description: >
        Edge `GET /api/killswitch/status` → upstream `GET /admin/killswitch/status`.
        Admin-token gated.
      operationId: getKillswitchStatus
      security:
        - AdminToken: []
      responses:
        "200":
          description: Kill-switch state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitchState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Kill-switch state unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/killswitch/{action}:
    post:
      tags: [Admin]
      summary: Toggle the kill-switch (semantic action)
      description: >
        Edge `POST /api/killswitch/{action}` (activate|deactivate) → upstream
        `POST /admin/killswitch` (mapped to `{enabled}`). Admin-token gated.
      operationId: postKillswitchAction
      security:
        - AdminToken: []
      parameters:
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [activate, deactivate] }
      responses:
        "200":
          description: New kill-switch state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitchState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/killswitch:
    post:
      tags: [Admin]
      summary: Set the kill-switch (raw upstream contract)
      description: >
        The api-server's raw kill-switch write, also reachable at the edge as
        `POST /admin/killswitch`. Admin-token gated. Body is `enabled` (NOT
        `active`); `reason` and `triggered_by` are optional.
      operationId: postKillswitch
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchRequest" }
      responses:
        "200":
          description: New kill-switch state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitchState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/audit:
    get:
      tags: [Admin]
      summary: Paginated audit log
      operationId: getAdminAudit
      security:
        - AdminToken: []
      responses:
        "200":
          description: Audit log page
          content: { application/json: { schema: { $ref: "#/components/schemas/ListEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-arbx-admin-token
      description: >
        Operator/admin token. Required by every write and admin-gated route
        (HTTP and WebSocket). The edge also accepts the sentinel
        `__session_active__` to mean "use the arbx_admin_session cookie".
  schemas:
    EdgeHealth:
      type: object
      description: Worker-synthesized liveness body.
      required: [ok, service]
      properties:
        ok: { type: boolean }
        service: { type: string }
        env: { type: string }
    StatusResponse:
      type: object
      description: api-server /status snapshot.
      required: [ok, services, version]
      properties:
        ok: { type: boolean }
        services:
          type: object
          additionalProperties: true
          description: Per-upstream probe results.
        killswitch:
          type: object
          additionalProperties: true
        env: { type: string }
        version: { type: string }
        ts: { type: string, format: date-time }
    ListEnvelope:
      type: object
      description: >
        Generic list-bearing response. Exact item schema is endpoint-specific
        and intentionally not fabricated here (FASE 4 documents shape only where
        verified). Most list endpoints return either a bare array or
        `{ data: [...] }` / `{ items: [...] }`.
      additionalProperties: true
    KillSwitchRequest:
      type: object
      description: Body for POST /admin/killswitch (verified against KillSwitchReq zod).
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true = armed (executions blocked); false = disabled.
        reason:
          type: string
          maxLength: 500
          description: Optional — recorded in the audit log.
        triggered_by:
          type: string
          maxLength: 200
          description: Optional actor; defaults to the x-arbx-actor header.
    KillSwitchState:
      type: object
      description: >
        Current kill-switch state object (the raw upstream response). Field set
        is the persisted state; documented as an open object because the runtime
        shape is the stored record, not a fabricated contract.
      additionalProperties: true
      properties:
        enabled: { type: boolean }
        reason: { type: [string, "null"] }
        triggered_by: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      description: Error envelope. Note api-server gate errors use `{ error, details? }`.
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
  responses:
    BadRequest:
      description: 'Invalid request — api-server returns { error: invalid_request, details }.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid x-arbx-admin-token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missing_admin_token:
              value: { error: missing_admin_token }
    Unavailable:
      description: Upstream dependency (DB/Redis) unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            db_unavailable:
              value: { error: db_unavailable }
    RateLimited:
      description: Rate limit exceeded (edge or api-server)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            rate_limited:
              value: { error: rate_limited }
