[package]
name = "math-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
reqwest = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP API (gated by `api` feature)
axum = { workspace = true, optional = true }
# `util` feature exposes tower::util::ServiceExt (.oneshot) used by the api.rs
# test module. Without it the lib tests fail to compile (E0432/E0599) — a
# latent break that cargo test --workspace --lib would hit in CI.
tower = { workspace = true, optional = true, features = ["util"] }

# Math-physics engine core
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
statrs = "0.16"

# ML primitives (crates.io dependencies, not external repo ports)
candle-core = { version = "0.4", optional = true }
candle-nn = { version = "0.4", optional = true }

[features]
default = []
api = ["dep:axum", "dep:tower"]
ml = ["dep:candle-core", "dep:candle-nn"]

[[bin]]
name = "math-engine"
path = "src/main.rs"
required-features = ["api"]
