[package]
name = "math-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
reqwest = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP API (gated by `api` feature)
axum = { workspace = true, optional = true }
# Operator-toggle propagation (item 5c): the API publishes the disabled-set to
# Redis so the searcher-rs embedded registry honors the same toggles.
redis = { workspace = true, optional = true }
# `util` feature exposes tower::util::ServiceExt (.oneshot) used by the api.rs
# test module. Without it the lib tests fail to compile (E0432/E0599) — a
# latent break that cargo test --workspace --lib would hit in CI.
tower = { workspace = true, optional = true, features = ["util"] }

# Math-physics engine core
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
statrs = "0.16"

# ML primitives — REMOVED with the `ml` feature (CI-07): candle-core 0.4
# breaks compilation and no cfg consumer exists. Re-add with the feature.
# candle-core = { version = "0.4", optional = true }
# candle-nn = { version = "0.4", optional = true }

[features]
default = []
api = ["dep:axum", "dep:tower", "dep:redis"]
# CI-07 fix (2026-09-24): the `ml` feature is declared but has ZERO
# `cfg(feature = "ml")` in code AND candle-core 0.4 fails to compile
# (documented in ci.yml:56-59 "do NOT pass --all-features"). The feature and
# its optional deps are REMOVED — re-add when candle is upgraded AND a real
# cfg consumer exists. This unblocks --all-features for any future CI job.
# ml = ["dep:candle-core", "dep:candle-nn"]

[[bin]]
name = "math-engine"
path = "src/main.rs"
required-features = ["api"]
