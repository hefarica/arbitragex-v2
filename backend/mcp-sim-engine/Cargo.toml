[package]
name = "mcp-sim-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ArbitrageX v2 — local MCP (stdio) server exposing the REAL searcher-rs discovery/sizing kernels to Claude. Shadow/read-only: no capital, no broadcast, no executor, no wallets."

[[bin]]
name = "arbx-sim-engine"
path = "src/main.rs"

[dependencies]
# Reuse the real, already-built kernels — NO re-implementation (Zero-Mocks):
#   route_discovery::find_routes (DFS 2–3 hop), amm_math::v2_amount_out (V2 CPMM),
#   sim_orchestrator::execute_round_trip_revm (REVM round-trip, paper_mode-only).
searcher-rs = { path = "../searcher-rs" }
# RoundTripContext type + the REVM SimulatorV2 used by simulate_bundle.
prioritization-spine = { workspace = true }
simulator-v2 = { path = "../simulator-v2" }

# Official Rust MCP SDK (Model Context Protocol). stdio transport + tool macros.
# 3.1.4 — GHSA-89vp-x53w-74fx (DNS rebinding, high) requires >= 1.4.0; ported
# from 0.3 (Parameters moved handler::server::tool -> handler::server::wrapper).
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }

tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
ethers = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
