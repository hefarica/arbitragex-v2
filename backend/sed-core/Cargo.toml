[package]
name = "sed-core"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sequential Equilibrium Dispatcher — quantitative mathematical orchestration layer"

# Doctrine note (2026-05-13 Phase 1 scaffold):
#
# The spec at docs/superpowers/specs/2026-05-13-sequential-equilibrium-
# dispatcher-v1.1.md §5.2 lists a richer dep matrix (nalgebra, argmin,
# revm 14.0, etc.). Phase 1 only covers `types/` — the typestate +
# kill-switch gate + infrastructure prerequisite — none of which need
# linear algebra or REVM. The math-bearing deps are intentionally
# absent here so the Phase 1 build stays small and the workspace REVM
# pin (3.5.0) does not collide with the spec's forward-looking 14.0.
# Future phases will re-introduce them per-feature.

[dependencies]
# Workspace dependencies — match existing crates' style.
serde = { workspace = true }
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# Internal path dependency. shared-rs hosts KillSwitchClient + health
# checking primitives that the SED gates integrate with.
shared-rs = { workspace = true }

[features]
# Default ships ONLY the types/ surface — the math modules are stubs in
# Phase 1 and add no public API. Future phases will add features per
# module (filtration, eigenstate, allocator, hedger) gating the math
# kernels behind opt-in flags so downstream crates pull only what they
# consume — see spec §5.3.
default = []

# Reserved feature names for future phases. Currently no-op — declared
# here so the spec's downstream `features = ["filtration", ...]` usage
# does not error in consumer crates ahead of the math landing.
filtration = []
eigenstate = []
allocator = []
hedger = []
metrics = []
persistence = []
kill_switch = []

[lints.rust]
# Future-proof: the math modules will contain todo!() bodies during
# Phase 1-3 development. We allow them at crate level until each module
# graduates to a real implementation. This matches the workspace's
# overall "fail-honest no-fabrication" stance — todo!() panics at
# runtime if a Phase-2+ caller reaches it, which is the desired
# behavior (loudly surface incomplete paths) versus silently returning
# stub data.
unexpected_cfgs = "warn"

[lints.clippy]
# The lib.rs ships with stricter denies (unwrap_used, expect_used) per
# the workspace doctrine; see src/lib.rs.
