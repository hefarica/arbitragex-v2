[package]
name = "searcher-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ArbitrageX v2 — MEV opportunity searcher. S2: real mempool ingestion + calldata decode + DEX candidate detection."

[dependencies]
shared-rs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
redis.workspace = true
reqwest.workspace = true
prometheus.workspace = true
once_cell.workspace = true
sqlx.workspace = true
ethers = { workspace = true, features = ["abigen", "rustls"] }
alloy.workspace = true
alloy-sol-types.workspace = true
futures-util.workspace = true
lru.workspace = true
hex.workspace = true
bigdecimal.workspace = true
rust_decimal.workspace = true
rand.workspace = true
prioritization-spine = { workspace = true }
# G-SIM-1 PR-B1 (Option B) — the REAL wrapped-flash multi-step REVM sim +
# storage-override helpers now live here (extracted verbatim from this crate).
# `default-features = false`: searcher-rs owns the `v2-simulator` gate and turns
# sim-core's matching feature on ONLY through its own `v2-simulator` feature
# (below), preserving the exact `#[cfg(feature = "v2-simulator")]` shape.
sim-core = { workspace = true, default-features = false }
math-engine = { workspace = true }
async-trait.workspace = true
arc-swap = "1"
# Phase 1 route-discovery: parse config/strategies/route_applicability.yaml at
# boot (fail-safe to embedded safe defaults when absent/invalid).
serde_yaml = "0.9"

# FASE OMEGA — Dynamic strategy cartridge runtime (Rhai scripting engine).
rhai.workspace = true
sha2.workspace = true

# Sprint 4 — REVM-backed simulator (Phase A.1+A.2 fail-closed wire).
# Enabled by default at compile time; runtime is gated by RPC_HTTP_<chain>
# being present per chain. When the feature is OFF, the scanner fails closed
# (RULE 00 — no fabricated PASS). The legacy v1 stub in prioritization-spine
# is deprecated; see `feat/wire-simulator-v2-revm` for context.
simulator-v2 = { path = "../simulator-v2", optional = true }

# SOP-EDGE-001: lazy_static for SedMetrics singleton (paper-shadow feature)
lazy_static = { version = "1", optional = true }

# sed-core: quantitative orchestration layer (paper-shadow mode)
# Provides CDC filtration, eigenstate decomposition, Pontryagin allocator.
sed-core = { path = "../sed-core", optional = true }

[features]
default = ["v2-simulator"]
# Enabling searcher-rs's v2-simulator turns on the REVM sim in BOTH the local
# simulator-v2 dep AND the extracted sim-core crate, so `execute_multistep_revm`
# compiles under the SAME gate it always did.
v2-simulator = ["dep:simulator-v2", "sim-core/v2-simulator"]
paper-shadow = ["dep:lazy_static", "dep:sed-core", "sed-core?/filtration", "sed-core?/eigenstate", "sed-core?/metrics"]
experimental-engines = []

[dev-dependencies]
tokio = { version = "1", features = ["macros","rt-multi-thread","test-util"] }
# Used by `workers::price_worker` tests to mock Alchemy + Coingecko HTTP
# responses without hitting real endpoints (RULE 00 — no external calls in
# unit tests). Production code path uses `reqwest` directly; wiremock spawns
# a localhost server the worker treats as the configured base URL.
wiremock = "0.6"
# ARBX-0012 (XLS-QB / REQ-QB-015) bench matrix (`benches/amount_matrix.rs`,
# custom harness): benches see only dev-deps (same lesson as simulator-v2
# below), and these three are already workspace/lib dependencies — zero new
# fetch, they only make the existing artifacts nameable from the bench crate.
ethers = { workspace = true, features = ["abigen", "rustls"] }
serde_json = { workspace = true }
chrono = { workspace = true }
# A.4 fork-validation integration test (`tests/multistep_fork.rs`, gated
# `#[cfg(feature = "v2-simulator")]`) constructs a `simulator_v2::SimulatorV2`
# directly to drive `execute_multistep_revm` against a real archive RPC.
# Integration tests only see the crate's dev-deps — not its optional
# `[dependencies]` — so simulator-v2 must be nameable here too. Test-scoped:
# this does NOT change the shipped library's public API, and it's a harmless
# build when the feature is off (the test simply isn't compiled).
simulator-v2 = { path = "../simulator-v2" }

# ARBX-0012: the N-bucket amount-sweep benchmark matrix (workbook 10_LATENCY
# r9 "amount probe buckets" axis, sheet's own r21 mandate — "<30 ms NO puede
# garantizarse por Excel. Debe demostrarse con benchmarks"). Custom harness
# (no criterion dep): the percentile statistic IS the live telemetry kernel
# (`latency_budget::nearest_rank`), so a bench p95 and a wire p95 are the
# same number-shape. Run: `cargo bench --bench amount_matrix`.
[[bench]]
name = "amount_matrix"
harness = false

# ARBX-QB-07-006: the discovery-variables benchmark matrix (workbook
# 10_LATENCY contract via quotebase_config.json — the workload whose p95 the
# Discovery_SLA_ms gate of ARBX-QB-07-007 must judge). Same custom-harness
# convention as amount_matrix (nearest_rank percentiles, one JSON line per
# axis point). Run: `cargo bench --bench discovery_matrix`.
[[bench]]
name = "discovery_matrix"
harness = false
