[package]
name = "searcher-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ArbitrageX v2 — MEV opportunity searcher. S2: real mempool ingestion + calldata decode + DEX candidate detection."

[dependencies]
shared-rs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
redis.workspace = true
reqwest.workspace = true
prometheus.workspace = true
once_cell.workspace = true
sqlx.workspace = true
ethers = { workspace = true, features = ["abigen", "rustls"] }
alloy.workspace = true
alloy-sol-types.workspace = true
futures-util.workspace = true
lru.workspace = true
hex.workspace = true
bigdecimal.workspace = true
rand.workspace = true
prioritization-spine = { workspace = true }
math-engine = { workspace = true }

# Sprint 4 — REVM-backed simulator (Phase A.1+A.2 fail-closed wire).
# Enabled by default at compile time; runtime is gated by RPC_HTTP_<chain>
# being present per chain. When the feature is OFF, the scanner fails closed
# (RULE 00 — no fabricated PASS). The legacy v1 stub in prioritization-spine
# is deprecated; see `feat/wire-simulator-v2-revm` for context.
simulator-v2 = { path = "../simulator-v2", optional = true }

[features]
default = ["v2-simulator"]
v2-simulator = ["dep:simulator-v2"]

[dev-dependencies]
tokio = { version = "1", features = ["macros","rt-multi-thread","test-util"] }
# Used by `workers::price_worker` tests to mock Alchemy + Coingecko HTTP
# responses without hitting real endpoints (RULE 00 — no external calls in
# unit tests). Production code path uses `reqwest` directly; wiremock spawns
# a localhost server the worker treats as the configured base URL.
wiremock = "0.6"
