[package]
name = "searcher-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ArbitrageX v2 — MEV opportunity searcher. S2: real mempool ingestion + calldata decode + DEX candidate detection."

[dependencies]
shared-rs.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
redis.workspace = true
reqwest.workspace = true
prometheus.workspace = true
once_cell.workspace = true
sqlx.workspace = true
ethers = { workspace = true, features = ["abigen", "rustls"] }
alloy.workspace = true
alloy-sol-types.workspace = true
futures-util.workspace = true
lru.workspace = true
hex.workspace = true
bigdecimal.workspace = true
rand.workspace = true
prioritization-spine = { workspace = true }
math-engine = { workspace = true }
async-trait.workspace = true
arc-swap = "1"
# Phase 1 route-discovery: parse config/strategies/route_applicability.yaml at
# boot (fail-safe to embedded safe defaults when absent/invalid).
serde_yaml = "0.9"

# FASE OMEGA — Dynamic strategy cartridge runtime (Rhai scripting engine).
rhai.workspace = true
sha2.workspace = true

# Sprint 4 — REVM-backed simulator (Phase A.1+A.2 fail-closed wire).
# Enabled by default at compile time; runtime is gated by RPC_HTTP_<chain>
# being present per chain. When the feature is OFF, the scanner fails closed
# (RULE 00 — no fabricated PASS). The legacy v1 stub in prioritization-spine
# is deprecated; see `feat/wire-simulator-v2-revm` for context.
simulator-v2 = { path = "../simulator-v2", optional = true }

# SOP-EDGE-001: lazy_static for SedMetrics singleton (paper-shadow feature)
lazy_static = { version = "1", optional = true }

# sed-core: quantitative orchestration layer (paper-shadow mode)
# Provides CDC filtration, eigenstate decomposition, Pontryagin allocator.
sed-core = { path = "../sed-core", optional = true }

[features]
default = ["v2-simulator"]
v2-simulator = ["dep:simulator-v2"]
paper-shadow = ["dep:lazy_static", "dep:sed-core", "sed-core?/filtration", "sed-core?/eigenstate", "sed-core?/metrics"]
experimental-engines = []

[dev-dependencies]
tokio = { version = "1", features = ["macros","rt-multi-thread","test-util"] }
# Used by `workers::price_worker` tests to mock Alchemy + Coingecko HTTP
# responses without hitting real endpoints (RULE 00 — no external calls in
# unit tests). Production code path uses `reqwest` directly; wiremock spawns
# a localhost server the worker treats as the configured base URL.
wiremock = "0.6"
# A.4 fork-validation integration test (`tests/multistep_fork.rs`, gated
# `#[cfg(feature = "v2-simulator")]`) constructs a `simulator_v2::SimulatorV2`
# directly to drive `execute_multistep_revm` against a real archive RPC.
# Integration tests only see the crate's dev-deps — not its optional
# `[dependencies]` — so simulator-v2 must be nameable here too. Test-scoped:
# this does NOT change the shipped library's public API, and it's a harmless
# build when the feature is off (the test simply isn't compiled).
simulator-v2 = { path = "../simulator-v2" }
