[workspace]
resolver = "2"
members = [
    "shared-rs",
    "searcher-rs",
    "sim-ctl",
    "relays-client",
    "recon", "math-engine",
    "prioritization-spine",
    "simulator-v2",
    "token-enricher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"

[workspace.dependencies]
revm          = { version = "3.5.0", default-features = false, features = ["std"] }
alloy-primitives = { version = "0.7" }
tokio         = { version = "1", features = ["full"] }
anyhow        = "1"
thiserror     = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
uuid          = { version = "1", features = ["v4", "serde"] }
chrono        = { version = "0.4", features = ["serde"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["json","env-filter"] }
axum          = "0.7"
tower         = "0.4"
tower-http    = { version = "0.5", features = ["trace"] }
hyper         = "1"
reqwest       = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
redis         = { version = "0.25", features = ["tokio-comp","connection-manager"] }
sqlx          = { version = "0.7",  default-features = false, features = ["runtime-tokio","tls-rustls","postgres","uuid","chrono","json","macros","bigdecimal"] }
bigdecimal    = "0.4"
rand          = "0.8"
prometheus    = "0.13"
once_cell     = "1"
jsonschema    = { version = "0.17", default-features = false }
config        = { version = "0.14", default-features = false, features = ["toml"] }
validator     = { version = "0.18", features = ["derive"] }
shared-rs     = { path = "shared-rs" }
prioritization-spine = { path = "prioritization-spine" }
math-engine   = { path = "math-engine" }
ethers        = { version = "2", default-features = false, features = ["ws","rustls"] }
futures-util  = "0.3"
lru           = "0.12"
hex           = "0.4"
