[workspace]
resolver = "2"
members = [
    "shared-rs",
    "searcher-rs",
    "sim-ctl",
    "relays-client",
    "recon", "math-engine",
    "prioritization-spine",
    "simulator-v2",
    # G-SIM-1 PR-B1 (Option B) — shared REAL sim path (wrapped-flash multi-step
    # REVM orchestrator + storage-override helpers), extracted verbatim from
    # searcher-rs so sim-ctl can later consume the SAME sim (no second encoder).
    "sim-core",
    "token-enricher",
    # arbx-sim-engine — local MCP (stdio) server exposing the real searcher-rs
    # discovery/sizing kernels to Claude. Shadow/read-only; no capital/executor.
    "mcp-sim-engine",
    # B1.e (2026-05-13) — Sequential Equilibrium Dispatcher quantitative
    # orchestration layer. Phase 1 scaffold ships only types/ (typestate
    # + kill-switch + 501 prereq); math bodies (filtration, eigenstate,
    # allocator, hedger) defer to Phase 2.
    "sed-core",
    # Fact-Forcing Gate Semiotic-Translation — english to math translations
    "semiotic-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
revm          = { version = "3.5.0", default-features = false, features = ["std"] }
alloy-primitives = { version = "0.7" }
tokio         = { version = "1", features = ["full"] }
tokio-util    = { version = "0.7", features = ["rt"] }
anyhow        = "1"
thiserror     = "1"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
uuid          = { version = "1", features = ["v4", "serde"] }
chrono        = { version = "0.4", features = ["serde"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["json","env-filter"] }
axum          = "0.7"
tower         = "0.4"
tower-http    = { version = "0.5", features = ["trace"] }
hyper         = "1"
reqwest       = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
redis         = { version = "0.25", features = ["tokio-comp","connection-manager"] }
sqlx          = { version = "0.7",  default-features = false, features = ["runtime-tokio","tls-rustls","postgres","uuid","chrono","json","macros","bigdecimal"] }
bigdecimal    = "0.4"
rust_decimal  = "1.42.1"
rand          = "0.8"
prometheus    = "0.13"  # Pinned at 0.13 audit re-run #2 2026-05-10: 0.14 changed
                        # with_label_values signature breaking 12 call sites in
                        # shared-rs. Bump to 0.14 deferred to a dedicated migration sprint.
once_cell     = "1"
jsonschema    = { version = "0.17", default-features = false }
config        = { version = "0.14", default-features = false, features = ["toml"] }
validator     = { version = "0.18", features = ["derive"] }
shared-rs     = { path = "shared-rs" }
prioritization-spine = { path = "prioritization-spine" }
sim-core      = { path = "sim-core", default-features = false }
math-engine   = { path = "math-engine" }
ethers        = { version = "2", default-features = false, features = ["ws","rustls"] }
# alloy 1.0 — workspace canonical (token-enricher pins this already, lock is stable)
alloy         = { version = "1", features = ["providers", "transport-http", "rpc-types-eth", "network", "sol-types", "rlp"] }
alloy-sol-types = { version = "1" }
futures-util  = "0.3"
async-trait   = "0.1"
lru           = "0.12"
hex           = "0.4"
# B1.e V1.2 (2026-05-13) — Linear algebra for SED closed-contour typestate.
# Required by sed-core ClosedContourTrajectory (DVector<f64> transition points
# + norm computation). Pinned at 0.32; downstream crates that need it should
# enable via their own feature flag rather than taking the full dep transitively.
nalgebra      = "0.35"
# B1.e V1.2 Phase 2 — Stochastic distributions for filtration kernels
# (Markov jump intensity sampling, Poisson random measure). Only enabled
# under sed-core's `filtration` feature, NOT a default dep, to keep the
# Phase 1 typestate-only build lean.
rand_distr    = "0.4"
# FASE OMEGA — Rhai scripting engine for dynamic strategy cartridges.
# Sandboxed, no-std-compatible, embeddable scripting language designed for
# game engines and similar hot-reload scenarios. Perfect for MEV cartridges.
rhai          = { version = "1.19", features = ["sync", "no_optimize"] }
# SHA-256 hashing for cartridge content dedup.
sha2          = "0.10"

# ---------------------------------------------------------------------------
# M11 (audit 2026-05-10): surface hot-path panics early.
# unwrap_used + expect_used are WARNINGS (not denied) — too many to fix in
# one pass.  Promotion path: per-file #[deny] -> workspace deny in CI once
# all callers are cleaned up.  Individual modules may #[allow] temporarily.
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# ---------------------------------------------------------------------------
# revm-interpreter 1.3.0 vs Rust ≥1.91 debug ub-checks (A.4 / G-SIM-1 fork).
#
# revm 1.3.0's EVM operand Stack pre-allocates `Vec::with_capacity(1024)` and
# uses capacity-beyond-len unchecked writes (`get_unchecked_mut(len)` before
# `set_len(len+1)` in Stack::dup/push/swap — stack.rs:206). Rust 1.91 debug
# builds enable `unsafe_precondition` checks (ub_checks) that validate the
# index against slice.len(), so EVERY DUP/SWAP of real bytecode execution
# panics in dev profile ("slice::get_unchecked_mut requires that the index is
# within the slice" → SIGABRT). In release the checks are off and the manual
# Vec invariant (capacity == STACK_LIMIT) holds. Evidence:
#   * A.4 fork run 20260820T005735Z (searcher-rs multistep_fork, VPS)
#   * CI run 32061502321 (simulator-v2 fork_mainnet, 2026-08-17) — same
#     stack.rs:206:28 panic in fork_mainnet_weth_deposit_withdraw_round_trip.
# Scoped fix: disable debug assertions (and the ub_checks they gate) for the
# interpreter crate only, so `cargo test` dev-profile fork suites execute
# real mainnet bytecode again. Upgrading revm is the long-term fix.
# ---------------------------------------------------------------------------
[profile.dev.package.revm-interpreter]
debug-assertions = false
