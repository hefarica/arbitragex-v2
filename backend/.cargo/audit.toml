# ============================================================
# .cargo/audit.toml — ArbitrageX-v2 OMEGA Recovery PR
# Branch: omega/recovery-20260516
# Created: 2026-05-16
#
# DOCTRINA (Hector's directive):
#   "Excepciones temporales para dependencias transitivas no explotables
#   directamente. MIGRACIÓN MAYOR POSPUESTA para proteger el hot-path
#   y el motor cuántico."
#
# PRINCIPIO DE VISIBILIDAD:
#   "POR EL HAZ DE LUZ SOLO PASA QUIEN ES VISTO"
#   Every decision is documented. No silent ignores.
#
# Triage owner: Security Engineer subagent (OMEGA team)
# Full triage table: docs/core/CARGO_AUDIT_TRIAGE.md
# ============================================================

[advisories]
ignore = [
    # ----------------------------------------------------------------
    # RUSTSEC-2024-0437 | protobuf 2.28.0
    # Title: Crash due to uncontrolled recursion in protobuf crate
    # Severity: (no CVSS assigned, crash/DoS class)
    # Transitive path: protobuf → prometheus 0.13.4 → shared-rs/sed-core/searcher-rs
    # Bump risk: protobuf v3 is a MAJOR semver break; prometheus 0.13 pins
    #   protobuf 2.x. Upgrading would require prometheus major bump which
    #   touches shared-rs and sed-core (hot-path metrics instrumentation).
    # Exploitability: Only reachable if attacker controls deeply nested
    #   protobuf messages parsed by prometheus text format — not exposed
    #   externally in this service (internal metrics only).
    # Upstream issue: https://github.com/stepancheg/rust-protobuf/issues/669
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2024-0437
    # Planned migration: Separate PR — bump prometheus + protobuf post-OMEGA
    # Expiry: 2026-08-01
    "RUSTSEC-2024-0437",

    # ----------------------------------------------------------------
    # RUSTSEC-2025-0009 | ring 0.16.20
    # Title: Some AES functions may panic when overflow checking is enabled
    # Severity: (no CVSS; panic/DoS under debug overflow checks)
    # Transitive path: ring 0.16 → jsonwebtoken 8.3.0 → ethers-providers 2.0.14
    #   → ethers 2.0.14 → simulator-v2/sim-ctl/searcher-rs/shared-rs
    # Bump risk: ring 0.17.x is a MAJOR API break. jsonwebtoken 8.x pins
    #   ring 0.16. Upgrading requires jsonwebtoken major bump (9.x), which
    #   changes the ethers-providers JWT auth integration — breaks ethers 2.x
    #   compatibility and touches the quantum engine transport layer.
    # Exploitability: Panic only triggers with overflow-check builds (debug).
    #   Release builds (CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=false) are NOT
    #   affected. CI runs release builds for the hot-path.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2025-0009
    # Upstream: https://github.com/briansmith/ring/issues/2010
    # Planned migration: Migrate ethers→alloy (in progress); ring 0.16 will
    #   be eliminated when ethers stack is retired.
    # Expiry: 2026-08-01
    "RUSTSEC-2025-0009",

    # ----------------------------------------------------------------
    # RUSTSEC-2023-0071 | rsa 0.9.10
    # Title: Marvin Attack — potential RSA key recovery via timing side-channel
    # Severity: CVSS 5.9 (Medium)
    # Transitive path: rsa 0.9.10 → sqlx-mysql 0.7.4 → sqlx 0.7.4
    #   → token-enricher/sim-ctl/shared-rs/sed-core/searcher-rs
    # Bump risk: NO fixed version available upstream (advisory explicitly
    #   states "No fixed upgrade is available!"). rsa crate maintainer has
    #   not released a patch as of 2026-05-16. Forced upgrade would require
    #   sqlx major bump (0.8.x), which is a separate tracked migration.
    # Exploitability: Timing attack requires local measurement of RSA decrypt
    #   operations. This service uses rsa only through sqlx-mysql TLS
    #   handshake authentication (not for application-level RSA decryption).
    #   Attack requires attacker to have network adjacency and millions of
    #   repeated queries — impractical in the isolated DB network segment.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2023-0071
    # Upstream tracking: https://github.com/RustCrypto/RSA/issues/19
    # Planned migration: sqlx 0.8 bump — separate PR after OMEGA stabilization
    # Expiry: 2026-09-01
    "RUSTSEC-2023-0071",

    # ----------------------------------------------------------------
    # RUSTSEC-2026-0099 | rustls-webpki 0.101.7
    # Title: Name constraints accepted for certificates asserting wildcard names
    # Severity: (TLS certificate validation bypass — high impact class)
    # Transitive path: rustls-webpki 0.101.7 → rustls 0.21.12
    #   → tungstenite 0.20.1 → tokio-tungstenite 0.20.1
    #   → ethers-providers 2.0.14 → ethers 2.0.14 (full stack)
    #   Also: tokio-rustls 0.24.1 → reqwest 0.11.27 → ethers stack
    # Bump risk: rustls-webpki 0.103.x requires rustls 0.22/0.23 which
    #   requires tokio-rustls 0.25/0.26 and tungstenite 0.24+. This is a
    #   full TLS stack upgrade that breaks ethers 2.x (which pins
    #   rustls 0.21/tokio-tungstenite 0.20). The ethers→alloy migration
    #   (in progress) will naturally resolve this — alloy uses rustls 0.23.
    # Exploitability: Only exploitable if an attacker can present a
    #   specially-crafted TLS certificate to this client. Since connections
    #   go to known blockchain node endpoints (not arbitrary servers) and
    #   pinned via environment config, the attack surface is minimal.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2026-0099
    # Planned migration: Retire ethers stack → alloy migration PR
    # Expiry: 2026-08-01
    "RUSTSEC-2026-0099",

    # ----------------------------------------------------------------
    # RUSTSEC-2026-0098 | rustls-webpki 0.101.7
    # Title: Name constraints for URI names were incorrectly accepted
    # Severity: (TLS URI name constraint bypass)
    # Transitive path: same as RUSTSEC-2026-0099 above — same crate/version
    #   in the ethers TLS stack (rustls 0.21 path)
    # Bump risk: identical to RUSTSEC-2026-0099 — cannot bump rustls-webpki
    #   in isolation without breaking ethers 2.x TLS chain.
    # Exploitability: URI name constraints are a niche X.509 feature rarely
    #   used in blockchain node TLS certificates; attack surface is theoretical.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2026-0098
    # Planned migration: Retire ethers stack → alloy migration PR
    # Expiry: 2026-08-01
    "RUSTSEC-2026-0098",

    # ----------------------------------------------------------------
    # RUSTSEC-2026-0104 | rustls-webpki 0.101.7 AND 0.103.12
    # Title: Reachable panic in certificate revocation list (CRL) parsing
    # Severity: (DoS via malformed CRL — crash in TLS layer)
    # Transitive paths:
    #   (a) rustls-webpki 0.101.7 → rustls 0.21.12 → ethers TLS stack
    #   (b) rustls-webpki 0.103.12 → rustls-platform-verifier 0.7.0
    #       → reqwest 0.13.3 → alloy-transport-http 1.8.3 → alloy stack
    # Bump risk for 0.101.7 path: same as 0099/0098 above.
    # Bump risk for 0.103.12 path: fix requires >=0.103.13. This affects
    #   the alloy stack via rustls-platform-verifier. A targeted patch bump
    #   of rustls-webpki 0.103.12 → 0.103.13 may be safe but requires
    #   Cargo.lock surgery and verification that rustls-platform-verifier
    #   0.7.0 accepts the patch. Deferred to post-OMEGA patch PR.
    # Exploitability: CRL parsing panic requires attacker to control CRL
    #   distribution point responses — not applicable to internal blockchain
    #   node connections which do not use CRL-based revocation.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2026-0104
    # Planned migration: (a) ethers→alloy; (b) targeted rustls-webpki patch PR
    # Expiry: 2026-07-01
    "RUSTSEC-2026-0104",

    # ----------------------------------------------------------------
    # RUSTSEC-2024-0363 | sqlx 0.7.4
    # Title: Binary Protocol Misinterpretation caused by Truncating/Overflowing Casts
    # Severity: (data corruption class — incorrect query results possible)
    # Transitive path: sqlx 0.7.4 → token-enricher/sim-ctl/shared-rs
    #   /sed-core/searcher-rs/relays-client/recon/prioritization-spine
    # Bump risk: sqlx 0.8.x is a MAJOR semver break with async runtime
    #   changes and macro API differences. Direct usage in sed-core and
    #   shared-rs means this touches the quantum engine's data access layer.
    #   Validated upgrade path requires full integration test suite pass.
    # Exploitability: Overflow in cast affects specific integer boundary
    #   values in binary protocol encoding. In practice, affected only when
    #   values near i32::MAX or u64 boundaries are stored/retrieved.
    #   Current schema uses bounded integers (token amounts, block numbers)
    #   that do not reach these boundaries under normal operation.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2024-0363
    # Planned migration: sqlx 0.8 upgrade — separate PR with full DB test suite
    # Expiry: 2026-08-01
    "RUSTSEC-2024-0363",

    # ----------------------------------------------------------------
    # RUSTSEC-2026-0002 | lru 0.12.5
    # Title: IterMut violates Stacked Borrows — invalidates internal pointer
    # Severity: (unsound — potential UB when using IterMut)
    # Transitive path: lru 0.12.5 → searcher-rs 0.1.0
    #                               → prioritization-spine 0.1.0 → searcher-rs
    # Bump risk: lru is a direct dependency of searcher-rs. A patch bump
    #   to a fixed version must be identified (no fixed version confirmed
    #   in advisory). If lru 0.13+ exists with the fix, the bump may be
    #   feasible but requires searcher-rs integration verification.
    # Exploitability: UB only via IterMut — requires code paths that use
    #   mutable iteration over LRU cache simultaneously. Current searcher-rs
    #   usage is single-threaded read-heavy; IterMut is not called in
    #   hot-path execution. Flagged for immediate review in post-OMEGA audit.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2026-0002
    # Planned migration: Audit searcher-rs lru usage; patch bump if safe
    # Expiry: 2026-07-15
    "RUSTSEC-2026-0002",

    # ----------------------------------------------------------------
    # RUSTSEC-2024-0388 | derivative 2.2.0
    # Warning type: unmaintained
    # Title: `derivative` is unmaintained; consider using an alternative
    # Transitive path: derivative → ark-ff (0.3.0, 0.4.2, 0.5.0) → ruint
    #   → alloy-primitives 1.5.7/0.7.7/0.4.2 → entire alloy stack
    #   Also: derivative → simba 0.8.1 → nalgebra 0.32.6 → sed-core 1.1.0
    # Bump risk: derivative is pulled by ark-ff (ZK math library) and
    #   nalgebra (linear algebra for quantum engine). Replacing derivative
    #   requires upstream changes in ark-ff and nalgebra — not within scope
    #   of this repo. No alternative proc-macro is drop-in compatible.
    # Risk assessment: "unmaintained" warning only — no CVE, no known exploit.
    #   Last commit was functional and no security issues have been reported.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2024-0388
    # Planned migration: Track ark-ff upstream for derivative replacement
    # Expiry: 2026-10-01
    "RUSTSEC-2024-0388",

    # ----------------------------------------------------------------
    # RUSTSEC-2025-0057 | fxhash 0.2.1
    # Warning type: unmaintained
    # Title: fxhash - no longer maintained
    # Transitive path: fxhash → hashers 1.0.1 → ethers-providers 2.0.14
    #   → ethers 2.0.14 → simulator-v2/sim-ctl/shared-rs/etc.
    # Bump risk: fxhash is pulled transitively via hashers, which is pulled
    #   by ethers-providers. Cannot upgrade without ethers major version bump.
    #   Retiring ethers for alloy (in progress) eliminates this dependency.
    # Risk assessment: "unmaintained" warning only — fxhash implements a
    #   non-cryptographic hash function. No security vulnerability reported.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2025-0057
    # Planned migration: Retire ethers → alloy migration eliminates this
    # Expiry: 2026-08-01
    "RUSTSEC-2025-0057",

    # ----------------------------------------------------------------
    # RUSTSEC-2024-0384 | instant 0.1.13
    # Warning type: unmaintained
    # Title: `instant` is unmaintained
    # Transitive path: instant → ethers-providers 2.0.14 / ethers-middleware
    #   2.0.14 → ethers 2.0.14 → full internal stack
    # Bump risk: instant is a WASM-compatible time abstraction used internally
    #   by ethers-providers. No direct replacement exists that is compatible
    #   with ethers 2.x API without code changes in ethers itself.
    # Risk assessment: "unmaintained" warning only — no CVE. instant 0.1.13
    #   is functionally stable and correct for its use case (monotonic time).
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2024-0384
    # Planned migration: Retire ethers → alloy migration eliminates this
    # Expiry: 2026-08-01
    "RUSTSEC-2024-0384",

    # ----------------------------------------------------------------
    # RUSTSEC-2024-0436 | paste 1.0.15
    # Warning type: unmaintained
    # Title: paste - no longer maintained
    # Transitive path: paste → syn-solidity 1.5.7 → alloy-sol-macro-input
    #   → alloy-sol-macro-expander → alloy-sol-macro → alloy-sol-types
    #   → token-enricher/shared-rs/searcher-rs/alloy-rpc-types-eth/etc.
    #   Also: paste → sqlx-core 0.7.4 → full sqlx stack
    #         paste → simba 0.8.1 → nalgebra → sed-core
    # Bump risk: paste is used in alloy's proc-macro system (syn-solidity)
    #   and in sqlx internals. No maintained drop-in replacement exists that
    #   is API-compatible. This requires upstream changes in alloy and sqlx.
    # Risk assessment: "unmaintained" warning only — paste is a stable
    #   proc-macro crate with no known security issues. The functionality
    #   (token pasting) is well-defined and unlikely to introduce bugs.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2024-0436
    # Planned migration: Track alloy + sqlx upstream for paste replacement
    # Expiry: 2026-10-01
    "RUSTSEC-2024-0436",

    # ----------------------------------------------------------------
    # RUSTSEC-2025-0010 | ring 0.16.20
    # Warning type: unmaintained
    # Title: Versions of *ring* prior to 0.17 are unmaintained
    # Transitive path: ring 0.16 → jsonwebtoken 8.3.0 → ethers-providers 2.0.14
    #   (same path as RUSTSEC-2025-0009 above)
    # Bump risk: identical to RUSTSEC-2025-0009 — ring 0.17 breaks
    #   jsonwebtoken 8.x API; ethers 2.x pins jsonwebtoken 8.x.
    # Risk assessment: "unmaintained" warning — covered by the vuln ignore
    #   for RUSTSEC-2025-0009. Same crate, same migration path (ethers→alloy).
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2025-0010
    # Planned migration: Retire ethers → alloy migration eliminates ring 0.16
    # Expiry: 2026-08-01
    "RUSTSEC-2025-0010",

    # ----------------------------------------------------------------
    # RUSTSEC-2025-0134 | rustls-pemfile 1.0.4
    # Warning type: unmaintained
    # Title: rustls-pemfile is unmaintained
    # Transitive path: rustls-pemfile 1.0.4 → sqlx-core 0.7.4 → full sqlx
    #   stack (token-enricher/sim-ctl/shared-rs/sed-core/etc.)
    #   Also: → reqwest 0.11.27 → ethers stack
    # Bump risk: rustls-pemfile 2.x (the maintained successor) has breaking
    #   API changes. sqlx 0.7.x pins rustls-pemfile 1.x. Upgrading requires
    #   sqlx 0.8 bump (already tracked). reqwest 0.11 also pins
    #   rustls-pemfile 1.x — upgrading requires reqwest 0.12+ which requires
    #   ethers major changes.
    # Risk assessment: "unmaintained" warning only — no CVE. PEM file parsing
    #   for TLS certificates is stable and well-tested in this version.
    # Advisory URL: https://rustsec.org/advisories/RUSTSEC-2025-0134
    # Planned migration: sqlx 0.8 + reqwest 0.12 bumps in separate PRs
    # Expiry: 2026-08-01
    "RUSTSEC-2025-0134",
]

# ============================================================
# Database configuration — use official RustSec advisory DB
# ============================================================
[database]
url = "https://github.com/RustSec/advisory-db.git"
path = "~/.cargo/advisory-db"
fetch = true
stale = false
