[workspace]

[package]
name = "gpu-evm-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Activar solo cuando se enchufa un backend CUDA/OpenCL real (cuEVM, sputnikvm-gpu).
cuda-real = []

[dependencies]
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1.41", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.41", features = ["full", "test-util"] }
