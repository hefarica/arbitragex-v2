# clippy.toml — EDGE-HARD-2 (2026-08-20).
#
# HONEST scope: these are the ONLY keys proposed in the operator's hardening
# pass that actually exist in clippy's configuration surface. They tighten
# two standard lints — they do NOT "prevent stack overflows" or "detect
# infinite loops" (no clippy.toml key does; that claim came from the rejected
# v1 proposal and is documented here so nobody re-believes it).
#
#   too-many-arguments-threshold — flags functions taking more args than this
#                                  (default 7); tightened to 6 to push hot-path
#                                  plumbing toward struct params.
#   type-complexity-threshold    — flags overly complex type signatures;
#                                  250 is clippy's default, pinned explicitly
#                                  so drift upward is a visible diff.
too-many-arguments-threshold = 6
type-complexity-threshold = 250
