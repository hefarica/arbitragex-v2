[package]
name = "token-enricher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "token-enricher"
path = "src/main.rs"

[dependencies]
shared-rs = { path = "../shared-rs" }
alloy = { version = "1.0", features = ["full"] }
alloy-primitives = "1.0"
alloy-sol-types = "1.0"
alloy-provider = { version = "1.0", features = ["ws"] }
alloy-rpc-types = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres","runtime-tokio-rustls","chrono","macros","migrate"] }
redis = { version = "0.24", features = ["tokio-comp","streams"] }
reqwest = { version = "0.11", features = ["rustls-tls","json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","json"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
prometheus = "0.14"
hex = "0.4"
# Added for Task 8: parallel TrustWallet HEAD requests (Defect #2 fix).
futures-util = "0.3"
# Added for Task 8: Lazy static metrics registry.
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
