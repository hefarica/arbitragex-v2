name: Ω-S5++ Probe cookies deep (READ-ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VPS_HOST: 195.201.235.70

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/arbx_key
          chmod 600 ~/.ssh/arbx_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Deep probe cookies + auth"
        run: |
          ssh -i ~/.ssh/arbx_key root@${{ env.VPS_HOST }} 'bash -s' << 'REMOTE'
            set +e
            ADMIN_TOKEN=$(grep -E '^ARBX_ADMIN_TOKEN=' /opt/arbitragex-v2/.env | cut -d= -f2-)
            echo "═══ Headers RAW de POST /admin/session ═══"
            curl -s -D - -o /dev/null -m 5 -X POST \
              -H "content-type: application/json" \
              -d "{\"token\":\"$ADMIN_TOKEN\"}" \
              http://localhost:8787/admin/session 2>&1 | head -30
            echo ""
            echo "═══ Backend api-server: cómo gating chains (GET con header x-arbx-admin-token directo) ═══"
            curl -s -o /dev/null -w "  http %{http_code}\n" -m 5 \
              -H "x-arbx-admin-token: $ADMIN_TOKEN" \
              http://localhost:8080/api/v1/admin/chains
            echo ""
            echo "═══ Backend api-server: sin header ═══"
            curl -s -o /dev/null -w "  http %{http_code}\n" -m 5 \
              http://localhost:8080/api/v1/admin/chains
            echo ""
            echo "═══ Backend api-server: con header bogus ═══"
            curl -s -o /dev/null -w "  http %{http_code}\n" -m 5 \
              -H "x-arbx-admin-token: bogus" \
              http://localhost:8080/api/v1/admin/chains
            echo ""
            echo "═══ Edge :8787 — GET /api/admin/chains con header x-arbx-admin-token directo ═══"
            curl -s -o /dev/null -w "  http %{http_code}\n" -m 5 \
              -H "x-arbx-admin-token: $ADMIN_TOKEN" \
              http://localhost:8787/api/admin/chains
            echo ""
            echo "═══ Logs recientes edge ═══"
            docker logs arbitragex-v2-edge-1 --tail 30 2>&1 | grep -i 'admin\|cookie\|session\|401' | head -20
            echo ""
            echo "═══ Versión edge en VPS — ¿es dev-local o worker? ═══"
            docker inspect arbitragex-v2-edge-1 --format '{{.Config.Image}} | {{range .Config.Cmd}}{{.}} {{end}}' 2>&1
            echo ""
            echo "═══ Archivos del edge dentro del contenedor (top-level) ═══"
            docker exec arbitragex-v2-edge-1 ls -la /app 2>&1 | head -20
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/arbx_key
