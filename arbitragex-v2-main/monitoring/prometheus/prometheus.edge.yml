global:
  scrape_interval: 5s      # Alta frecuencia para resolución estocástica
  evaluation_interval: 5s
  external_labels:
    edge_node: 'edge-001'
    cluster: 'omega-edge'

scrape_configs:
  - job_name: 'sed-core'
    static_configs:
      - targets: ['sed-core:9001']
    metrics_path: /metrics
    scrape_interval: 2s     # Sub-segundo para el hot-path

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['db:9187']
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
