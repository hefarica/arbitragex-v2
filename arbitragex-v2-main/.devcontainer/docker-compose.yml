name: arbx-frontend-devcontainer

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sleep infinity
    init: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_EDGE_URL: ${NEXT_PUBLIC_EDGE_URL:-http://localhost:8787}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
      NEXT_PUBLIC_WSS_URL: ${NEXT_PUBLIC_WSS_URL:-http://localhost:3000}
      INTERNAL_EDGE_URL: ${INTERNAL_EDGE_URL:-http://host.docker.internal:8787}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/workspace:cached
      - arbx_node_modules:/workspace/node_modules
      - arbx_frontend_next:/workspace/frontend/.next
      - arbx_frontend_node_modules:/workspace/frontend/node_modules

volumes:
  arbx_node_modules:
  arbx_frontend_next:
  arbx_frontend_node_modules:
