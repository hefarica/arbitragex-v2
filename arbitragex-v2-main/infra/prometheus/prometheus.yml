global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: arbitragex-v2
    replica: '{{.ExternalURL}}'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: api-server
    static_configs:
      - targets: ['api-server:8080']
    metrics_path: /metrics

  - job_name: edge
    static_configs:
      - targets: ['edge:8787']
    metrics_path: /metrics

  - job_name: selector-api
    static_configs:
      - targets: ['selector-api:3002']
    metrics_path: /metrics

  - job_name: token-enricher
    static_configs:
      - targets: ['token-enricher:9004']
    metrics_path: /metrics

  - job_name: sim-ctl
    static_configs:
      - targets: ['sim-ctl:3003']
    metrics_path: /metrics

  - job_name: recon
    static_configs:
      - targets: ['recon:3004']
    metrics_path: /metrics

  - job_name: relays-client
    static_configs:
      - targets: ['relays-client:3005']
    metrics_path: /metrics

  - job_name: searcher-rs
    static_configs:
      - targets: ['searcher-rs:3000']
    metrics_path: /metrics

  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
