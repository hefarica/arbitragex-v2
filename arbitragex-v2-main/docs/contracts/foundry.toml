[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

# Solidity
solc = "0.8.19"
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing
fuzz_runs = 1000
fuzz_max_local_rejects = 1024
fuzz_max_global_rejects = 65536
fuzz_seed = '0x3e8'

# Invariant testing
invariant_runs = 256
invariant_depth = 32
invariant_fail_on_revert = false
invariant_call_override = false

# Gas reporting
gas_reports = ["*"]
gas_reports_ignore = []

# ETH-RPC
eth_rpc_url = "${RPC_URL}"

# Etherscan for verification (optional)
etherscan_api_key = "${ETHERSCAN_API_KEY}"

[profile.ci]
fuzz_runs = 10000
invariant_runs = 1024
verbosity = 4

[profile.gas]
gas_reports = ["Executor", "UniswapV2Adapter", "UniswapV3Adapter", "FlashloanProvider", "SignatureValidator"]
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
mainnet = "${RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
base = "${BASE_RPC_URL}"
