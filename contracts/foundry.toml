[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# M2 Capa1 Fase 9 (P1-7): fuzz/invariant budget for contract coverage.
# Forge's default fuzz runs (256) and invariant runs (32) are too low to
# surface subtle invariants in pre-execution simulation guards. The
# Capa 1 audit flagged this as P1-7 ("contracts cubiertos only with
# basic forge test"). Bumping to 1000/256 keeps CI under the 15-min
# job timeout while giving the fuzzer enough budget to surface integer-
# arithmetic and call-graph regressions.
[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
holesky = "${HOLESKY_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
holesky = { key = "${ETHERSCAN_API_KEY}", url = "https://api-holesky.etherscan.io/api" }
