# ═══════════════════════════════════════════════════════════════
# DOCKER COMPOSE — EDGE NODE ORQUESTATION
# Proyecto OMEGA — Nodo de Borde Completo
# SOP-EDGE-001 §5.2
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ═══════════════════════════════════════════════════════════
  # SERVICIO PRINCIPAL: sed-core (Hot-path Rust)
  # Feature: paper-shadow (CERO capital expuesto)
  # ═══════════════════════════════════════════════════════════
  sed-core:
    build:
      context: ./backend
      dockerfile: searcher-rs/Dockerfile.edge
    container_name: omega-sed-core
    restart: unless-stopped

    # Recursos dedicados (evitar contención)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

    # Variables de entorno desde archivo externo (GHOST PROTOCOL)
    env_file:
      - .env.edge

    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - SED_FEATURE=paper-shadow
      - SED_EDGE_NODE_ID=edge-001

    ports:
      - "9001:9001"    # Métricas Prometheus
      - "8080:8080"    # API interna (solo localhost)

    networks:
      - omega-edge-net

    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started

    # Aislamiento de seguridad
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ═══════════════════════════════════════════════════════════
  # BASE DE DATOS: PostgreSQL 16
  # ═══════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: omega-db
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    env_file:
      - .env.edge

    environment:
      - POSTGRES_DB=omega_edge
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:5432:5432"  # Solo localhost — NUNCA expuesto público

    networks:
      - omega-edge-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d omega_edge"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    # Optimizaciones PostgreSQL para alta frecuencia
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5242kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2

  # ═══════════════════════════════════════════════════════════
  # TELEMETRÍA: Prometheus
  # ═══════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: omega-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.edge.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"    # Scrape endpoint — filtrado por UFW

    networks:
      - omega-edge-net

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # ═══════════════════════════════════════════════════════════
  # VISUALIZACIÓN: Grafana
  # ═══════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:10.4.0
    container_name: omega-grafana
    restart: unless-stopped

    env_file:
      - .env.edge

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    ports:
      - "127.0.0.1:3000:3000"  # Solo localhost + reverse proxy

    networks:
      - omega-edge-net

    depends_on:
      - prometheus

  # ═══════════════════════════════════════════════════════════
  # AGREGACIÓN DE LOGS: Loki
  # ═══════════════════════════════════════════════════════════
  loki:
    image: grafana/loki:2.9.0
    container_name: omega-loki
    restart: unless-stopped

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    ports:
      - "3100:3100"

    networks:
      - omega-edge-net

    command: -config.file=/etc/loki/local-config.yaml

  # ═══════════════════════════════════════════════════════════
  # COLECTOR DE LOGS: Promtail
  # ═══════════════════════════════════════════════════════════
  promtail:
    image: grafana/promtail:2.9.0
    container_name: omega-promtail
    restart: unless-stopped

    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro

    networks:
      - omega-edge-net

    depends_on:
      - loki

    command: -config.file=/etc/promtail/config.yml

# ═══════════════════════════════════════════════════════════════
# REDES
# ═══════════════════════════════════════════════════════════════
networks:
  omega-edge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ═══════════════════════════════════════════════════════════════
# VOLÚMENES PERSISTENTES
# ═══════════════════════════════════════════════════════════════
volumes:
  pgdata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
