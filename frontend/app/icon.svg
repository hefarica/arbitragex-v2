<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ArbitrageX">
  <defs>
    <!--
      Matches the site-header brand tile:
      conic-gradient(from 210deg, primary, info 55%, success 85%, primary)
      Approximated as a linear gradient for broad favicon support.
      Brand palette: orange #d97757, blue #6a9bcc, green #788c5d.
    -->
    <linearGradient id="arbx-brand" x1="10%" y1="10%" x2="95%" y2="95%">
      <stop offset="0%"   stop-color="#d97757"/>
      <stop offset="55%"  stop-color="#6a9bcc"/>
      <stop offset="90%"  stop-color="#788c5d"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#arbx-brand)"/>
  <!-- Inner stroke ring to keep edge crisp on light/dark browser chrome. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none"
        stroke="rgba(20,20,19,0.25)" stroke-width="1"/>
</svg>
