# QuantumX Control Plane — Nginx Reverse Proxy with HTTP Basic Auth
# Bóveda Institucional: auth_basic protects the frontend from unauthorized access.
# The frontend container MUST NOT expose port 3000 externally.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Security headers — institutional grade
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; font-src 'self';" always;

    # Hide server version
    server_tokens off;

    # Rate limiting — prevent brute force on auth
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    upstream quantumx_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # HTTP Basic Auth — Bóveda Institucional
        auth_basic "QuantumX Control Plane — Authorized Operators Only";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Rate limit on all requests
        limit_req zone=auth_zone burst=20 nodelay;

        # Proxy to frontend (internal only, never exposed)
        location / {
            proxy_pass http://quantumx_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Next.js HMR in dev, Socket.IO in prod)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Health check endpoint — bypass auth for monitoring
        location = /nginx-health {
            auth_basic off;
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
