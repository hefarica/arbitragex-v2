# SEC-EDGE-BYPASS-01 — el edge pasa a estar detrás de nginx (origen de Cloudflare).
#
# Por qué nginx y no validación en el edge: el edge corre como contenedor con
# `userland-proxy` activo, así que TODOS los clientes externos se ven como
# 172.18.0.1 (medido: docker-proxy termina la conexión y abre otra). Una allowlist
# por IP de socket en el edge no puede distinguir Cloudflare de un atacante, y una
# basada en el header `CF-Connecting-IP` es falsificable (en acceso directo lo pone
# el cliente). nginx corre en el HOST, no detrás de docker-proxy: SÍ ve la IP real.
#
# `map` (contexto http, válido aquí porque este fichero se incluye dentro de http{}):
# evita reenviar un `CF-Connecting-IP` VACÍO, que en JS `"" ?? x` no cae al fallback
# y colapsaría a todos esos clientes en el mismo bucket de rate limit.
map $http_cf_connecting_ip $arbx_edge_client_ip {
    ""      $remote_addr;             # sin header -> el peer (borde de Cloudflare)
    default $http_cf_connecting_ip;   # valor de Cloudflare (confiable: solo CF llega)
}

server {
    listen 80;
    listen [::]:80;
    server_name 195.201.235.70;

    # SEC-NEXT-IMGOPT-01 — cerrar la Image Optimization API de Next.js en el borde.
    #
    # Por qué: esta app NO usa el optimizador (0 imports de `next/image` y sin bloque
    # `images` en frontend/next.config.js), pero el endpoint existe igual por defecto en
    # Next.js y es la superficie de GHSA-2xp9-vwfh-vxw4 ("Unauthenticated RCE in Image
    # Optimization API when AVIF files are used", critical, rango >=10.0.0 <15.5.24).
    # El bundle desplegado SÍ carga el path AVIF (image-optimizer.js contiene
    # `avifQuality` e `image/avif`), y el bloqueo cross-site incorporado de Next.js
    # EXCLUYE explícitamente `/_next/image` (block-cross-site.js: isIgnoredRequest),
    # así que no hay protección propia: el endpoint acepta peticiones cross-site.
    #
    # Coste funcional: CERO — ninguna vista consume el optimizador.
    # Prefijo `^~` (no regex, prioridad sobre `location /`): cubre `/_next/image` y
    # `/_next/image/...`. Los assets reales `/_next/static/*` NO se ven afectados.
    #
    # NOTA: esto cierra SOLO la vía :80 (nginx). El frontend también publica
    # 0.0.0.0:5173 en docker/compose.prod.yml, por lo que `http://<IP>:5173/_next/image`
    # sigue siendo alcanzable desde Internet y NO pasa por este bloque. El cierre real
    # requiere rebindear ese puerto a 127.0.0.1 (ver SEC-EDGE-FRONT-EXPOSURE-01).
    location ^~ /_next/image {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # SEC-EDGE-BYPASS-01: el edge se movió a 127.0.0.1:8788 (el 8787 del host lo
        # ocupa ahora el server de origen de Cloudflare, más abajo). Apuntar aquí a
        # 8787 daría un salto nginx→nginx→edge y, sin el `allow 127.0.0.1`, un 403.
        proxy_pass http://127.0.0.1:8788/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080/socket.io/; # RULE 02: WS directo a api-server, nunca via edge (fix POLLING 2026-08-20)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


}

# SEC-EDGE-BYPASS-01 — origen del edge: SOLO Cloudflare.
#
# Antes: docker/compose.prod.yml publicaba el edge en 0.0.0.0:8787, alcanzable
# desde Internet sin pasar por Cloudflare. Medido: `http://195.201.235.70:8787/
# api/opportunities/live` devolvía 200 con 167 KB de datos, con el rate limit
# spoofeable vía X-Forwarded-For y los 403 por ASN/threatScore SALTADOS (el edge
# sólo los aplica si `request.cf` existe, y `request.cf` lo puebla únicamente el
# runtime de Cloudflare).
#
# Ahora el edge se publica en 127.0.0.1:8788 y este server es el único camino:
# `deny all` + allowlist de los rangos oficiales de Cloudflare.
#
# Lista vendorizada a propósito (NO se descarga en tiempo de instalación): un
# `curl` fallido dejaría la lista vacía y, con `deny all`, el edge quedaría
# inalcanzable incluso para Cloudflare -> API caída. Aquí es revisable en un PR.
# Fuente: https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6
# (verificado 2026-09-30). Cloudflare las cambia ~anualmente: actualizar = PR.
#
# Nota: esto es inmune al cron `arbx-firewall-monitor` porque no usa iptables.
server {
    listen 8787;
    listen [::]:8787;

    # ── Loopback: consumidores locales y monitorización ──────────────────────
    # El edge YA NO está publicado en 8787 (ahora vive en 127.0.0.1:8788). Estos
    # `allow` preservan a TODOS los consumidores que asumían 127.0.0.1:8787 = edge:
    #   · nginx mismo (`location /api/` del server :80)
    #   · smoke de cada deploy  (auto-deploy-vps.yml:433,463)
    #   · auditorías            (audit-vps-wiring.yml:265, c10-f1-recovery:209,
    #                            cartridge-v3-deploy.yml:180)
    #   · deploy edge-only      (health, /admin/session, /api/admin/chains)
    #   · diag-cookie-emission.yml
    #   · comandos manuales del operador (`curl 127.0.0.1:8787/health`)
    # No abre nada hacia Internet: un atacante remoto nunca llega desde 127.0.0.1,
    # y para tener acceso local ya necesitaría SSH (es decir, estar dentro).
    allow 127.0.0.1;
    allow ::1;

    # ── Cloudflare IPv4 (15 rangos) ──────────────────────────────────────────
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;

    # ── Cloudflare IPv6 (7 rangos) ───────────────────────────────────────────
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;

    deny all;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # IP del cliente final: la resolvió Cloudflare. Se reenvía tal cual
        # (solo CF puede llegar aquí, así que el valor es confiable) y si viniera
        # vacía se usa el peer mediante el `map` de arriba.
        proxy_set_header CF-Connecting-IP $arbx_edge_client_ip;
        # IP del borde de Cloudflare que nos habla — diagnóstico y verificación.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
