version: '3.8'

services:
  backend:
    build:
      context: ./backend/semiotic-bridge
      dockerfile: Dockerfile
    container_name: arbex-semiotic
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    networks:
      - arbitrage-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arbex-frontend
    ports:
      - "5173:5173"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/translate
    depends_on:
      - backend
    networks:
      - arbitrage-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: arbex-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - arbitrage-network
    restart: unless-stopped

networks:
  arbitrage-network:
    driver: bridge
