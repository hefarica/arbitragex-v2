upstream frontend { server frontend:5173; }
upstream edge     { server edge:8787; }

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
  listen 80;
  server_name _;

  add_header X-Frame-Options           "DENY" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self';" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript;

  location / {
    limit_req zone=general burst=50 nodelay;
    limit_conn addr 50;
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_conn addr 10;
    proxy_pass http://edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/ {
    limit_req zone=ws burst=100 nodelay;
    proxy_pass http://edge;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location /health {
    access_log off;
    return 200 "nginx ok\n";
    add_header Content-Type text/plain;
  }
}
