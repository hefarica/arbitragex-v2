upstream frontend { server frontend:5173; }
upstream edge     { server edge:8787; }

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
  listen 80;
  server_name _;

  add_header X-Frame-Options           "DENY" always;
  add_header X-Content-Type-Options    "nosniff" always;
  # X-XSS-Protection is legacy (superseded by CSP) and its `1; mode=block` filter
  # is a no-op in current browsers; the honest value is `0`. Measured 2026-10-18
  # on the edge host: the response carried the header TWICE and contradictory
  # (`0` from Cloudflare + `1; mode=block` from here). Setting it to `0` removes
  # the semantic contradiction (one emitter per header is the general rule;
  # X-Frame-Options / etc. remain here as this layer's single declaration).
  add_header X-XSS-Protection          "0" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  # G-EDGE-CSP-SINGLE-01 / WO-09 constraint — nginx MUST NOT emit a CSP.
  # The Content-Security-Policy is owned by the application layer:
  #   · edge worker  → `default-src 'none'; frame-ancestors 'none'` (JSON API)
  #   · Next headers() → the browser policy, built from NEXT_PUBLIC_EDGE_URL/WS_URL
  # A static policy here INTERSECTS the app's header (the effective policy is the
  # most restrictive one) and previously carried `http://127.0.0.1:...` into prod.
  # See docs/operations/EDGE-CSP-SINGLE-01.md.
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript;

  location / {
    limit_req zone=general burst=50 nodelay;
    limit_conn addr 50;
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_conn addr 10;
    proxy_pass http://edge;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /ws/ {
    limit_req zone=ws burst=100 nodelay;
    proxy_pass http://edge;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
  }

  location /health {
    access_log off;
    return 200 "nginx ok\n";
    add_header Content-Type text/plain;
  }
}
