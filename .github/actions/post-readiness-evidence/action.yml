name: 'Post readiness evidence'
description: >-
  Deliver and read back readiness evidence through configured HTTP endpoints,
  then SSH with Docker-discovered published ports, bridge IPs or API-container
  execution. Failed routes are reported without credentials. If every route
  fails, the action fails and preserves the payload as an artifact for retry.

inputs:
  payload_file:
    description: 'Path to the JSON payload {gate_id,item_key,status,evidence_ref,detail,verified_by}'
    required: false
    default: evidence-payload.json
  evidence_url:
    description: 'secrets.ARBX_READINESS_EVIDENCE_URL — full POST URL (empty = not provisioned)'
    required: false
    default: ''
  evidence_urls:
    description: 'Optional JSON array of additional configured registry HTTPS URLs'
    required: false
    default: '[]'
  compose_file:
    description: 'Compose file relative to the deployed repository'
    required: false
    default: 'docker/compose.prod.yml'
  api_service:
    description: 'Compose service implementing the evidence registry'
    required: false
    default: 'api-server'
  admin_token:
    description: 'secrets.ARBX_ADMIN_TOKEN (empty = not provisioned)'
    required: false
    default: ''
  ssh_key:
    description: 'secrets.VPS_SSH_KEY — private key for the tunnel transport'
    required: false
    default: ''
  ssh_host:
    description: 'secrets.VPS_SSH_HOST'
    required: false
    default: ''
  ssh_port:
    description: 'secrets.VPS_SSH_PORT'
    required: false
    default: '22'
  ssh_user:
    description: 'secrets.VPS_SSH_USER'
    required: false
    default: ''
  deploy_path:
    description: 'secrets.VPS_DEPLOY_PATH — repo root on the VPS (holds .env with ARBX_ADMIN_TOKEN)'
    required: false
    default: '/opt/arbitragex-v2'

runs:
  using: composite
  steps:
    - name: Discover available transports and verify evidence delivery
      id: delivery
      shell: bash
      env:
        PAYLOAD_FILE: ${{ inputs.payload_file }}
        EVIDENCE_URL: ${{ inputs.evidence_url }}
        EVIDENCE_URLS: ${{ inputs.evidence_urls }}
        ADMIN_TOKEN: ${{ inputs.admin_token }}
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_PORT: ${{ inputs.ssh_port }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
        COMPOSE_FILE: ${{ inputs.compose_file }}
        API_SERVICE: ${{ inputs.api_service }}
      run: python3 scripts/ci/evidence_delivery.py

    - name: Preserve evidence if delivery fails
      if: failure() && steps.delivery.outcome == 'failure'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: readiness-undelivered-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ inputs.payload_file }}
        if-no-files-found: error
        retention-days: 30
