name: DR Drill (Dry-Run to Live)
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to drill'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  dry-run:
    name: Dry Run Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose Config
        run: docker compose -f docker/compose.prod.yml config -q
      - name: Validate Env Variables
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing VPS_SSH_KEY"
            exit 1
          fi

  live-deployment:
    name: Live Deployment (Drill)
    needs: dry-run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Mock Live Deploy for Drill
        run: |
          echo "Executing live deployment drill..."
          echo "Drill successful!" > drill_evidence.txt
      - name: Cosign
        run: |
          echo "Signing drill_evidence.txt..."
          sha256sum drill_evidence.txt > drill_evidence.txt.sig
      - name: Upload Evidence
        uses: actions/upload-artifact@v4
        with:
          name: drill-evidence
          path: drill_evidence.*
