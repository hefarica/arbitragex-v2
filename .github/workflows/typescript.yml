name: TypeScript CI

on:
  # ALWAYS run on PR→main and push→main (NO `paths:` filter). Rationale: the job
  # below ("tsc --noEmit (all workspaces)") is a REQUIRED status check under branch
  # protection. A path-filtered required check NEVER runs on PRs that don't touch
  # the filtered paths (workflow-only, Rust-only, docs-only PRs) → GitHub reports it
  # "Expected — Waiting for status" forever → the PR is permanently un-mergeable in
  # strict mode. Same deadlock class already fixed for dockerfile-audit (f949450).
  # The typecheck/test steps are now BLOCKING (FASE 1, omega/audit-fixes-20260628):
  # both are green on main, so always running is correct and never spuriously
  # blocks. DO NOT re-add a `paths:` filter while this job is a required check.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token.
permissions:
  contents: read

jobs:
  typecheck:
    name: tsc --noEmit (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          # Root package-lock.json (lockfileVersion 3) covers all npm workspaces.
          cache: npm

      - name: Install all workspace dependencies
        # Single root install resolves all workspaces (shared-ts, api-server,
        # selector-api, edge/*, frontend). `npm ci` makes package-lock.json the
        # single source of truth; if the committed lockfile lacks the Linux
        # platform-native rollup optional dependency, CI will fail honestly and
        # the lockfile must be regenerated on a Linux runner/WSL.
        run: npm ci --no-audit --no-fund

      - name: Build @arbx/shared
        # M2 Capa1 Fase 7 — order fix. Dependent workspaces
        # (selector-api, api-server, edge/*) resolve `@arbx/shared` from
        # `shared-ts/dist/`. Without this step, every tsc invocation in
        # those workspaces fails with "Cannot find module '@arbx/shared'"
        # — which is what made every typescript.yml run fail on main
        # pre-M2 (gh run list --workflow=typescript.yml: all reds were
        # "Cannot find module @arbx/shared", masking real type errors).
        run: npm run -w @arbx/shared build

      - name: Typecheck all workspaces
        # M4 hard-gate flip (FASE 1, omega/audit-fixes-20260628). The 5
        # pre-existing @arbx/api-server type errors (registry-engine.ts,
        # admin-promote-mainnet.ts, operator.ts) are CLEARED on main —
        # verified `npm run typecheck --workspaces --if-present` exits 0 across
        # all 6 workspaces (shared, selector-api, api-server, edge/*, frontend).
        # The order-fix above (build @arbx/shared) is what makes this real.
        # This is now a BLOCKING gate: typecheck failures fail the required check.
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests (workspaces)
        # Vitest tests for shared-ts, api-server, selector-api, edge/*, frontend.
        # M4 hard-gate flip (FASE 1): typecheck is green, so tests are now a
        # BLOCKING gate too. Verified `npm test --workspaces --if-present` exits 0
        # — 671 tests pass (shared 32, selector-api 51, api-server 320,
        # edge-dev-local 24, frontend 244; edge-worker has none). No live services
        # needed (the api-server ioredis ETIMEDOUT is a non-fatal no-Redis warning).
        run: npm test --workspaces --if-present
