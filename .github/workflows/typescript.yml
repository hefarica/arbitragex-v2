name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - 'shared-ts/**'
      - 'backend/api-server/**'
      - 'backend/selector-api/**'
      - 'frontend/**'
      - 'edge/worker/**'
      - 'edge/dev-local/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shared-ts/**'
      - 'backend/api-server/**'
      - 'backend/selector-api/**'
      - 'frontend/**'
      - 'edge/worker/**'
      - 'edge/dev-local/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript.yml'

# M2 Capa1 Fase 4 — read-only token.
permissions:
  contents: read

jobs:
  typecheck:
    name: tsc --noEmit (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          # Root package-lock.json (lockfileVersion 3) covers all npm workspaces.
          cache: npm

      - name: Install all workspace dependencies
        # Single npm ci at root resolves all workspaces:
        #   shared-ts, backend/api-server, backend/selector-api,
        #   edge/worker, edge/dev-local, frontend
        run: npm ci

      - name: Typecheck all workspaces
        # npm --workspaces --if-present skips packages without a typecheck script.
        run: npm run typecheck --workspaces --if-present

      - name: Build @arbx/shared
        # Dependent workspaces (selector-api, api-server, edge/*) resolve
        # @arbx/shared from `shared-ts/dist/`. Tests fail with
        # "Cannot find module '@arbx/shared'" if dist/ doesn't exist.
        run: npm run -w @arbx/shared build

      - name: Unit tests (workspaces)
        # Vitest tests for shared-ts, api-server, selector-api, edge/*, frontend.
        # M2 Capa1 Fase 7 (P1-5): hard gate. The `continue-on-error: true`
        # that was here was a TODO from spec audit re-run #2 ("tighten once
        # CI is green 5x"). PR #76 (Capa 2 hardening) closed M3 with green
        # CI, so the suite is now mature enough to block merges on test
        # regressions. The sibling `unit-tests.yml` workflow has always
        # gated on this same command — keeping them aligned removes the
        # only remaining "advisory" TS check.
        run: npm test --workspaces --if-present
