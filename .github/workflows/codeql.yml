# CodeQL SAST · Rust + TypeScript
#
# OMEGA-102 Delta Pack · 2026-05-16
# Complements .github/workflows/security.yml (cargo-audit + npm audit + gitleaks)
# by adding semantic SAST via CodeQL's security-extended query suite.
#
# Why both: cargo-audit / npm audit catch known-CVE dependencies;
# gitleaks catches committed secrets; CodeQL catches semantic bugs
# (injection, unsafe deserialization, taint flow) that don't show up
# in advisory databases.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan — Thursday 04:00 UTC (off-peak, complements security.yml Mon 06:00)
    - cron: "0 4 * * 4"

# Read-only token; CodeQL needs security-events write to publish results.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            # CodeQL Rust extractor (2025+) uses native parsing, not cargo build.
            # The only supported build-mode for Rust is 'none' (verified 2026-05-16).
            # Fix: previous 'manual' value caused fatal error
            # "Rust does not support the manual build mode".
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
