name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    # DEPLOY-GATE-FIX (2026-09-28, medido): con 30 min, `analyze (rust)` — que
    # compila el workspace en release para el extractor — terminaba CANCELADO
    # exactamente a los 30:00 (run 36444403710: 15:32:54 → 16:03:00). Como
    # `codeql.yml` está en `scripts/ci/deploy-gates.json`, el gate de deploy exige
    # una corrida EXITOSA del mismo SHA: un job cancelado bloqueaba el deploy
    # ("Wait for all deployment gates: Failing after 30m" →
    # "Deploy to VPS: Skipped") aunque el código estuviera verificado.
    # El límite se sube para que el análisis pueda TERMINAR: el gate sigue
    # existiendo y sigue bloqueando ante un fallo real de seguridad.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [typescript, rust]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild (JS/TS)
        if: matrix.language != 'rust'
        uses: github/codeql-action/autobuild@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
      - name: Build Rust
        if: matrix.language == 'rust'
        run: cd backend && cargo build --release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
