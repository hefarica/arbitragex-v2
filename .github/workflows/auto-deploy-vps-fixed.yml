name: Auto-Deploy VPS (Post-E2E)

# COMPLETE FIX: Remove workflow_run dependencies
# This ensures deployment happens when e2e succeeds, not when CI completes
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deploy"
        required: false
        default: "Manual deploy"
        type: string

permissions:
  contents: read
  deployments: write
  statuses: write
  packages: write

concurrency:
  group: auto-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy-to-VPS
    runs-on: ubuntu-latest
    if: github.event != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy
        if: env.DEPLOY_REQUIRED == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          exit 0

      - name: Complete
        run: echo "Deployment complete"
