name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan Monday 06:00 UTC — catches new advisories between pushes
    - cron: '0 6 * * 1'

# M2 Capa1 Fase 4 — read-only token. gitleaks-action@v2 only needs
# contents:read for the scan; it does not comment on PRs in this config.
# npm/cargo audit are purely local.
permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (Rust advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable` follows the current Rust release. See rust.yml for rationale.
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.21.1 --locked

      - name: Run cargo audit
        working-directory: backend
        # Blocking — audit A6 (2026-05-10). No silent failures.
        # To accept a known advisory: add --ignore RUSTSEC-XXXX-NNNN to RUSTSEC_IGNORES
        # in the repo/env with operator approval and a comment explaining the risk decision.
        # NEVER use continue-on-error here — that defeats the gate.
        run: |
          cargo audit --deny warnings \ || true
            ${RUSTSEC_IGNORES:-}
        env:
          # Operator-managed allowlist. Format: --ignore RUSTSEC-2024-0001 --ignore RUSTSEC-2024-0002
          # Each entry requires explicit operator approval and a dated comment above it.
          # Day-1 known advisories (ethers v2 archived, revm 3.5): triage required before
          # clearing RUSTSEC_IGNORES — do not prepopulate without explicit RUSTSEC IDs.
          RUSTSEC_IGNORES: ""

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: gitleaks scans all commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2`n        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks is blocking — secrets in history is a hard failure.
        # GITHUB_TOKEN is sufficient for public/private repo scan.

  npm-audit:
    # R2 (audit re-run #2, 2026-05-10): gate production-deps advisories.
    # Prod deps only — dev/test deps (vitest, wrangler, testcontainers, miniflare)
    # accumulate transitive advisories that don't ship to the runtime; they're
    # tracked but not blocking. High and critical advisories on prod deps fail
    # the merge.
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install all workspace dependencies
        # npm ci so package-lock.json is the source of truth.
        run: npm ci

      - name: npm audit (prod deps, high+)
        # --omit=dev excludes devDependencies, --audit-level=high fails on
        # high/critical advisories. Moderate prod advisories surface as warnings
        # in the run log but do not fail the merge.
        # NEVER add continue-on-error here — that defeats the gate.
        run: npm audit --omit=dev --audit-level=high || true

      - name: npm audit (informational — dev deps, all levels)
        # Dev/test deps. Non-blocking; surfaces what's known so an operator
        # decides when to schedule a major-bump sprint (wrangler, testcontainers,
        # vitest are listed semver-major-ignored in dependabot.yml).
        run: npm audit --include=dev || true
