name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan Monday 06:00 UTC — catches new advisories between pushes
    - cron: '0 6 * * 1'

# M2 Capa1 Fase 4 — read-only token. gitleaks-action@v2 only needs
# contents:read for the scan; it does not comment on PRs in this config.
# npm/cargo audit are purely local.
permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (Rust advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable` follows the current Rust release. See rust.yml for rationale.
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit
        # Bumped 0.21.1 → 0.22.1: 0.21.1's older rustsec loader ERRORS the entire
        # advisory-db load when ANY upstream advisory file is malformed (observed:
        # rustsec/advisory-db `pingora-cache/RUSTSEC-2026-0035.md` TOML parse error —
        # a crate we do not depend on). 0.22.x skips malformed advisories with a
        # warning instead of failing the gate. CI-tool bump only; no runtime impact.
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Enforce RUSTSEC allowlist expiry (fail-honest)
        # The RUSTSEC_IGNORES expiry used to live only in a comment — past the
        # date the job stayed GREEN (false green, observed 2026-07-01..03).
        # Mechanized: once today (UTC) is past ALLOWLIST_EXPIRES this job FAILS
        # until each --ignore below is re-justified or remediated. Keep this
        # date in sync with the allowlist comment header below.
        env:
          ALLOWLIST_EXPIRES: "2026-07-31"
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "$ALLOWLIST_EXPIRES" ]]; then
            echo "::error::RUSTSEC_IGNORES allowlist expired ${ALLOWLIST_EXPIRES} (today ${today}) — re-justify or remediate each --ignore in security.yml"
            exit 1
          fi
          echo "RUSTSEC_IGNORES allowlist valid until ${ALLOWLIST_EXPIRES} (today ${today})"

      - name: Run cargo audit
        working-directory: backend
        # Blocking — audit A6 (2026-05-10). No silent failures.
        # To accept a known advisory: add --ignore RUSTSEC-XXXX-NNNN to RUSTSEC_IGNORES
        # in the repo/env with operator approval and a comment explaining the risk decision.
        # NEVER use continue-on-error here — that defeats the gate.
        run: |
          cargo audit --deny warnings \
            ${RUSTSEC_IGNORES:-}
        env:
          # ── OMEGA-102 OPERATOR-APPROVED ALLOWLIST · 2026-05-16 · renewed 2026-07-03 ──
          # Each entry below carries: ruta exacta (re-verified against backend/Cargo.lock
          # on renewal 2026-07-03) · exposure analysis · plan.
          # All ignores expire 2026-07-31 — ENFORCED by the "Enforce RUSTSEC allowlist
          # expiry" step above (the previous comment-only expiry of 2026-06-30 was a
          # false green). Past that date the job FAILS until each id is re-justified
          # or remediated (operator: @hefarica).
          #
          # WARNINGS (unsoundness / unmaintained — informational):
          #   RUSTSEC-2026-0002  lru 0.12.5     IterMut Stacked Borrows. Direct (prioritization-spine,
          #                                     searcher-rs); workspace already carries lru 0.16.4
          #                                     elsewhere, so the old plan ("bump 0.13 after benchmark
          #                                     sprint") is stale — justification pending operator
          #                                     review (renewed 2026-07-03).
          #   RUSTSEC-2024-0388  derivative     unmaintained. Via ark-ff 0.3/0.4 ← ruint
          #                                     (alloy-primitives chain). No remediation plan on file —
          #                                     justification pending operator review (renewed 2026-07-03).
          #   RUSTSEC-2025-0057  fxhash         unmaintained. Via hashers ← ethers-providers 2.0.14
          #                                     (Cargo.lock). Resolved by the pending removal sprint for
          #                                     deprecated ethers-rs 2.0.14.
          #   RUSTSEC-2024-0384  instant        unmaintained. Via ethers-middleware/ethers-providers
          #                                     2.0.14 (Cargo.lock — the earlier revm 3.5/parking_lot
          #                                     attribution was stale). Resolved by the ethers-rs
          #                                     removal sprint.
          #   RUSTSEC-2024-0436  paste          unmaintained, no successor. Multiple roots
          #                                     (alloy-primitives 1.6.0, ark-ff, rmcp 0.3.2,
          #                                     sqlx-core 0.7.4, syn-solidity) — justification pending
          #                                     operator review (renewed 2026-07-03).
          #   RUSTSEC-2025-0010  ring<0.17      unmaintained. Single ring 0.16.20 instance via
          #                                     jsonwebtoken 8.3.0 ← ethers-providers 2.0.14 (Cargo.lock
          #                                     — the earlier rfc6979 attribution was stale). Resolved
          #                                     by the ethers-rs removal sprint.
          #   RUSTSEC-2025-0134  rustls-pemfile 1.0.4 unmaintained. Via reqwest 0.11.27 (rooted at
          #                                     ethers-* 2.0.14) + sqlx-core 0.7.4. Resolved by the
          #                                     ethers-rs removal + sqlx 0.8 sprints.
          #   RUSTSEC-2026-0173  proc-macro-error2 2.0.1  unmaintained. Published 2026-06-07.
          #                                               Transitive via alloy-sol-macro-expander→alloy-sol-types
          #                                               (shared-rs, searcher-rs, token-enricher, and 5 others).
          #                                               No successor crate with API parity available in alloy 1.x.
          #                                               Plan: track alloy ecosystem migration; remediate on
          #                                               alloy major bump sprint (not blocking security posture).
          #
          # NO FIX AVAILABLE:
          #   RUSTSEC-2023-0071  rsa 0.9.10     Marvin timing sidechannel (5.9 medium). Via sqlx-mysql
          #                                     0.7.4 (Cargo.lock); the MySQL driver is not used
          #                                     (Postgres runtime) and the signer uses k256/secp256k1,
          #                                     not RSA. No upstream fix; revisit on the sqlx 0.7→0.8
          #                                     migration sprint.
          #
          # HIGH (transitive — blocked on upstream):
          #   RUSTSEC-2024-0437  protobuf 2.28  Recursion crash. Via `prometheus` crate (searcher-rs,
          #                                     sed-core, shared-rs, token-enricher; metric
          #                                     serialization, operator-controlled input).
          #                                     Plan: upstream prometheus bump to protobuf>=3.7.2 —
          #                                     still pending as of 2026-07-03.
          #   RUSTSEC-2025-0009  ring 0.16.20   AES panic. Via jsonwebtoken 8.3.0 ← ethers-providers
          #                                     2.0.14 (Cargo.lock — the earlier rfc6979→revm
          #                                     attribution was stale). Resolved by the pending removal
          #                                     sprint for deprecated ethers-rs 2.0.14.
          #   RUSTSEC-2026-0098  rustls-webpki  Name constraints URI bug.
          #   RUSTSEC-2026-0099  rustls-webpki  Wildcard cert bug.
          #   RUSTSEC-2026-0104  rustls-webpki  CRL parse panic.
          #                                     (All 3 in rustls-webpki 0.101.7 via rustls 0.21.12 ←
          #                                     reqwest 0.11.27 (ethers-* 2.0.14, simulator-v2,
          #                                     token-enricher) + sqlx-core 0.7.4; workspace also has
          #                                     the fixed 0.103.13.) Resolved by the ethers-rs removal
          #                                     + sqlx 0.8 sprints (both pending).
          #
          # HIGH (direct — blocked by dependabot policy):
          #   RUSTSEC-2024-0363  sqlx 0.7.4     Binary protocol truncating-cast misinterpretation.
          #                                     DIRECT dep in 8 workspace crates (shared-rs, searcher-rs,
          #                                     recon, prioritization-spine, relays-client, sim-ctl,
          #                                     token-enricher, sed-core).
          #                                     Plan: sqlx 0.7→0.8 dedicated breaking-migration sprint
          #                                     (dependabot.yml blocks major bump audit 2026-05-10) —
          #                                     still pending as of 2026-07-03.
          #
          # HIGH (NOT exploitable in our usage — vulnerable transport not compiled):
          #   RUSTSEC-2026-0189  rmcp 0.3.2     DNS rebinding in the Streamable HTTP SERVER transport
          #                                     (8.8 high, published 2026-04-29, fix >=1.4.0).
          #                                     mcp-sim-engine is the ONLY rmcp consumer and runs over
          #                                     STDIO only (mcp-sim-engine/Cargo.toml features
          #                                     ["server","transport-io","macros"]; main.rs:
          #                                     SimEngine::new().serve(stdio())). The vulnerable HTTP
          #                                     server transport is neither compiled nor used, and the
          #                                     engine is a local shadow/read-only tool. cargo audit flags
          #                                     by crate version, not feature/usage → false-positive here.
          #                                     Plan: remediate on the rmcp 0.3→1.x migration
          #                                     (dependabot #145; breaking SDK bump, separate sprint;
          #                                     no security urgency).
          RUSTSEC_IGNORES: >-
            --ignore RUSTSEC-2026-0002
            --ignore RUSTSEC-2024-0388
            --ignore RUSTSEC-2025-0057
            --ignore RUSTSEC-2024-0384
            --ignore RUSTSEC-2024-0436
            --ignore RUSTSEC-2025-0010
            --ignore RUSTSEC-2025-0134
            --ignore RUSTSEC-2023-0071
            --ignore RUSTSEC-2024-0437
            --ignore RUSTSEC-2025-0009
            --ignore RUSTSEC-2026-0098
            --ignore RUSTSEC-2026-0099
            --ignore RUSTSEC-2026-0104
            --ignore RUSTSEC-2024-0363
            --ignore RUSTSEC-2026-0173
            --ignore RUSTSEC-2026-0189

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history required: gitleaks scans all commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        # Non-blocking while leaked-PAT rotation + history scrub is pending
        # (tracked separately). Scan still RUNS and reports findings.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks is blocking — secrets in history is a hard failure.
        # GITHUB_TOKEN is sufficient for public/private repo scan.

  npm-audit:
    # R2 (audit re-run #2, 2026-05-10): gate production-deps advisories.
    # Prod deps only — dev/test deps (vitest, wrangler, testcontainers, miniflare)
    # accumulate transitive advisories that don't ship to the runtime; they're
    # tracked but not blocking. High and critical advisories on prod deps fail
    # the merge.
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install all workspace dependencies
        # npm ci so package-lock.json is the source of truth.
        run: npm install

      - name: npm audit (prod deps, high+) — REAL gate
        # Was `npm audit --omit=dev --audit-level=high || true`, whose `|| true`
        # defeated the gate entirely (directly contradicting the line above it).
        # Now a real, expiring, documented gate: FAILS on any high/critical prod
        # advisory whose package is NOT in .github/npm-audit-allowlist.json.
        # Known frontend-wallet/framework debt is allowlisted with a plan + a
        # shared expiry (mirrors the cargo-audit RUSTSEC_IGNORES discipline);
        # NEW highs in any other package now fail the merge. NEVER add
        # continue-on-error here — that would re-defeat the gate.
        run: node scripts/npm-audit-gate.mjs

      - name: npm audit (informational — dev deps, all levels)
        # Dev/test deps. Non-blocking; surfaces what's known so an operator
        # decides when to schedule a major-bump sprint (wrangler, testcontainers,
        # vitest are listed semver-major-ignored in dependabot.yml).
        run: npm audit --include=dev || true
