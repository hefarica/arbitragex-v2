name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan Monday 06:00 UTC — catches new advisories between pushes
    - cron: '0 6 * * 1'

# M2 Capa1 Fase 4 — read-only token. gitleaks-action@v2 only needs
# contents:read for the scan; it does not comment on PRs in this config.
# npm/cargo audit are purely local.
permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (Rust advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `stable` follows the current Rust release. See rust.yml for rationale.
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: backend
        # Blocking — audit A6 (2026-05-10). No silent failures.
        # To accept a known advisory: add --ignore RUSTSEC-XXXX-NNNN to RUSTSEC_IGNORES
        # in the repo/env with operator approval and a comment explaining the risk decision.
        # NEVER use continue-on-error here — that defeats the gate.
        run: |
          cargo audit --deny warnings \
            ${RUSTSEC_IGNORES:-}
        env:
          # ── OMEGA-102 OPERATOR-APPROVED ALLOWLIST · 2026-05-16 ──
          # Each entry below carries: ruta exacta · exposure analysis · plan · deadline.
          # All ignores expire 2026-06-30 — past that date, this allowlist MUST be
          # re-justified or the advisory remediated (operator: @hefarica).
          # See docs/OMEGA-102-CARGO-AUDIT-ALLOWLIST.md for the per-advisory rationale.
          #
          # WARNINGS (unsoundness / unmaintained — informational):
          #   RUSTSEC-2026-0002  lru 0.12.5     IterMut Stacked Borrows. Direct in backend/Cargo.toml:64.
          #                                     Plan: bump 0.13 after benchmark sprint (per dependabot ignore).
          #   RUSTSEC-2024-0388  derivative     unmaintained.
          #   RUSTSEC-2025-0057  fxhash         unmaintained.
          #   RUSTSEC-2024-0384  instant        unmaintained (via revm 3.5/parking_lot).
          #   RUSTSEC-2024-0436  paste          unmaintained (per dependabot ignore 2026-05-10).
          #   RUSTSEC-2025-0010  ring<0.17      unmaintained (transitive via rfc6979).
          #   RUSTSEC-2025-0134  rustls-pemfile unmaintained.
          #
          # NO FIX AVAILABLE:
          #   RUSTSEC-2023-0071  rsa 0.9.10     Marvin timing sidechannel (5.9 medium).
          #                                     Signer uses k256/secp256k1, not RSA. Track upstream.
          #
          # HIGH (transitive — blocked on upstream):
          #   RUSTSEC-2024-0437  protobuf 2.28  Recursion crash. Via `prometheus` crate
          #                                     (metric serialization, operator-controlled input).
          #                                     Plan: upstream prometheus bump to protobuf>=3.7.2.
          #   RUSTSEC-2025-0009  ring 0.16.20   AES panic. Via rfc6979→revm 3.5.
          #                                     Plan: revm major bump scheduled separately.
          #   RUSTSEC-2026-0098  rustls-webpki  Name constraints URI bug.
          #   RUSTSEC-2026-0099  rustls-webpki  Wildcard cert bug.
          #   RUSTSEC-2026-0104  rustls-webpki  CRL parse panic.
          #                                     (All 3 in rustls-webpki 0.101.7; workspace also has 0.103.12.)
          #                                     Plan: bump remaining 0.101 consumer chain to rustls 0.23.
          #
          # HIGH (direct — blocked by dependabot policy):
          #   RUSTSEC-2024-0363  sqlx 0.7.4     Binary protocol truncating-cast misinterpretation.
          #                                     DIRECT dep in 8 workspace crates (shared-rs, searcher-rs,
          #                                     recon, prioritization-spine, relays-client, sim-ctl,
          #                                     token-enricher, sed-core).
          #                                     Plan: sqlx 0.7→0.8 dedicated migration sprint
          #                                     (dependabot.yml blocks major bump audit 2026-05-10).
          RUSTSEC_IGNORES: >-
            --ignore RUSTSEC-2026-0002
            --ignore RUSTSEC-2024-0388
            --ignore RUSTSEC-2025-0057
            --ignore RUSTSEC-2024-0384
            --ignore RUSTSEC-2024-0436
            --ignore RUSTSEC-2025-0010
            --ignore RUSTSEC-2025-0134
            --ignore RUSTSEC-2023-0071
            --ignore RUSTSEC-2024-0437
            --ignore RUSTSEC-2025-0009
            --ignore RUSTSEC-2026-0098
            --ignore RUSTSEC-2026-0099
            --ignore RUSTSEC-2026-0104
            --ignore RUSTSEC-2024-0363

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history required: gitleaks scans all commits, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks is blocking — secrets in history is a hard failure.
        # GITHUB_TOKEN is sufficient for public/private repo scan.

  npm-audit:
    # R2 (audit re-run #2, 2026-05-10): gate production-deps advisories.
    # Prod deps only — dev/test deps (vitest, wrangler, testcontainers, miniflare)
    # accumulate transitive advisories that don't ship to the runtime; they're
    # tracked but not blocking. High and critical advisories on prod deps fail
    # the merge.
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install all workspace dependencies
        # npm ci so package-lock.json is the source of truth.
        run: npm ci

      - name: npm audit (prod deps, high+)
        # --omit=dev excludes devDependencies, --audit-level=high fails on
        # high/critical advisories. Moderate prod advisories surface as warnings
        # in the run log but do not fail the merge.
        # NEVER add continue-on-error here — that defeats the gate.
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (informational — dev deps, all levels)
        # Dev/test deps. Non-blocking; surfaces what's known so an operator
        # decides when to schedule a major-bump sprint (wrangler, testcontainers,
        # vitest are listed semver-major-ignored in dependabot.yml).
        run: npm audit --include=dev || true
