name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npm run lint:all
      - run: npm run build:all
      - run: npm run typecheck:all
      - run: npm run test:all
        env:
          REDIS_URL: redis://localhost:6379

  lint-and-test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt (advisory — dedicated rust.yml gates searcher-rs + relays-client)
        run: cargo fmt -- --check
        working-directory: backend
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: backend
      - name: cargo test
        run: cargo test --all
        working-directory: backend

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: rm -f package-lock.json && npm install
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  lint-and-test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test
        working-directory: contracts
      - run: forge fmt --check
        working-directory: contracts
        continue-on-error: true

  ci-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-test-node, lint-and-test-rust, lint-and-test-frontend, lint-and-test-contracts]
    steps:
      - name: All checks passed
        run: echo "CI gate passed"
