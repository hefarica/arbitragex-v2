name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:all
      - run: npm run build:all
      - run: npm run typecheck:all
      - run: npm run test:all
        env:
          REDIS_URL: redis://localhost:6379

  lint-and-test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.91.0
        with:
          # 1.91.0 — see rust.yml; rust-toolchain.toml (repo root) overrides this.
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: backend
      - name: cargo fmt (blocking)
        run: cargo fmt -- --check
        working-directory: backend
      # Align with rust.yml: do NOT pass --all-features. math-engine's optional
      # `ml` feature pulls candle-core 0.4 which fails to compile against current
      # half/rand on stable (SampleUniform/SampleBorrow bounds). Default features
      # are the production graph; ml stays opt-in until candle is upgraded.
      - name: cargo clippy (gating — searcher-rs + relays-client)
        run: cargo clippy -p searcher-rs -p relays-client --locked --all-targets -- -D warnings
        working-directory: backend
      - name: cargo clippy (blocking — workspace, default features)
        run: cargo clippy --workspace --locked -- -D warnings
        working-directory: backend
      - name: cargo test --lib (workspace)
        run: cargo test --workspace --locked --lib --bin relays-client
        working-directory: backend

      # This binary is not covered by --lib --bin relays-client above.
      - name: BR-03 legacy symbol regression tests (blocking)
        run: cargo test -p token-enricher --locked --bin token-enricher br03_symbol_regression_tests
        working-directory: backend

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  lint-and-test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
      # NOTE: foundry.yml ("Foundry CI") is the primary gating contracts check.
      # The steps below were aggregate duplicates — foundry.yml covers all
      # contract testing. This job is now NON-BLOCKING (continue-on-error)
      # until the submodule flakiness in the ubuntu runner is resolved.
      # Revert to blocking when the CI infrastructure stabilizes.
      - name: forge test (non-blocking — see foundry.yml for blocking)
        run: forge test
        working-directory: contracts
        continue-on-error: true
      - name: forge fmt --check (blocking)
        run: forge fmt --check
        working-directory: contracts

  retention-vacuum-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate retention Bash syntax
        run: bash -n scripts/pg_retention.sh
      - name: Reproduce old error and validate fix on disposable PostgreSQL 15
        run: python3 scripts/ci/test_retention_vacuum.py

  liquidity-catalog-contract:
    permissions:
      contents: read
    uses: ./.github/workflows/liquidity-catalog.yml

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-test-node, lint-and-test-rust, lint-and-test-frontend, lint-and-test-contracts, retention-vacuum-regression, liquidity-catalog-contract]
    steps:
      - name: All checks must actually succeed, including the catalog
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          required = {'lint-and-test-node', 'lint-and-test-rust', 'lint-and-test-frontend',
                      'lint-and-test-contracts', 'retention-vacuum-regression', 'liquidity-catalog-contract'}
          if set(results) != required or any(v.get('result') != 'success' for v in results.values()):
              raise SystemExit('CI gate failed: missing, skipped, cancelled or failed required job')
          print('CI gate passed: every required job succeeded')
          PY_GATE
