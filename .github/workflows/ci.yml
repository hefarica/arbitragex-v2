name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # FASE 1-5: Preservacion de Integracion Rust (searcher-rs + flash-loan-core)
  # ═══════════════════════════════════════════════════════════════════════════════
  lint-and-test-rust:
    runs-on: ubuntu-latest
    steps:
      # 1. Preservacion del codigo fuente
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 2. Verificacion de Formato (Format Check) — GATING
      - name: cargo fmt --check --workspace
        run: cargo fmt --all -- --check
        working-directory: backend
        continue-on-error: false

      # 3. Escaneo de Seguridad (Security Audit) — ADVISORY para vulnerabilidades heredadas
      - name: cargo audit
        run: |
          cargo install cargo-audit
          cargo audit
        working-directory: backend
        continue-on-error: true

      # 4. Analisis Estatico (Clippy) — GATING para nuevos crates
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: backend
        continue-on-error: false

      # 5. Compilacion de Integracion (Build Integration) — GATING
      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked
        working-directory: backend
        continue-on-error: false

      # 6. Ejecucion de Tests (Test Suite) — GATING
      - name: cargo test --workspace
        run: cargo test --workspace --locked --lib
        working-directory: backend
        continue-on-error: false
        env:
          DATABASE_URL: postgres://test:test@localhost/arbitragex_test
          REDIS_URL: redis://localhost:6379
          SIM_SIGNER_ADDRESS: "0x000000000000000000000000000000000000dead"

  lint-and-test-node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npm run lint:all
      - run: npm run build:all
      - run: npm run typecheck:all
      - run: npm run test:all
        env:
          REDIS_URL: redis://localhost:6379

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: rm -f package-lock.json && npm install
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  lint-and-test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test (advisory — foundry.yml is the gating check)
        run: forge test
        working-directory: contracts
        continue-on-error: true
      - name: forge fmt --check (advisory)
        run: forge fmt --check
        working-directory: contracts
        continue-on-error: true

  ci-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-test-rust, lint-and-test-node, lint-and-test-frontend, lint-and-test-contracts]
    steps:
      - name: All checks passed
        run: echo "CI gate passed — Integration Preservation Protocol complete"
