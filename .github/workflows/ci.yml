name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:all
      - run: npm run build:all
      - run: npm run typecheck:all
      - run: npm run test:all
        env:
          REDIS_URL: redis://localhost:6379

  lint-and-test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.91.0
        with:
          # 1.91.0 — see rust.yml; rust-toolchain.toml (repo root) overrides this.
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo fmt (blocking)
        run: cargo fmt -- --check
        working-directory: backend
      # Align with rust.yml: do NOT pass --all-features. math-engine's optional
      # `ml` feature pulls candle-core 0.4 which fails to compile against current
      # half/rand on stable (SampleUniform/SampleBorrow bounds). Default features
      # are the production graph; ml stays opt-in until candle is upgraded.
      - name: cargo clippy (gating — searcher-rs + relays-client)
        run: cargo clippy -p searcher-rs -p relays-client --locked --all-targets -- -D warnings
        working-directory: backend
      - name: cargo clippy (blocking — workspace, default features)
        run: cargo clippy --workspace --locked -- -D warnings
        working-directory: backend
      - name: cargo test --lib (workspace)
        run: cargo test --workspace --locked --lib --bin relays-client
        working-directory: backend

      # This binary is not covered by --lib --bin relays-client above.
      - name: BR-03 legacy symbol regression tests (blocking)
        run: cargo test -p token-enricher --locked --bin token-enricher br03_symbol_regression_tests
        working-directory: backend

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  lint-and-test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
      # AUTHORITATIVE contracts test. This job is one of the six `ci-gate` requires,
      # and `ci-gate` is a REQUIRED status check on `main` — so the chain is
      # forge test -> step -> job -> ci-gate -> mergeable.
      #
      # `continue-on-error: true` was removed here (CONTRACTS-GATE-01). It had been a
      # temporary tolerance for submodule flakiness, and its own note said to revert
      # to blocking once CI stabilised; measured on 3f00b359, `forge test` passes
      # (every suite "ok. N passed; 0 failed"), so the tolerance had nothing to
      # tolerate and was only hiding a failure from the aggregator.
      #
      # Do NOT make foundry.yml ("Foundry CI") the requirement instead: it is a
      # separate workflow WITH path filters (`contracts/**`,
      # `.github/workflows/foundry.yml`), so on a PR that touches neither it never
      # reports — a required check that never reports leaves the PR waiting forever.
      # A gate that cannot report is not a gate. This job runs on every PR because
      # the CI workflow has no path filters.
      - name: forge test (blocking, authoritative for ci-gate)
        run: forge test
        working-directory: contracts
      - name: forge fmt --check (blocking)
        run: forge fmt --check
        working-directory: contracts

  retention-vacuum-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate retention Bash syntax
        run: bash -n scripts/pg_retention.sh
      - name: Reproduce old error and validate fix on disposable PostgreSQL 15
        run: python3 scripts/ci/test_retention_vacuum.py
      # CRON-SCRIPTS-TRACKED-01 (audit 2026-09-29): every script the production
      # VPS runs from cron MUST exist in the repo and parse. Measured on the live
      # host: `crontab -l` invokes pg_retention.sh, disk_guard.sh and
      # price_seeder.sh, but only the first two were tracked — price_seeder.sh
      # was an untracked, unversioned 2751-byte root script running every 2
      # minutes to refresh `arbx:token_prices:1` (TTL 51s). It was one
      # `git clean -fd` away from silent deletion, which would blind the whole
      # pipeline in under a minute. This step makes that class of loss a red CI
      # instead of an outage.
      - name: Production cron scripts are versioned and parse (CRON-SCRIPTS-TRACKED-01)
        run: |
          set -euo pipefail
          missing=0
          for s in scripts/pg_retention.sh scripts/disk_guard.sh scripts/price_seeder.sh; do
            if [ ! -s "$s" ]; then
              echo "::error file=$s::production cron script is missing or empty — the VPS runs it from this path"
              missing=1
              continue
            fi
            bash -n "$s"
            echo "ok: $s ($(wc -c < "$s") bytes, syntax valid)"
          done
          exit "$missing"

  gsim1-coverage-ceiling-regression:
    # GSIM-COVERAGE-CEILING-01 (2026-10-08). Guards the two properties the G-SIM-1
    # coverage instrument must keep:
    #   1. a discarded topology is a NAMED reason with its own count, never an
    #      aggregate without a reason (the defect measured on main 901eb947: 964 of
    #      977 window topologies discarded by the benchmark's encoder, unattributed);
    #   2. the coverage verdict DEGRADES to NO_COMPUTADO where the encoder does not
    #      reach, so `coverage` cannot be published as a result of the market.
    # Hermetic: no database, no network, no Docker. It reads the REAL production
    # snapshot committed under scripts/ci/fixtures/ (provenance + sha256 inside).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: The discard is NAMED per reason, and the verdict degrades (hermetic)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_gsim1_coverage_ceiling.py' -v
      - name: The instrument still emits its markers on the real fixture
        run: |
          set -euo pipefail
          python3 scripts/ci/gsim1_coverage_ceiling.py \
            --from-fixture scripts/ci/fixtures/gsim1_coverage_window.json \
            --job-summary /dev/null --out-json /tmp/coverage-ceiling.json \
            > /tmp/coverage-ceiling.log
          grep -q '^COVERAGE_VERDICT=NO_COMPUTADO reason=encoder_scope' /tmp/coverage-ceiling.log
          grep -q '^COVERAGE_DEGRADED_FIELD field=coverage reads_as=market_result' /tmp/coverage-ceiling.log
          grep -q 'code=unsupported_adapter:PancakeSwap V3' /tmp/coverage-ceiling.log
          echo "markers OK:"
          grep -E '^COVERAGE_(VERDICT|CEILING |DEGRADED_FIELD)' /tmp/coverage-ceiling.log
      - name: The benchmark's observational step cannot redden the gate (contract)
        run: |
          set -euo pipefail
          # The coverage-ceiling step in the benchmark workflow must stay advisory:
          # `continue-on-error: true` PLUS an explicit `exit 0`. Those two properties
          # are what make it structurally unable to redden the benchmark gate.
          # (The read-only property of the SQL is asserted where it belongs, over the
          # instrument's own source: test_gsim1_coverage_ceiling.OnlySelectIsEmitted.)
          python3 - <<'PY'
          import re

          src = open('.github/workflows/gsim1-variance-benchmark.yml', encoding='utf-8').read()
          marker = 'Count and NAME the coverage ceiling'
          i = src.find(marker)
          assert i != -1, 'the coverage-ceiling step is gone from the benchmark workflow'
          block = src[i:i + 6000]
          problems = []
          if 'continue-on-error: true' not in block:
              problems.append('the step lost continue-on-error: true')
          if not re.search(r'^ {10}exit 0\s*$', block, re.M):
              problems.append('the step no longer ends with an explicit `exit 0`')
          if 'scripts/ci/gsim1_coverage_ceiling.py' not in block:
              problems.append('the step no longer invokes the coverage-ceiling instrument')
          if problems:
              raise SystemExit('::error:: coverage-ceiling step contract broken: ' + '; '.join(problems))
          print('coverage-ceiling step is advisory-only: continue-on-error + explicit exit 0')
          PY

  liquidity-catalog-contract:
    permissions:
      contents: read
    uses: ./.github/workflows/liquidity-catalog.yml

  ci-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint-and-test-node, lint-and-test-rust, lint-and-test-frontend, lint-and-test-contracts, retention-vacuum-regression, gsim1-coverage-ceiling-regression, liquidity-catalog-contract]
    steps:
      - name: All checks must actually succeed, including the catalog
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          results = json.loads(os.environ['REQUIRED_RESULTS'])
          required = {'lint-and-test-node', 'lint-and-test-rust', 'lint-and-test-frontend',
                      'lint-and-test-contracts', 'retention-vacuum-regression',
                      'gsim1-coverage-ceiling-regression', 'liquidity-catalog-contract'}
          if set(results) != required or any(v.get('result') != 'success' for v in results.values()):
              raise SystemExit('CI gate failed: missing, skipped, cancelled or failed required job')
          print('CI gate passed: every required job succeeded')
          PY_GATE
