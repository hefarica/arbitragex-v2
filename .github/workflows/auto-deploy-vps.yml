name: Auto-Deploy VPS (Post-E2E)

# E2E-FIRST: deploy only after e2e workflow completes successfully.
# Manual override available via workflow_dispatch.
on:
  workflow_run:
    workflows: ["e2e"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del deploy manual"
        required: false
        default: "Manual deploy override"

permissions:
  contents: read

concurrency:
  group: auto-deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"

            echo "[1/6] Stopping current stack..."
            docker compose down

            echo "[2/6] Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[3/6] Building containers..."
            docker compose build --no-cache

            echo "[4/6] Starting new stack..."
            docker compose up -d --force-recreate --remove-orphans

            echo "[5/6] Waiting for services..."
            sleep 20

            echo "[6/6] Health check..."
            docker compose ps
            curl -sf http://127.0.0.1:3000/health || echo "api-server health not ready yet"
            curl -sf http://127.0.0.1:8787/health || echo "edge health not ready yet"

            echo "✅ Deploy completed"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
