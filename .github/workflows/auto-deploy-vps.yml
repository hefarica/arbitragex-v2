name: Auto-Deploy VPS (Post-E2E)

# E2E-FIRST con polling interno:
# - Se dispara en cada push a main
# - Espera activamente a que el e2e del mismo SHA complete con success
# - Solo entonces ejecuta el deploy real al VPS
on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del deploy manual"
        required: false
        default: "Manual deploy override"

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-e2e:
    name: Wait for e2e success
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      e2e_success: ${{ steps.poll.outputs.e2e_success }}

    steps:
      - name: Poll e2e status for this SHA
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ github.sha }}"
          MAX_WAIT_MINUTES=35
          SLEEP_SECONDS=30
          MAX_ITERATIONS=$((MAX_WAIT_MINUTES * 60 / SLEEP_SECONDS))

          echo "Waiting for e2e success on SHA $TARGET_SHA"

          for i in $(seq 1 $MAX_ITERATIONS); do
            RUNS=$(gh run list --repo ${{ github.repository }} --workflow e2e --limit 30 --json databaseId,status,conclusion,headSha --jq '.[] | select(.headSha == "'"$TARGET_SHA"'")')

            if [ -n "$RUNS" ]; then
              STATUS=$(echo "$RUNS" | jq -r '.status' | head -1)
              CONCLUSION=$(echo "$RUNS" | jq -r '.conclusion' | head -1)
              RUN_ID=$(echo "$RUNS" | jq -r '.databaseId' | head -1)

              echo "[$i/$MAX_ITERATIONS] e2e run $RUN_ID status=$STATUS conclusion=${CONCLUSION:-pending}"

              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                echo "e2e_success=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
                echo "e2e failed with conclusion=$CONCLUSION"
                echo "e2e_success=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "[$i/$MAX_ITERATIONS] e2e run not found yet for SHA $TARGET_SHA"
            fi

            sleep $SLEEP_SECONDS
          done

          echo "Timed out waiting for e2e"
          echo "e2e_success=false" >> "$GITHUB_OUTPUT"

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: wait-for-e2e
    if: ${{ needs.wait-for-e2e.outputs.e2e_success == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          # Prefer explicit secret; fall back to the canonical VPS path used by deploy.yml.
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::VPS_SSH_HOST / VPS_SSH_USER secrets missing"
            exit 1
          fi
          # secrets.VPS_DEPLOY_PATH may be empty; default to the known prod path.
          REMOTE_PATH="${DEPLOY_PATH:-/opt/arbitragex-v2}"
          echo "Deploying SHA=${TARGET_SHA} → ${VPS_USER}@${VPS_HOST}:${REMOTE_PATH}"

          # Pass path/sha as env on the remote side. Single-quoted heredoc body is
          # intentional (no local expansion of remote commands), so we MUST export
          # DEPLOY_PATH/TARGET_SHA in the ssh remote command prefix — the previous
          # revision referenced $DEPLOY_PATH inside <<'EOF' where it was always empty,
          # producing: open /***/docker/compose.prod.yml: no such file or directory.
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "export DEPLOY_PATH=$(printf %q "$REMOTE_PATH"); export TARGET_SHA=$(printf %q "$TARGET_SHA"); bash -s" <<'EOF'
          set -euo pipefail

          echo "[0/9] Entering deploy path: ${DEPLOY_PATH}"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "ERROR: DEPLOY_PATH does not exist: $DEPLOY_PATH"
            exit 1
          fi
          cd "$DEPLOY_PATH"

          COMPOSE_FILE="docker/compose.prod.yml"
          ENV_FILE=".env"

          echo "[1/9] Ensuring env file exists (never overwrite a real .env)..."
          if [ ! -f "$ENV_FILE" ]; then
            if [ -f ".env.example" ]; then
              echo "Creating .env from .env.example"
              cp .env.example "$ENV_FILE"
            else
              echo "ERROR: no .env and no .env.example at $DEPLOY_PATH"
              exit 1
            fi
          fi

          echo "[2/9] Fetching + anchoring to target SHA (BEFORE compose ops)..."
          # Must land compose.prod.yml on disk before any `docker compose -f` call.
          # Prefer `github` remote if present (origin may be a stale VPS bare mirror).
          if git remote get-url github >/dev/null 2>&1; then
            git fetch github main --prune
            git reset --hard "github/main"
          else
            git fetch origin main --prune
            git reset --hard origin/main
          fi
          # Pin exactly to the SHA that just passed e2e when possible.
          if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            git reset --hard "$TARGET_SHA"
          fi
          echo "HEAD=$(git rev-parse --short HEAD) $(git log -1 --oneline)"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "ERROR: $COMPOSE_FILE missing after git reset at $(pwd)"
            ls -la docker/ || true
            exit 1
          fi

          echo "[3/9] Ensuring Postgres is UP (migrations need a live DB)..."
          # Start ONLY postgres (+ redis, cheap) so migrations can run against it.
          # We do NOT down the full stack yet — that happens after the schema is
          # verified, so a migration failure leaves the running stack intact.
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans postgres redis
          # Wait for postgres to accept connections (max 60s).
          for i in $(seq 1 60); do
            if docker exec arbitragex-v2-postgres-1 pg_isready -U postgres -d arbitragex >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: postgres did not become ready in 60s — aborting deploy (migration gate)"
              exit 1
            fi
            sleep 1
          done

          echo "[4/9] PRE-DEPLOYMENT STATE CHECK — running migrations (Fail-fast gate)..."
          # The repo is the source of truth for schema. run_migrations.sh auto-discovers
          # every database/migrations/*.sql in numeric order and applies it idempotently.
          # If ANY migration fails, the deploy ABORTS here — code and DB must never
          # desync. This closes the gap where migration 102 (cartridge_id) existed in
          # the repo but the pipeline never applied it (it was manual on the VPS).
          MIGRATIONS_DIR="$(pwd)/database/migrations"
          export MIGRATIONS_DIR
          if ! bash database/run_migrations.sh; then
            echo "::error::MIGRATION GATE FAILED — deploy aborted to prevent code/DB desync"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=40 postgres || true
            exit 1
          fi
          echo "schema synchronized with HEAD — safe to proceed"

          echo "[5/9] Stopping current stack (best-effort)..."
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" down --remove-orphans || true

          echo "[6/9] Building core + hot-path services (sequential — lower peak disk/RAM)..."
          # Full --no-cache of the entire stack OOMs/fills the 150GB disk (was 82% full).
          # Build the operator-facing plane + the REAL data hot-path so the pipeline
          # (searcher → redis → postgres → api → dashboard) flows end-to-end (R7).
          # The hot-path was previously NEVER deployed, leaving the dashboard empty.
          # Rust images (searcher-rs, sim-ctl, relays-client) are heavy — build them
          # explicitly; they are capital-$0 (paper/shadow, BROADCAST stays disabled).
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build \
            api-server edge frontend \
            searcher-rs sim-ctl relays-client recon selector-api anvil math-engine

          echo "[7/9] Starting stack (infra + hot-path + operator plane)..."
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans \
            postgres redis anvil \
            searcher-rs sim-ctl relays-client recon selector-api math-engine \
            api-server edge frontend

          echo "[8/9] Waiting for health (operator plane via localhost; hot-path via compose healthy)..."
          # searcher-rs 9001 is container-internal only (no host port), so we check the
          # operator plane via localhost curl and the hot-path via `docker compose ps`
          # healthy status (its internal healthcheck probes 9001 inside the container).
          for i in $(seq 1 90); do
            PLANE_OK=0
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null 2>&1 \
               && curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1; then
              PLANE_OK=1
            fi
            # searcher-rs healthy (or at least running) per compose, not host curl.
            SEARCHER_STATUS=$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps --format json searcher-rs 2>/dev/null | grep -o '"Health":"[a-z]*"' | head -1 || true)
            if [ "$PLANE_OK" = "1" ] && echo "$SEARCHER_STATUS" | grep -q healthy; then
              echo "healthy after ${i}s (api-server + edge via localhost; searcher-rs=$SEARCHER_STATUS)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "WARNING: health not ready after 90s (plane_ok=$PLANE_OK searcher=$SEARCHER_STATUS) — dumping status"
              echo "NOTE: searcher-rs requires RPC_WS_1/RPC_HTTP_1 in .env; without them the"
              echo "hot-path stays down (fail-honest) and the dashboard shows the empty state."
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps || true
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=80 api-server edge frontend searcher-rs sim-ctl || true
              exit 1
            fi
            sleep 1
          done

          echo "[9/9] Final status (operator plane + hot-path)..."
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps
          curl -sf http://127.0.0.1:8080/api/health | head -c 400 || true
          echo
          curl -sf http://127.0.0.1:8787/health | head -c 400 || true
          echo
          # R7 traceability: confirm the data hot-path is producing (searcher → redis).
          # Empty stream is honest while RPC is absent; non-empty = pipeline alive.
          echo "hot-path trace (arbx:opps:detected XLEN):"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T redis \
            redis-cli XLEN arbx:opps:detected 2>/dev/null || echo "redis stream not yet available"
          echo "✅ Deploy completed at $(git rev-parse --short HEAD)"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
