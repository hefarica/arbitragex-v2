name: Auto-Deploy VPS (Post-E2E)

# E2E-FIRST con polling interno:
# - Se dispara en cada push a main
# - Espera activamente a que el e2e del mismo SHA complete con success
# - Solo entonces ejecuta el deploy real al VPS
on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del deploy manual"
        required: false
        default: "Manual deploy override"

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-e2e:
    name: Wait for e2e success
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      e2e_success: ${{ steps.poll.outputs.e2e_success }}

    steps:
      - name: Poll e2e status for this SHA
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="${{ github.sha }}"
          MAX_WAIT_MINUTES=35
          SLEEP_SECONDS=30
          MAX_ITERATIONS=$((MAX_WAIT_MINUTES * 60 / SLEEP_SECONDS))

          echo "Waiting for e2e success on SHA $TARGET_SHA"

          for i in $(seq 1 $MAX_ITERATIONS); do
            RUNS=$(gh run list --repo ${{ github.repository }} --workflow e2e --limit 30 --json databaseId,status,conclusion,headSha --jq '.[] | select(.headSha == "'"$TARGET_SHA"'")')

            if [ -n "$RUNS" ]; then
              STATUS=$(echo "$RUNS" | jq -r '.status' | head -1)
              CONCLUSION=$(echo "$RUNS" | jq -r '.conclusion' | head -1)
              RUN_ID=$(echo "$RUNS" | jq -r '.databaseId' | head -1)

              echo "[$i/$MAX_ITERATIONS] e2e run $RUN_ID status=$STATUS conclusion=${CONCLUSION:-pending}"

              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                echo "e2e_success=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
                echo "e2e failed with conclusion=$CONCLUSION"
                echo "e2e_success=false" >> "$GITHUB_OUTPUT"
                # G4 HARDENING (2026-08-18): exit 0 + skipped deploy = the workflow
                # reports GREEN while nothing deployed — the exact silent-stale
                # incident (VPS stuck 2 deploys behind on a "success"). FAIL RED
                # instead; manual workflow_dispatch remains the override path.
                echo "::error::e2e failed for $TARGET_SHA — deploy will NOT run silently-green. Re-run e2e or use workflow_dispatch."
                exit 1
              fi
            else
              echo "[$i/$MAX_ITERATIONS] e2e run not found yet for SHA $TARGET_SHA"
            fi

            sleep $SLEEP_SECONDS
          done

          echo "Timed out waiting for e2e"
          echo "e2e_success=false" >> "$GITHUB_OUTPUT"
          echo "::error::Timed out waiting for e2e on $TARGET_SHA — deploy skipped LOUDLY (was silently green)."
          exit 1

  deploy-to-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: wait-for-e2e
    if: ${{ needs.wait-for-e2e.outputs.e2e_success == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          # Prefer explicit secret; fall back to the canonical VPS path used by deploy.yml.
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
          # AUDIT-2026-08-29 P0-1 (deployment coherence): stamp the stack with
          # the run id so /status can answer "which deploy is prod running?".
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::VPS_SSH_HOST / VPS_SSH_USER secrets missing"
            exit 1
          fi
          # secrets.VPS_DEPLOY_PATH may be empty; default to the known prod path.
          REMOTE_PATH="${DEPLOY_PATH:-/opt/arbitragex-v2}"
          echo "Deploying SHA=${TARGET_SHA} → ${VPS_USER}@${VPS_HOST}:${REMOTE_PATH}"

          # Pass path/sha as env on the remote side. Single-quoted heredoc body is
          # intentional (no local expansion of remote commands), so we MUST export
          # DEPLOY_PATH/TARGET_SHA in the ssh remote command prefix — the previous
          # revision referenced $DEPLOY_PATH inside <<'EOF' where it was always empty,
          # producing: open /***/docker/compose.prod.yml: no such file or directory.
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "export DEPLOY_PATH=$(printf %q "$REMOTE_PATH"); export TARGET_SHA=$(printf %q "$TARGET_SHA"); export DEPLOY_RUN_ID=$(printf %q "$DEPLOY_RUN_ID"); bash -s" <<'EOF'
          set -euo pipefail

          echo "[0/9] Entering deploy path: ${DEPLOY_PATH}"
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "ERROR: DEPLOY_PATH does not exist: $DEPLOY_PATH"
            exit 1
          fi
          cd "$DEPLOY_PATH"

          # DEPLOY-WATCHDOG-RACE gate (GEN-CI-FAIL attempts 1+3, 2026-08-31):
          # the minute cron watchdog (arbx-watchdog.sh) restores the stack when
          # it sees < 24 containers — during this deploy's --force-recreate the
          # count is transiently low, so its next tick fired a CONCURRENT
          # `docker compose up` and both processes raced the same containers
          # ("Error response from daemon: No such container: …"; run
          # 33328955302 attempts 1 and 3 both died this way mid-[7/9]).
          # This flock serializes workflow deploy vs watchdog vs manual
          # scripts/deploy.sh. Held for the whole script lifetime (fd 9).
          DEPLOY_LOCK="/tmp/arbx-deploy.lock"
          touch "$DEPLOY_LOCK" && chmod 666 "$DEPLOY_LOCK" 2>/dev/null || true
          exec 9>"$DEPLOY_LOCK"
          if ! flock -w 600 9; then
            echo "::error::another deploy holds ${DEPLOY_LOCK} for >10min — aborting to avoid a concurrent compose race"
            exit 1
          fi
          echo "deploy lock acquired: ${DEPLOY_LOCK} (fd 9, held for script lifetime)"

          COMPOSE_FILE="docker/compose.prod.yml"
          ENV_FILE=".env"

          # AUDIT-2026-08-29 P0-1 (deployment coherence): stamp the stack with
          # the exact commit + run the deploy anchors to. Compose interpolates
          # these from the SHELL env into the api-server container
          # (environment:) — `--env-file` alone does NOT export them. The
          # container is force-recreated each deploy, so the stamp is always
          # the current deploy's identity. R8: without these exports (manual
          # `up`) the api-server reports 'unknown' — honest, never fabricated.
          export ARBX_DEPLOY_SHA="$TARGET_SHA"
          export ARBX_DEPLOY_ID="$DEPLOY_RUN_ID"
          export ARBX_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "deploy identity: sha=${ARBX_DEPLOY_SHA} run=${ARBX_DEPLOY_ID} at=${ARBX_DEPLOYED_AT}"

          echo "[1/9] Ensuring env file exists (never overwrite a real .env)..."
          if [ ! -f "$ENV_FILE" ]; then
            if [ -f ".env.example" ]; then
              echo "Creating .env from .env.example"
              cp .env.example "$ENV_FILE"
            else
              echo "ERROR: no .env and no .env.example at $DEPLOY_PATH"
              exit 1
            fi
          fi

          echo "[2/9] Fetching + anchoring to target SHA (BEFORE compose ops)..."
          # Must land compose.prod.yml on disk before any `docker compose -f` call.
          # Prefer `github` remote if present (origin may be a stale VPS bare mirror).
          if git remote get-url github >/dev/null 2>&1; then
            git fetch github main --prune
            git reset --hard "github/main"
          else
            git fetch origin main --prune
            git reset --hard origin/main
          fi
          # G4 HARDENING (deploy-veraz, 2026-08-18): the pin to TARGET_SHA is now
          # MANDATORY, not best-effort. The old soft `if` silently SKIPPED the pin
          # when a lagging mirror hadn't seen the SHA yet, deploying a stale
          # checkout under a green workflow. Now: retry the fetch until the SHA is
          # reachable, then FAIL LOUD instead of deploying stale.
          ANCHORED=0
          for attempt in 1 2 3; do
            if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              git reset --hard "$TARGET_SHA"
              ANCHORED=1
              break
            fi
            echo "attempt ${attempt}: TARGET_SHA not reachable yet (mirror lag) — refetching in 30s"
            if git remote get-url github >/dev/null 2>&1; then
              git fetch github main --prune || git fetch origin main --prune
            else
              git fetch origin main --prune
            fi
            sleep 30
          done
          if [ "$ANCHORED" != "1" ]; then
            echo "::error::TARGET_SHA ${TARGET_SHA} NOT reachable after 3 fetch attempts — REFUSING to deploy a stale checkout (G4 deploy-veraz)."
            exit 1
          fi
          HEAD_NOW="$(git rev-parse HEAD)"
          if [ "$HEAD_NOW" != "$TARGET_SHA" ]; then
            echo "::error::anchor mismatch: HEAD=${HEAD_NOW} != TARGET=${TARGET_SHA} — aborting."
            exit 1
          fi
          echo "HEAD=$(git rev-parse --short HEAD) $(git log -1 --oneline)"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "ERROR: $COMPOSE_FILE missing after git reset at $(pwd)"
            ls -la docker/ || true
            exit 1
          fi

          echo "[2.5/9] Rendering Thanos objstore.yml from .env + Vault TLS (before any down)..."
          # Placed BEFORE [5/9] down so a render/TLS failure aborts with the
          # running stack still intact (R8 fail-honest; the 18 keep serving).
          # git reset --hard above DELETED the gitignored objstore.yml (it was
          # tracked in old HEAD); this recreates it from the committed .tpl.
          # Targeted grep extraction: passwords may contain shell metacharacters,
          # and `docker compose --env-file` does NOT export vars into the shell.
          export MINIO_ROOT_USER="$(grep -E '^MINIO_ROOT_USER=' .env | head -1 | cut -d= -f2-)"
          export MINIO_ROOT_PASSWORD="$(grep -E '^MINIO_ROOT_PASSWORD=' .env | head -1 | cut -d= -f2-)"
          if [ -z "$MINIO_ROOT_USER" ] || [ -z "$MINIO_ROOT_PASSWORD" ]; then
            echo "::error::MINIO_ROOT_USER/MINIO_ROOT_PASSWORD missing from .env — cannot render objstore.yml"
            exit 1
          fi
          # envsubst EXPLICIT allowlist: only these two vars expand, so any stray
          # '$' elsewhere in the template (comments etc.) is never mangled.
          envsubst '${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}' \
            < monitoring/thanos/objstore.yml.tpl \
            > monitoring/thanos/objstore.yml
          grep -q 'access_key: .' monitoring/thanos/objstore.yml || {
            echo "::error::objstore.yml render produced empty access_key"; exit 1; }
          # Vault TLS (idempotent — exits 0 if certs already exist). Gitignored dir.
          bash monitoring/vault/generate-tls.sh

          echo "[3/9] Ensuring Postgres is UP (migrations need a live DB)..."
          # Start ONLY postgres (+ redis, cheap) so migrations can run against it.
          # We do NOT down the full stack yet — that happens after the schema is
          # verified, so a migration failure leaves the running stack intact.
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans postgres redis
          # Wait for postgres to accept connections (max 60s).
          for i in $(seq 1 60); do
            if docker exec arbitragex-v2-postgres-1 pg_isready -U postgres -d arbitragex >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: postgres did not become ready in 60s — aborting deploy (migration gate)"
              exit 1
            fi
            sleep 1
          done

          echo "[4/9] PRE-DEPLOYMENT STATE CHECK — running migrations (Fail-fast gate)..."
          # The repo is the source of truth for schema. run_migrations.sh auto-discovers
          # every database/migrations/*.sql in numeric order and applies it idempotently.
          # If ANY migration fails, the deploy ABORTS here — code and DB must never
          # desync. This closes the gap where migration 102 (cartridge_id) existed in
          # the repo but the pipeline never applied it (it was manual on the VPS).
          MIGRATIONS_DIR="$(pwd)/database/migrations"
          export MIGRATIONS_DIR
          if ! bash database/run_migrations.sh; then
            echo "::error::MIGRATION GATE FAILED — deploy aborted to prevent code/DB desync"
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=40 postgres || true
            exit 1
          fi
          echo "schema synchronized with HEAD — safe to proceed"

          echo "[5/9] Rolling deploy — NO full 'down' (stack stays UP during deploy)..."
          # HARDENING: the old 'docker compose down --remove-orphans' left the
          # stack DEAD if any subsequent step failed. Instead, we build new
          # images FIRST (old containers still serve), then force-recreate per
          # service at step [7/9]. The stack is NEVER fully down during deploy.
          # The EXIT trap + watchdog are the safety net if anything still fails.

          # ═══ SELF-HEALING EXIT TRAP ═════════════════════════════════════════
          # HARDENING: if ANY step after `down` fails (build error, up error,
          # health timeout, migration failure, OOM, disk full, network glitch),
          # this trap fires on script exit and RESTORES the full stack from
          # cached images. Prevents the recurring "down → failed up → stack dead"
          # outage pattern. If the deploy SUCCEEDED (api-server running), the
          # trap is a no-op.
          deploy_self_heal() {
            local rc=$?
            if [ $rc -ne 0 ]; then
              echo "::warning::Deploy FAILED (rc=$rc) after docker compose down. Auto-restoring stack..."
            fi
            # Check if core services are alive. If not, RESTORE.
            if ! docker ps --format '{{.Names}}' 2>/dev/null | grep -q 'arbitragex-v2-api-server-1'; then
              echo "::warning::api-server is DOWN — bringing full stack back up (cached images)..."
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d \
                postgres redis anvil socket-proxy \
                searcher-rs sim-ctl relays-client recon selector-api math-engine \
                api-server edge frontend \
                token-enricher prometheus loki promtail grafana alertmanager minio vault \
                thanos-sidecar thanos-store thanos-query \
                2>/dev/null || echo "::error::Auto-restore FAILED — MANUAL INTERVENTION REQUIRED"
              echo "Auto-restore attempted. Verify: docker ps | grep arbitragex"
            else
              echo "Stack is UP (api-server running) — no restore needed."
            fi
            return $rc
          }
          trap deploy_self_heal EXIT

          echo "[6/9] Building core + hot-path services (sequential — lower peak disk/RAM)..."
          # Full --no-cache of the entire stack OOMs/fills the 150GB disk (was 82% full).
          # Build the operator-facing plane + the REAL data hot-path so the pipeline
          # (searcher → redis → postgres → api → dashboard) flows end-to-end (R7).
          # The hot-path was previously NEVER deployed, leaving the dashboard empty.
          # Rust images (searcher-rs, sim-ctl, relays-client) are heavy — build them
          # explicitly; they are capital-$0 (paper/shadow, BROADCAST stays disabled).
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build \
            api-server edge frontend \
            searcher-rs sim-ctl relays-client recon selector-api anvil math-engine \
            token-enricher socket-proxy

          echo "[7/9] Starting stack (infra + hot-path + operator plane + observability + minio/vault)..."
          # Thanos is started separately at [7c] AFTER the arbx-metrics bucket
          # exists — the sidecar's first-boot upload fails if the bucket is absent.
          # socket-proxy (api-server dependency) is started here explicitly.
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --force-recreate --remove-orphans \
            postgres redis anvil socket-proxy \
            searcher-rs sim-ctl relays-client recon selector-api math-engine \
            api-server edge frontend \
            token-enricher prometheus loki promtail grafana alertmanager minio vault

          echo "[7b/9] Waiting for Minio healthy, then creating arbx-metrics bucket..."
          for i in $(seq 1 45); do
            docker inspect --format '{{.State.Health.Status}}' arbitragex-v2-minio-1 2>/dev/null | grep -q healthy && break
            [ "$i" -eq 45 ] && echo "WARNING: minio not healthy in 45s — skipping bucket + thanos"
            sleep 1
          done
          if docker inspect --format '{{.State.Health.Status}}' arbitragex-v2-minio-1 2>/dev/null | grep -q healthy; then
            NET=$(docker inspect arbitragex-v2-minio-1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
            # creds via -e env (not argv); --ignore-existing makes it idempotent.
            docker run --rm --network "$NET" --entrypoint /bin/sh \
              -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
              minio/mc:RELEASE.2025-08-13T08-35-41Z \
              -c 'mc alias set arbx http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc mb --ignore-existing arbx/arbx-metrics' \
              || echo "WARNING: bucket creation failed (observability-only, non-blocking)"
          fi

          echo "[7c/9] Starting Thanos (sidecar + store + query)..."
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d thanos-sidecar thanos-store thanos-query \
            || echo "WARNING: thanos up failed (observability-only, non-blocking)"

          echo "[8/9] Waiting for health (operator plane via localhost; hot-path via compose healthy)..."
          # searcher-rs 9001 is container-internal only (no host port), so we check the
          # operator plane via localhost curl and the hot-path via `docker compose ps`
          # healthy status (its internal healthcheck probes 9001 inside the container).
          for i in $(seq 1 90); do
            PLANE_OK=0
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null 2>&1 \
               && curl -sf http://127.0.0.1:8787/health >/dev/null 2>&1; then
              PLANE_OK=1
            fi
            # searcher-rs healthy (or at least running) per compose, not host curl.
            SEARCHER_STATUS=$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps --format json searcher-rs 2>/dev/null | grep -o '"Health":"[a-z]*"' | head -1 || true)
            if [ "$PLANE_OK" = "1" ] && echo "$SEARCHER_STATUS" | grep -q healthy; then
              echo "healthy after ${i}s (api-server + edge via localhost; searcher-rs=$SEARCHER_STATUS)"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "WARNING: health not ready after 90s (plane_ok=$PLANE_OK searcher=$SEARCHER_STATUS) — dumping status"
              echo "NOTE: searcher-rs requires RPC_WS_1/RPC_HTTP_1 in .env; without them the"
              echo "hot-path stays down (fail-honest) and the dashboard shows the empty state."
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps || true
              docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" logs --tail=80 api-server edge frontend searcher-rs sim-ctl || true
              exit 1
            fi
            sleep 1
          done

          # Non-blocking observability health: Thanos is observability-only, so
          # an unhealthy thanos must NOT fail a feature deploy (warning only).
          curl -sf http://127.0.0.1:10904/-/healthy >/dev/null 2>&1 \
            && echo "thanos-query healthy (long-term metrics retention active)" \
            || echo "::warning:: thanos-query unhealthy (observability-only, non-blocking)"

          echo "[9/9] Final status (operator plane + hot-path)..."
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps
          curl -sf http://127.0.0.1:8080/api/health | head -c 400 || true
          echo
          curl -sf http://127.0.0.1:8787/health | head -c 400 || true
          echo
          # R7 traceability: confirm the data hot-path is producing (searcher → redis).
          # Empty stream is honest while RPC is absent; non-empty = pipeline alive.
          echo "hot-path trace (arbx:opps:detected XLEN):"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T redis \
            redis-cli XLEN arbx:opps:detected 2>/dev/null || echo "redis stream not yet available"
          echo "[9/9b] G4 DEPLOY-VERAZ assertion (post-deploy truth)..."
          # The deploy is only TRUE if the repo STILL sits at TARGET_SHA and the
          # frontend serves the new build. A green workflow with a stale box is
          # the incident this closes (2026-08-18: VPS 2 deploys behind on green).
          POST_HEAD="$(git rev-parse HEAD)"
          if [ "$POST_HEAD" != "$TARGET_SHA" ]; then
            echo "::error::POST-DEPLOY DRIFT: HEAD=${POST_HEAD} != TARGET=${TARGET_SHA}"
            exit 1
          fi
          if ! curl -sf -o /dev/null http://127.0.0.1:5173/opportunities/exchange; then
            echo "::error::frontend NOT serving /opportunities/exchange after deploy"
            exit 1
          fi
          echo "G4 PASS: box anchored at ${TARGET_SHA:0:8} + frontend serving the new build"
          echo "✅ Deploy completed at $(git rev-parse --short HEAD)"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
