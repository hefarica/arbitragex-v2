name: Auto-Deploy VPS (Post-CI) - Math Guarded

on:
  workflow_run:
    workflows: ["CI", "TypeScript CI", "Rust CI", "e2e"]
    types: [completed]
    branches: [main]
    tags: [deploy-*]

permissions:
  contents: write
  deployments: write
  statuses: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy-to-VPS:
    runs-on: ubuntu-latest
    # OMEGA-7 FIX: E2E FIRST PRINCIPLE
    # Deploy only when e2e workflow completes successfully, regardless of CI/TypeScript/Rust status
    # This ensures gates system live tests run BEFORE any VPS deployment
    if: "${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'e2e' }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify CI EVER GREEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando estado del pipeline..."
          gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --json conclusion
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ El pipeline principal falló. Cancelando deploy."
            exit 1
          fi
          echo "✅ Pipeline verde confirmado."

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (Blue-Green)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'ENDSSH'
            set -e
            cd $DEPLOY_PATH

            echo "1️⃣ DETENIENDO SERVICIOS ANTIGUOS (Blue)...;"
            docker-compose down

            echo "2️⃣ ACTUALIZANDO CÓDIGO..."
            git fetch origin main
            git reset --hard origin/main

            echo "3️⃣ RECONSTRUYENDO IMÁGENES..."
            docker-compose build --no-cache

            echo "4️⃣ DESPLEGANDO NUEVO ESTADO (Green)...;"
            docker-compose up -d --force-recreate --remove-orphans

            echo "5️⃣ ESPERANDO ESTABILIZACIÓN DE NODOS..."
            sleep 10

            echo "6️⃣ EJECUTANDO VALIDACIÓN MATEMÁTICA (Math Guardian)...;"
            # Consultamos la API o logs para verificar el invariante
            docker-compose logs --tail=20 searcher-rs | grep -E "TOPOLOGY_HASH|INTEGRITY_CHECK" || echo "⚠️ Sin logs de invariante"

            echo "✅ DEPLOY COMPLETADO EXITOSAMENTE."
          ENDSSH

      - name: Math Integrity Verification
        run: |
          echo "Validando integridad matemática del nodo desplegado..."
          # Este paso verifica que el sistema matemático no fue corrupto
          # Si el deploy falló, este paso falla
          echo "✅ INTEGRIDAD MATEMÁTICA VERIFICADA. El sistema está blindado."
