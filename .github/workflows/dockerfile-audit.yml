name: Dockerfile Audit

# INF-8: Verify all Dockerfiles have correct COPY directives for workspace members.
# Runs on any change to a Dockerfile, the backend Cargo workspace, or this workflow.

on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
      - 'automation/scripts/audit-dockerfiles.sh'
      - '.github/workflows/dockerfile-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - 'backend/Cargo.toml'
      - 'backend/Cargo.lock'
      - 'automation/scripts/audit-dockerfiles.sh'
      - '.github/workflows/dockerfile-audit.yml'

jobs:
  audit:
    name: audit Dockerfiles for complete COPY coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Make audit script executable
        run: chmod +x automation/scripts/audit-dockerfiles.sh

      - name: Run Dockerfile audit
        run: ./automation/scripts/audit-dockerfiles.sh
