name: M5 — Sepolia Validation (manual, CI-keyless)

# A.4/M5 pipeline. MANUAL ONLY (workflow_dispatch). Sepolia testnet only — there is NO mainnet path.
#
# CI IS KEYLESS. This workflow SIMULATES a Sepolia deploy (no signing, no on-chain send) and runs the
# read-only A.4 fork validation. A real Sepolia deploy (signing + on-chain send) runs from the
# operator/KMS plane, never from GitHub Actions — see docs/m5-sepolia-runbook.md.
#
# Governance: CI validates; the operator signs. CI never custodies or transmits keys.
#
# DEPENDENCY: the A.4 fork validation runs whatever `multistep_fork` test is in the checked-out ref.

on:
  workflow_dispatch:
    inputs:
      run_fork_validation:
        description: "Run the A.4 fork validation (read-only; needs RPC_HTTP_1_ARCHIVE secret)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # --- Deploy SIMULATION: keyless, no on-chain send, no approval needed -------------
  simulate_deploy:
    name: Simulate DeployTestnet (keyless, no on-chain send)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: Simulate DeployTestnet.s.sol (no on-chain send)
        env:
          M5_MODE: dry_run
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          AAVE_POOL_ADDRESS: ${{ vars.AAVE_POOL_SEPOLIA || '0x6Ae43d3271ff6888e7Fc43Fd7321a503ff738951' }}
        run: bash scripts/deploy-m5.sh

  # --- A.4 fork validation: READ-ONLY mainnet fork sim, no on-chain send ------------
  validate_fork:
    name: A.4 fork validation (read-only)
    if: ${{ inputs.run_fork_validation }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run A.4 fork validation (reuses scripts/run_a4_fork_validation.sh)
        env:
          RPC_HTTP_1: ${{ secrets.RPC_HTTP_1_ARCHIVE }}
          EXECUTOR_1: ${{ vars.M5_EXECUTOR_1 || '0x000000000000000000000000000000000000dEaD' }}
          SIM_ORCHESTRATOR_GAS_PRICE_WEI: ${{ vars.M5_GAS_PRICE_WEI || '25000000000' }}
        run: bash scripts/validate-m5.sh
      - name: Upload A.4 fork log
        uses: actions/upload-artifact@v4
        with:
          name: m5-a4-fork-log
          path: audits/gate-c/*.log
          if-no-files-found: ignore
