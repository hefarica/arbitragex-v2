name: ops(live-testnet)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no VPS deploy)"
        default: "true"
        type: choice
        options: ["true", "false"]
      chain_id:
        description: "Target testnet chain ID"
        default: "11155111"
        type: choice
        options: ["11155111", "421614", "11155420"]

env:
  NODE_VERSION: "20"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast on mainnet
        run: |
          if [ "${{ inputs.chain_id }}" = "1" ]; then
            echo "MAINNET_CHAIN_ID_REJECTED"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript workspaces
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint:all

      - name: Test shared-ts + frontend
        run: npm run test:all

      - name: Cargo check (Rust workspace)
        run: cargo check --workspace

  e2e-live-testnet:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install Playwright browsers
        run: cd tests/e2e && npm ci && npm run install-browsers

      - name: Run live-testnet contract tests
        run: cd tests/e2e && npx playwright test --config=playwright.live-testnet.config.ts --reporter=line
        env:
          ARBX_ADMIN_TOKEN: ${{ secrets.ARBX_ADMIN_TOKEN }}
          ARBX_API_URL: ${{ vars.ARBX_API_URL || 'http://localhost:8080' }}

  deploy:
    runs-on: ubuntu-latest
    needs: [validate, e2e-live-testnet]
    environment: live-testnet
    if: ${{ inputs.dry_run == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS (dry-run guarded)
        run: |
          echo "Live-testnet deploy placeholder"
          echo "Operator must wire SSH key + deploy script here."
          echo "This workflow NEVER deploys to mainnet."
