name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/rust.yml'

# M2 Capa1 Fase 4 — read-only token.
permissions:
  contents: read

jobs:
  check:
    name: cargo check + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.91.0
        with:
          # Toolchain pin: 1.91.0. The repo-root `rust-toolchain.toml` is the
          # single source of truth — it overrides this input for every cargo
          # invocation, so CI builds with the exact Rust the `FROM rust:1.91`
          # Docker images (backend/*/Dockerfile) ship. Bump the toolchain file,
          # the Docker tags, and this value together. (Was `stable`, silently
          # overridden by the toolchain file — corrected on audit 2026-08-08.)
          toolchain: 1.91.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      # ─── R1 hard-gate (audit re-run #2, 2026-05-10) ────────────────────────
      # Critical hot-path binaries (searcher-rs, relays-client) carry
      # #![deny(clippy::unwrap_used, clippy::expect_used)] at crate root. The
      # gating step below makes that promise enforceable at merge time. Any new
      # unwrap/expect in production code under these crates fails the merge.
      # Other crates use the workspace-wide advisory step further down.
      - name: cargo clippy (gating — searcher-rs + relays-client)
        run: cargo clippy -p searcher-rs -p relays-client --locked --all-targets -- -D warnings

      - name: cargo fmt (blocking — workspace)
        run: cargo fmt --all -- --check

      - name: cargo fmt (blocking — searcher-rs + relays-client)
        run: cargo fmt -p searcher-rs -p relays-client -- --check

      - name: cargo clippy (blocking — workspace)
        run: cargo clippy --workspace --locked -- -D warnings

      - name: cargo test --lib (workspace)
        # --lib runs only unit tests in lib targets, skipping integration tests
        # that require a live PostgreSQL or Redis (not available in CI here).
        # sqlx compile-time checked queries are excluded by DATABASE_URL stub.
        run: cargo test --workspace --locked --lib
        env:
          # Satisfies sqlx offline-mode guard at compile time; no real DB needed.
          DATABASE_URL: postgres://test:test@localhost/arbitragex_test
          REDIS_URL: redis://localhost:6379
          # Required by searcher-rs boot guard (RULE 02)
          SIM_SIGNER_ADDRESS: "0x000000000000000000000000000000000000dead"
