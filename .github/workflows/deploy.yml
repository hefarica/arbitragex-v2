name: Ω-S5++ APEX Deploy to VPS arbx

# Ejecución doctrinal:
#   - Manual (workflow_dispatch) — siempre que tú decidas, no automático en push
#   - Permite override de SHA específico para deploys/rollbacks puntuales
#   - Concurrency: 1 deploy a la vez, cancela jobs encolados
#   - Timeout total: 45 min (build no-cache de Rust puede tomar 20-30 min)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Commit SHA a desplegar (default: HEAD de main)'
        required: false
        default: ''
      skip_no_cache:
        description: 'Usar cache Docker (deploy rápido sin --no-cache)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: deploy-arbx
  cancel-in-progress: false  # NUNCA cancelar un deploy en curso

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy a arbx (195.201.235.70)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: http://195.201.235.70/

    steps:
      # ─────────────────────────────────────────────────────────────────
      # FASE 0: Setup SSH (clave desde Secrets, jamás en logs)
      # ─────────────────────────────────────────────────────────────────
      - name: 🔐 Setup SSH key + known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: 195.201.235.70
          VPS_USER: root
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fija el host key del VPS para evitar MITM (StrictHostKeyChecking=yes)
          ssh-keyscan -H -p 22 -t rsa,ecdsa,ed25519 $VPS_HOST > ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host arbx
            HostName $VPS_HOST
            User $VPS_USER
            Port 22
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config
          # Validar conectividad ANTES de cualquier acción destructiva
          ssh arbx 'echo "SSH OK · hostname=$(hostname) · uptime=$(uptime -p)"'

      # ─────────────────────────────────────────────────────────────────
      # FASE 1: PRE-FLIGHT (cero cambios destructivos)
      # ─────────────────────────────────────────────────────────────────
      - name: 📊 Pre-flight diagnóstico
        run: |
          ssh arbx 'bash -s' <<'EOSSH'
          set -e
          cd /opt/arbitragex-v2
          echo "=== git status ==="
          git status --porcelain | head -20
          # ARBX-DEPLOY-GATE-01 (2026-10-18): el gate original abortaba por CUALQUIER
          # entrada de `git status --porcelain`, incluidos los ficheros SIN TRACKEAR
          # (backups `.pre-*`, `archives/`, docs de trabajo). Eso bloqueaba el deploy
          # de forma permanente sin proteger nada: el anclaje posterior es
          # `git checkout -f <sha>`, que NO borra ficheros sin trackear. El riesgo real
          # —pisar trabajo sin commitear de otro agente— son los ficheros TRACKEADOS
          # modificados; solo esos siguen abortando.
          echo "=== git status (solo trackeados) ==="
          git status --porcelain --untracked-files=no | head -20
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "⚠️  STOP: hay ficheros TRACKEADOS modificados sin commitear. Otro agente puede estar trabajando."
            echo "    Los ficheros sin trackear no bloquean (no los toca el checkout)."
            exit 10
          fi
          UNTRACKED=$(git status --porcelain | grep -c '^??' || true)
          echo "ℹ️  ficheros sin trackear presentes: ${UNTRACKED} (no bloquean el deploy)"
          echo ""
          echo "=== HEAD actual ==="
          git log --oneline -5
          echo ""
          echo "=== Docker containers actuales ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          echo ""
          echo "=== Recursos disponibles ==="
          df -h /
          free -h
          echo ""
          echo "=== Health pre-deploy ==="
          curl -sf -o /dev/null -w "  /              → %{http_code}\n" http://localhost/
          curl -sf -o /dev/null -w "  /api/health    → %{http_code}\n" http://localhost/api/health || true
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 2: BACKUP (irreversibilidad protegida)
      # ─────────────────────────────────────────────────────────────────
      - name: 💾 Backup pre-deploy
        id: backup
        run: |
          BACKUP_NAME="arbitragex-backup-$(date -u +%Y%m%dT%H%M%SZ).tgz"
          ssh arbx "bash -s" <<EOSSH
          set -e
          cd /opt/arbitragex-v2
          PREV_SHA=\$(git rev-parse HEAD)
          echo "PREV_SHA=\$PREV_SHA" > /root/last-deploy.env
          # Backup config + data + estado git actual (NO sources, se recuperan de git)
          tar czf /root/$BACKUP_NAME \
            --exclude='node_modules' --exclude='target' --exclude='.next' \
            .env docker/ data/ 2>/dev/null || tar czf /root/$BACKUP_NAME .env docker/ 2>/dev/null || true
          ls -lh /root/$BACKUP_NAME
          echo "Backup: /root/$BACKUP_NAME · Previous SHA: \$PREV_SHA"
          EOSSH
          echo "backup_name=$BACKUP_NAME" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────────
      # FASE 3: ANCLAJE git (solo después de pre-flight + backup OK)
      # ─────────────────────────────────────────────────────────────────
      - name: 🎯 Anclar a SHA objetivo
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          SHA="${TARGET_SHA:-c815ef8c9048e8d6c6e97adc6865d884bfea6140}"
          ssh arbx "bash -s" <<EOSSH
          set -e
          cd /opt/arbitragex-v2
          git fetch --all --prune
          git checkout -f $SHA
          git log -1 --oneline
          echo "✅ Anclado a $SHA"
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 3b: CUARENTENA de fuentes sin trackear (ARBX-DEPLOY-CLEAN-01)
      # ─────────────────────────────────────────────────────────────────
      # Los ficheros SIN TRACKEAR dentro de los directorios de código entran en el
      # contexto de Docker y rompen el build aunque main esté sano. Caso real
      # (2026-10-18, run 39109011031): un test WIP huérfano en
      # `shared-ts/src/logging/http-logger.test.ts` abortó el build de api-server
      # con TS2305 (`accessReqSerializer` no exportado).
      # NO se borra nada: los ficheros se MUEVEN a una cuarentena con timestamp en
      # el propio VPS, recuperables con `mv`. El residuo que no es código
      # (backups `.pre-*`, `archives/`, docs) no se toca.
      - name: 🧹 Cuarentena de fuentes sin trackear
        run: |
          ssh arbx "bash -s" <<'EOSSH'
          set -e
          cd /opt/arbitragex-v2
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          Q="/root/arbx-deploy-quarantine/$TS"
          git ls-files --others --exclude-standard -- shared-ts/src backend frontend contracts > /tmp/arbx-stray.txt || true
          COUNT=$(wc -l < /tmp/arbx-stray.txt | tr -d ' ')
          echo "sin trackear en dirs de código: $COUNT"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$Q/$(dirname "$f")"
            mv "$f" "$Q/$f"
            echo "  cuarentena: $f -> $Q/$f"
          done < /tmp/arbx-stray.txt
          echo "cuarentena=$Q"
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 4: BUILD SECUENCIAL (Crisol Termodinámico)
      # Cada build verifica recursos antes y después
      # ─────────────────────────────────────────────────────────────────
      - name: 🔥 Build searcher-rs (Hot-Path)
        env:
          SKIP_NO_CACHE: ${{ github.event.inputs.skip_no_cache }}
        run: |
          CACHE_FLAG=$([ "$SKIP_NO_CACHE" = "true" ] && echo "" || echo "--no-cache")
          ssh arbx "bash -s" <<EOSSH
          set -e
          cd /opt/arbitragex-v2
          echo "=== Pre-build resources ==="; free -h; df -h /
          time docker compose --env-file .env -f docker/compose.prod.yml build $CACHE_FLAG searcher-rs
          echo "=== Post-build resources ==="; free -h; df -h /
          EOSSH

      - name: 🔥 Build api-server (Plano de Control)
        env:
          SKIP_NO_CACHE: ${{ github.event.inputs.skip_no_cache }}
        run: |
          CACHE_FLAG=$([ "$SKIP_NO_CACHE" = "true" ] && echo "" || echo "--no-cache")
          ssh arbx "bash -s" <<EOSSH
          set -e
          cd /opt/arbitragex-v2
          echo "=== Pre-build resources ==="; free -h; df -h /
          time docker compose --env-file .env -f docker/compose.prod.yml build $CACHE_FLAG api-server
          echo "=== Post-build resources ==="; free -h; df -h /
          EOSSH

      - name: 🔥 Build frontend + edge (Bóveda Visual + API edge)
        env:
          SKIP_NO_CACHE: ${{ github.event.inputs.skip_no_cache }}
        run: |
          CACHE_FLAG=$([ "$SKIP_NO_CACHE" = "true" ] && echo "" || echo "--no-cache")
          ssh arbx "bash -s" <<EOSSH
          set -e
          cd /opt/arbitragex-v2
          echo "=== Pre-build resources ==="; free -h; df -h /
          time docker compose --env-file .env -f docker/compose.prod.yml build $CACHE_FLAG frontend edge
          echo "=== Post-build resources ==="; free -h; df -h /
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 5: HOT-SWAP atómico
      # ─────────────────────────────────────────────────────────────────
      - name: 🚀 Hot-swap containers
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
        run: |
          # ARBX-DEPLOY-IDENTITY-01 (2026-10-18): estampa el stack con el commit
          # exacto. Compose interpola estas variables desde el env del SHELL hacia
          # el contenedor api-server (`environment:`), asi que `--env-file` solo NO
          # basta; sin el export `/status` reporta deploy.sha='unknown' y la
          # auditoria publica de navegador no puede identificar ni certificar la
          # version servida (run 39126190606: status_before/after FAILED por
          # 'unknown'). auto-deploy-vps.yml ya lo hacia; deploy.yml no.
          SHA="${TARGET_SHA:-c815ef8c9048e8d6c6e97adc6865d884bfea6140}"
          ssh arbx "ARBX_DEPLOY_SHA='$SHA' ARBX_DEPLOY_ID='$GITHUB_RUN_ID' ARBX_DEPLOYED_AT='$(date -u +%Y-%m-%dT%H:%M:%SZ)' bash -s" <<'EOSSH'
          set -e
          cd /opt/arbitragex-v2
          echo "deploy identity: sha=$ARBX_DEPLOY_SHA id=$ARBX_DEPLOY_ID at=$ARBX_DEPLOYED_AT"
          docker compose --env-file .env -f docker/compose.prod.yml up -d --remove-orphans \
            searcher-rs api-server frontend edge
          sleep 15
          docker compose --env-file .env -f docker/compose.prod.yml ps
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 6: HEALTHCHECK post-deploy
      # Si falla → step "Rollback" se dispara
      # ─────────────────────────────────────────────────────────────────
      - name: ✅ Healthcheck post-deploy
        id: healthcheck
        run: |
          ssh arbx "bash -s" <<'EOSSH'
          set -e
          echo "=== Aguardando 20s para warmup ==="; sleep 20

          fail=0
          probe() {
            local path=$1; local expected=$2
            local code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost$path")
            if [ "$code" = "$expected" ]; then
              echo "  ✅ $path → $code"
            else
              echo "  ❌ $path → $code (expected $expected)"
              fail=$((fail+1))
            fi
          }

          echo "=== Endpoints críticos (base) ==="
          probe /             200
          probe /api/health   200
          probe /chains       200
          probe /executions   200
          probe /opportunities 200

          echo "=== Endpoints APEX gap-closure (deben aparecer ahora) ==="
          probe /apex/allocator 200
          probe /omega-s5/core  200

          echo "=== Docker health ==="
          # ARBX-DEPLOY-FIX-02: el step corría sin `cd /opt/arbitragex-v2` (el path
          # relativo del compose no resolvía) y el VPS no tiene `jq` (exit 127). El
          # step abortaba AUNQUE los 7 probes dieran 200 → rollback innecesario.
          cd /opt/arbitragex-v2
          docker compose --env-file .env -f docker/compose.prod.yml ps \
            --format 'table {{.Service}}\t{{.State}}\t{{.Health}}' || true

          if [ $fail -gt 0 ]; then
            echo "❌ $fail endpoints fallaron — rollback obligatorio"
            exit 1
          fi
          echo "✅ Todos los endpoints PASS — deploy OK"
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 7: ROLLBACK automático si healthcheck falla
      # ─────────────────────────────────────────────────────────────────
      - name: 🔄 Rollback (solo si healthcheck falló)
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          ssh arbx "bash -s" <<'EOSSH'
          set -e
          source /root/last-deploy.env  # contiene PREV_SHA
          cd /opt/arbitragex-v2
          # ARBX-DEPLOY-IDENTITY-01: el rollback tambien estampa su SHA real.
          export ARBX_DEPLOY_SHA="$PREV_SHA"
          export ARBX_DEPLOY_ID="${GITHUB_RUN_ID:-rollback}"
          export ARBX_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "🔄 Rollback a $PREV_SHA"
          git checkout -f $PREV_SHA
          docker compose --env-file .env -f docker/compose.prod.yml up -d --remove-orphans \
            searcher-rs api-server frontend edge
          sleep 20
          curl -sf -o /dev/null -w "Rollback health: %{http_code}\n" http://localhost/api/health
          EOSSH

      # ─────────────────────────────────────────────────────────────────
      # FASE 8: Limpieza SSH (siempre, incluso si falla)
      # ─────────────────────────────────────────────────────────────────
      - name: 🧹 Cleanup SSH
        if: always()
        run: |
          shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/config ~/.ssh/known_hosts
          echo "SSH key destruida del runner"
