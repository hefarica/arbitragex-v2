# NGINX-CONF-DRIFT-01 v2 (2026-10-18) — reconciliación del nginx del VPS por GitHub Actions.
#
# v2 incorpora la revisión del operador sobre la v1 (PR #961):
#   B1. La verificación mide el host que estaba roto: `:8787` (vhost del edge, que
#       proxya a 127.0.0.1:8788) y los nombres públicos, ANTES y DESPUÉS. La
#       expectativa por host se MIDE, no se deduce.
#   B2. `concurrency.group` = `deploy-arbx`, el MISMO que `deploy.yml` (los grupos
#       de GitHub se resuelven por nombre y son repo-wide: con nombres distintos
#       no hay exclusión mutua).
#   B3. Guard de root: los pasos que mutan exigen `id -u == 0` (o abortan).
#   R1. El install canónico NO es a ciegas: sólo se aplica si TODAS las líneas del
#       diff vivo-vs-canónico son `add_header … Content-Security-Policy`. Si hay
#       cualquier otra diferencia, se aborta el install y se comenta el drift EN SITIO.
#   R2. `nginx -T` (config EFECTIVA, includes incluidos) antes/después con sha256, y
#       recuento de TODAS las cabeceras por server_name (no sólo CSP).
#   R3. Ojo con la herencia de `add_header` en nginx: comentar el único `add_header`
#       de un `location` hace que herede el juego del padre. Por eso se mide la
#       config efectiva y las cabeceras reales, no el grep de un fichero.
#   m-a..m-g. Guard de confirmación alcanzable; grep de drift sobre nginx.conf,
#       conf.d, sites-enabled y sites-available; reload sólo si algo cambió;
#       `timeout-minutes`; pin opcional de huella SSH; artefacto con la evidencia;
#       y el fallo a mitad se reporta como estado PARCIAL, no como "sin cambios".
#
# Nada de `compose up` aquí: el redeploy va por `deploy.yml`.
name: VPS nginx canonical sync (NGINX-CONF-DRIFT-01)

on:
  # NGINX-CONF-DRIFT-01 v3 (2026-10-18) — the sync had NO push trigger, so it
  # could never reconcile on its own: every push that changed only nginx moved
  # `main` while production stayed put (verified: 0 runs after a main push, and
  # the file declared `workflow_dispatch` only). A `push` to a nginx path now
  # reconciles automatically, in the default `aplicar` mode; `workflow_dispatch`
  # remains for an operator-driven run (with the SYNC confirmation).
  push:
    branches: [main]
    paths:
      - 'config/nginx/**'
      - 'infra/nginx/**'
      - 'frontend/nginx.conf'
      - 'scripts/vps/**'
      - '.github/workflows/vps-nginx-canonical-sync.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe SYNC para confirmar la reconciliación del nginx del VPS"
        required: true
        type: string
      mode:
        description: "solo-medir = evidencia sin mutar; aplicar = reconciliar"
        required: false
        default: "aplicar"
        type: choice
        options:
          - "solo-medir"
          - "aplicar"

permissions:
  contents: read

concurrency:
  # Same group as the ACTIVE auto-deploy (auto-deploy-vps.yml uses
  # `production-vps`); `deploy-arbx` only matched the manual deploy.yml, so a
  # nginx reload could race a real deploy. cancel-in-progress stays false: a
  # half-finished deploy must not be killed by an nginx push, nor the reverse.
  group: production-vps
  cancel-in-progress: false

jobs:
  sync:
    name: Reconciliar nginx con el canónico del repo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "Guard de confirmación (alcanzable: sin `if` en el job)"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Automatic trigger: no human to type SYNC. The reconciliation guards
            # below (class-checked install, nginx -t, backup + rollback, reload
            # only on change) are what make auto-apply safe.
            echo "confirm=SYNC (push) · mode=aplicar"
            exit 0
          fi
          if [ "${{ inputs.confirm }}" != "SYNC" ]; then
            echo "::error::confirm debe ser SYNC (recibido: '${{ inputs.confirm }}')"
            exit 1
          fi
          echo "confirm=SYNC · mode=${{ inputs.mode }}"

      - name: Checkout repository (fuente de verdad del canónico)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup SSH (clave efímera, huella verificable)
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_FP: ${{ secrets.VPS_SSH_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_FP" ]; then
            # Huella pinneada (no TOFU): se exige coincidencia exacta.
            echo "$VPS_HOST $(ssh-keyscan -T 10 -p "$VPS_PORT" "$VPS_HOST" 2>/dev/null | awk '{print $2" "$3}')" > ~/.ssh/known_hosts_pinned
            ssh-keygen -lf ~/.ssh/known_hosts_pinned | awk '{print $2}' | grep -Fx "$VPS_FP" \
              || { echo "::error::huella SSH del VPS no coincide con VPS_SSH_HOST_FINGERPRINT"; exit 1; }
            cp ~/.ssh/known_hosts_pinned ~/.ssh/known_hosts
            echo "huella SSH pinneada OK"
          else
            ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
            echo "::warning::VPS_SSH_HOST_FINGERPRINT no configurado — TOFU (ssh-keyscan)"
          fi
          test -s ~/.ssh/known_hosts
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "VPS_USER=$VPS_USER" >> "$GITHUB_ENV"
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

      - name: "Medición ANTES (config efectiva + cabeceras por host, el edge incluido)"
        run: |
          mkdir -p /tmp/nginx-evidence
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s" <<'EOSSH' > /tmp/nginx-evidence/antes.txt 2>&1
          set -uo pipefail
          echo "=== id -u (root requerido para mutar) ==="; id -u; id -un
          echo "=== nginx -v ==="; nginx -v 2>&1
          echo "=== nginx -T (config EFECTIVA) — sha256 ==="
          nginx -T 2>/dev/null | tee /tmp/nginx-T-before.txt | sha256sum
          echo "=== dónde se declara CSP (nginx.conf, conf.d, sites-*) ==="
          grep -rn "Content-Security-Policy" /etc/nginx/nginx.conf /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null || echo "(ninguna)"
          echo "=== L0: vivo vs canónico del repo (sites-enabled/arbitragex) ==="
          if [ -f /etc/nginx/sites-enabled/arbitragex ] && [ -f /opt/arbitragex-v2/config/nginx/arbitragex.conf ]; then
            diff -u "$(readlink -f /etc/nginx/sites-enabled/arbitragex)" /opt/arbitragex-v2/config/nginx/arbitragex.conf && echo "L0: idénticos" || echo "L0: DIVERGEN (arriba)"
          else
            echo "L0: no comparable (falta alguno de los dos ficheros)"
          fi
          echo "=== cabeceras por host (todas, no sólo CSP) ==="
          for spec in "frontend :80 Host:arbx.ape-tv.net" "edge-origen :8787 Host:edge-arbx.ape-tv.net"; do
            set -- $spec; NAME=$1; PORT=$2; HOST=$3
            echo "--- $NAME (http://127.0.0.1:$PORT/ $HOST) ---"
            curl -sD - -o /dev/null -m 10 -H "$HOST" "http://127.0.0.1:$PORT/" 2>/dev/null | grep -iE "^(HTTP/|content-security-policy|x-frame-options|strict-transport-security)" || echo "(sin respuesta)"
          done
          echo "=== nombres públicos (incluye lo que añada Cloudflare) ==="
          for h in https://arbx.ape-tv.net/ https://edge-arbx.ape-tv.net/; do
            echo "--- $h ---"
            curl -sD - -o /dev/null -m 15 "$h" 2>/dev/null | grep -icE "^content-security-policy" | sed 's/^/cabeceras CSP: /'
            curl -sD - -o /dev/null -m 15 "$h" 2>/dev/null | grep -iE "^(HTTP/|content-security-policy)" || true
          done
          EOSSH
          cat /tmp/nginx-evidence/antes.txt

      - name: "Aplicar (canónico sólo si el delta es el drift; si no, comentar en sitio)"
        if: ${{ github.event_name == 'push' || inputs.mode == 'aplicar' }}
        run: |
          STAGE="/tmp/nginx-canon-${{ github.run_id }}"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "install -m 700 -d $STAGE/scripts/vps $STAGE/config/nginx"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/vps/install-nginx-canonical.sh "$VPS_USER@$VPS_HOST:$STAGE/scripts/vps/"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            config/nginx/arbitragex.conf "$VPS_USER@$VPS_HOST:$STAGE/config/nginx/"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s" <<EOSSH > /tmp/nginx-evidence/aplicar.txt 2>&1
          set -uo pipefail
          [ "\$(id -u)" = 0 ] || { echo "::error::el usuario SSH del VPS debe ser root (id -u != 0) para tocar /etc/nginx"; exit 1; }
          STAGE="$STAGE"
          CANON="\$STAGE/config/nginx/arbitragex.conf"
          LIVE=/etc/nginx/sites-enabled/arbitragex
          TS=\$(date -u +%Y%m%dT%H%M%SZ)
          BAKDIR="/etc/nginx/drift-backup-\$TS"
          install -m 700 -d "\$BAKDIR"

          # --- R1 (revisado 2026-10-18): el install canónico se decide por CLASE de delta ---
          #
          # DEFECTO CORREGIDO: R1 abortaba ante CUALQUIER línea cambiada que no fuera un
          # `add_header ... Content-Security-Policy`, incluidas las de COMENTARIO. El
          # canónico trae comentarios que el fichero vivo no tiene ⇒ R1 abortaba SIEMPRE
          # y el canónico NO se instalaba nunca (el drift se parcheaba en sitio y el
          # resto del canónico quedaba sin aplicar, indefinidamente).
          #
          # Ahora cada línea cambiada se CLASIFICA y se imprime — nada silencioso:
          #   CSP     el drift que R1 existe para matar (add_header CSP)
          #   COMMENT empieza por '#' tras el +/-: no cambia el comportamiento de nginx
          #   BLANK   línea vacía: no cambia el comportamiento de nginx
          #   REAL    cualquier otra línea ⇒ ÚNICO caso que aborta
          # El aborto se conserva para drift REAL, que es su razón de existir.
          if [ -e "\$LIVE" ]; then
            LIVE_REAL=\$(readlink -f "\$LIVE")
            DIFF=\$(diff -u "\$LIVE_REAL" "\$CANON" || true)
            CHANGED=\$(printf '%s\n' "\$DIFF" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            R1_CSP=\$(printf '%s\n' "\$CHANGED" | grep -E 'add_header.*Content-Security-Policy' || true)
            R1_COMMENT=\$(printf '%s\n' "\$CHANGED" | grep -E '^[+-][[:space:]]*#' || true)
            R1_BLANK=\$(printf '%s\n' "\$CHANGED" | grep -E '^[+-][[:space:]]*$' || true)
            R1_REAL=\$(printf '%s\n' "\$CHANGED" \
                        | grep -vE 'add_header.*Content-Security-Policy' \
                        | grep -vE '^[+-][[:space:]]*#' \
                        | grep -vE '^[+-][[:space:]]*$' || true)
            echo "--- R1: clasificación del delta (vivo vs canónico) ---"
            echo "  CSP     : \$(printf '%s\n' "\$R1_CSP" | grep -c . || true)"
            echo "  COMMENT : \$(printf '%s\n' "\$R1_COMMENT" | grep -c . || true)"
            echo "  BLANK   : \$(printf '%s\n' "\$R1_BLANK" | grep -c . || true)"
            echo "  REAL    : \$(printf '%s\n' "\$R1_REAL" | grep -c . || true)"
            [ -n "\$R1_CSP" ] && { echo "  --- CSP (drift esperado) ---"; printf '%s\n' "\$R1_CSP" | head -10; }
            [ -n "\$R1_COMMENT" ] && { echo "  --- COMMENT (no aborta) ---"; printf '%s\n' "\$R1_COMMENT" | head -10; }
            [ -n "\$R1_BLANK" ] && { echo "  --- BLANK (no aborta) ---"; printf '%s\n' "\$R1_BLANK" | head -5; }
            if [ -n "\$R1_REAL" ]; then
              echo "ABORT install canónico: hay drift REAL (no CSP, no comentario, no línea vacía):"
              printf '%s\n' "\$R1_REAL" | head -40
              echo "→ se comenta el drift EN SITIO (sin importar el resto del canónico)."
              SKIP_CANON=1
            else
              echo "delta = sólo CSP / comentario / línea vacía → se instala el canónico"
              SKIP_CANON=0
            fi
          else
            SKIP_CANON=0
          fi

          if [ "\$SKIP_CANON" = 0 ]; then
            bash "\$STAGE/scripts/vps/install-nginx-canonical.sh"
          fi

          # --- Comentar (no borrar) el add_header CSP driftado, resiguiendo symlinks ---
          TARGETS=\$(grep -rlE "^[[:space:]]*add_header[^;]*Content-Security-Policy" \
                     /etc/nginx/nginx.conf /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null || true)
          # v3 (revisión del operador): DEDUPE por fichero REAL. `sites-enabled/x` es un
          # symlink a `sites-available/x`, así que `grep -rl` lista el MISMO fichero real dos
          # veces. Sin dedupe, la 2ª iteración hace `cp -a` sobre el fichero YA modificado y
          # pisa el backup prístino ⇒ si `nginx -t` falla, el "rollback" restaura la versión
          # con el drift. Resolver a ruta real y ordenar -u antes del bucle.
          if [ -n "\$TARGETS" ]; then
            TARGETS=\$(printf '%s\n' \$TARGETS | xargs -r readlink -f | sort -u)
          fi
          CHANGED=0
          for f in \$TARGETS; do
            REAL=\$(readlink -f "\$f")
            cp -a "\$REAL" "\$BAKDIR/\$(basename "\$REAL")"
            sed -i -E "s|^([[:space:]]*)(add_header[^;]*Content-Security-Policy.*)\$|\1# DRIFT-REMOVED \$TS (NGINX-CONF-DRIFT-01): \2|" "\$REAL"
            echo "comentado en: \$REAL (backup: \$BAKDIR/\$(basename "\$REAL"))"
            CHANGED=1
          done
          [ "\$CHANGED" = 1 ] || echo "sin add_header CSP activo que comentar"

          if ! nginx -t 2>&1; then
            echo "ROLLBACK: nginx -t falló — restaurando backups de \$BAKDIR"
            for f in \$TARGETS; do REAL=\$(readlink -f "\$f"); cp -a "\$BAKDIR/\$(basename "\$REAL")" "\$REAL"; done
            nginx -t || true
            exit 1
          fi
          if [ "\$CHANGED" = 1 ]; then
            systemctl reload nginx && echo "reload OK"
          else
            echo "sin cambios → sin reload (idempotente)"
          fi
          echo "backups en \$BAKDIR"
          EOSSH
          cat /tmp/nginx-evidence/aplicar.txt

      - name: "Medición DESPUÉS (config efectiva + cabeceras por host, el edge incluido)"
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s" <<'EOSSH' > /tmp/nginx-evidence/despues.txt 2>&1
          set -uo pipefail
          echo "=== nginx -t ==="; nginx -t 2>&1
          echo "=== nginx -T (config EFECTIVA) — sha256 ==="
          nginx -T 2>/dev/null | tee /tmp/nginx-T-after.txt | sha256sum
          echo "=== diff de la config efectiva antes/después ==="
          diff -u /tmp/nginx-T-before.txt /tmp/nginx-T-after.txt || true
          echo "=== cabeceras por host (todas) ==="
          for spec in "frontend :80 Host:arbx.ape-tv.net" "edge-origen :8787 Host:edge-arbx.ape-tv.net"; do
            set -- $spec; NAME=$1; PORT=$2; HOST=$3
            echo "--- $NAME (http://127.0.0.1:$PORT/ $HOST) ---"
            curl -sD - -o /dev/null -m 10 -H "$HOST" "http://127.0.0.1:$PORT/" 2>/dev/null | grep -iE "^(HTTP/|content-security-policy|x-frame-options|strict-transport-security)" || echo "(sin respuesta)"
          done
          echo "=== nombres públicos ==="
          for h in https://arbx.ape-tv.net/ https://edge-arbx.ape-tv.net/; do
            echo "--- $h ---"
            curl -sD - -o /dev/null -m 15 "$h" 2>/dev/null | grep -icE "^content-security-policy" | sed 's/^/cabeceras CSP: /'
            curl -sD - -o /dev/null -m 15 "$h" 2>/dev/null | grep -iE "^(HTTP/|content-security-policy)" || true
          done
          echo "=== grep residual de CSP activa en /etc/nginx ==="
          grep -rnE "^[[:space:]]*add_header[^;]*Content-Security-Policy" /etc/nginx/nginx.conf /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null || echo "(ninguna activa)"
          EOSSH
          cat /tmp/nginx-evidence/despues.txt

      - name: "Evidencia como artefacto (antes/después/aplicar)"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nginx-canonical-sync-evidence
          path: /tmp/nginx-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Nota de cierre (semántica de fallo parcial)
        if: always()
        run: |
          echo "Si algún paso falló, el estado NO es 'sin cambios': puede quedar el canónico"
          echo "instalado y el drift presente (o al revés). Revisar /tmp/nginx-evidence/aplicar.txt"
          echo "y las cabeceras del artefacto antes de reintentar."
          # v3 (revisión del operador): el estado parcial debe FALLAR el run, no sólo imprimirse.
          #   ROLLBACK: `nginx -t` falló y se restauraron backups ⇒ el objetivo NO se logró.
          #   ABORT:    el delta vivo-vs-canónico NO era sólo el drift CSP ⇒ el canónico no se
          #             instaló (el drift sí se comentó en sitio) ⇒ requiere revisión humana.
          # Con `if: always()`, esto convierte en rojo un run que de otro modo quedaría verde
          # con el canónico instalado y el drift presente (o al revés).
          if [ -f /tmp/nginx-evidence/aplicar.txt ] && grep -qE 'ROLLBACK:|ABORT install' /tmp/nginx-evidence/aplicar.txt; then
            echo "::error::estado PARCIAL — la evidencia de 'aplicar' contiene ROLLBACK/ABORT; el run NO es 'sin cambios'."
            grep -nE 'ROLLBACK:|ABORT install' /tmp/nginx-evidence/aplicar.txt
            exit 1
          fi
          echo "sin señales de estado parcial en la evidencia de 'aplicar'."
