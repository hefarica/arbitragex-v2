name: Ω-S5++ APEX Verify admin session wiring (READ-ONLY)
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/arbx_key
          chmod 600 ~/.ssh/arbx_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Verify admin session wiring E2E"
        run: |
          ssh -i ~/.ssh/arbx_key root@${{ env.VPS_HOST }} 'bash -s' << 'REMOTE'
            set +e
            ADMIN_TOKEN=$(grep -E '^ARBX_ADMIN_TOKEN=' /opt/arbitragex-v2/.env | cut -d= -f2-)
            PASS=0
            FAIL=0
            run() {
              local name="$1"; local expected="$2"; local got="$3"
              if [ "$got" = "$expected" ]; then
                echo "  ✓ $name → $got"; PASS=$((PASS+1))
              else
                echo "  ❌ $name → got $got, expected $expected"; FAIL=$((FAIL+1))
              fi
            }

            echo "═══ M1.A — POST /admin/session (create cookie) ═══"
            rm -f /tmp/c
            HTTP=$(curl -sk -o /tmp/r1.json -w '%{http_code}' -c /tmp/c \
              -X POST http://127.0.0.1:8787/admin/session \
              -H 'content-type: application/json' \
              -d "{\"token\":\"$ADMIN_TOKEN\"}")
            run "POST /admin/session" "200" "$HTTP"
            echo "    response: $(head -c 200 /tmp/r1.json)"
            echo "    cookies issued: $(grep -E '^[^#]' /tmp/c | awk '{print $6}' | tr '\n' ' ')"

            echo ""
            echo "═══ M1.B — GET /api/admin/chains WITH cookie (THE BUG FIX) ═══"
            HTTP=$(curl -sk -o /tmp/r2.json -w '%{http_code}' -b /tmp/c http://127.0.0.1:8787/api/admin/chains)
            run "GET /api/admin/chains (cookie)" "200" "$HTTP"
            echo "    response: $(head -c 300 /tmp/r2.json)"

            echo ""
            echo "═══ M1.C — GET /api/admin/chains WITHOUT cookie (must be 401) ═══"
            HTTP=$(curl -sk -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/admin/chains)
            run "GET /api/admin/chains (no cookie)" "401" "$HTTP"

            echo ""
            echo "═══ M3.A — SSR /omega-s5/registry/chain anon (must be 200 fail-honest) ═══"
            HTTP=$(curl -sk -o /tmp/page-anon.html -w '%{http_code}' http://127.0.0.1:3000/omega-s5/registry/chain)
            run "SSR /registry/chain (anon)" "200" "$HTTP"
            MARKERS=$(grep -c -iE 'AUTH_REQUIRED|admin.session.required|sign.?in' /tmp/page-anon.html 2>/dev/null || echo "0")
            echo "    AUTH_REQUIRED markers in HTML: $MARKERS"

            echo ""
            echo "═══ M3.B — SSR /omega-s5/registry/token anon ═══"
            HTTP=$(curl -sk -o /tmp/page-token.html -w '%{http_code}' http://127.0.0.1:3000/omega-s5/registry/token)
            run "SSR /registry/token (anon)" "200" "$HTTP"

            echo ""
            echo "═══ M3.C — SSR /omega-s5/registry/chain WITH cookie ═══"
            HTTP=$(curl -sk -o /tmp/page-auth.html -w '%{http_code}' -b /tmp/c http://127.0.0.1:3000/omega-s5/registry/chain)
            run "SSR /registry/chain (cookie)" "200" "$HTTP"

            echo ""
            echo "═══ M4 — /admin/signin reachable ═══"
            HTTP=$(curl -sk -o /tmp/signin.html -w '%{http_code}' http://127.0.0.1:3000/admin/signin)
            run "GET /admin/signin" "200" "$HTTP"
            grep -c -iE 'admin.token|password' /tmp/signin.html 2>/dev/null | head -1

            echo ""
            echo "═══ M3.D — comparison: /apex/allocator must still be 200 (non-admin route) ═══"
            HTTP=$(curl -sk -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/apex/allocator)
            run "GET /apex/allocator" "200" "$HTTP"

            echo ""
            echo "════════════════════════════════════════════"
            echo "  RESULT: $PASS passed, $FAIL failed"
            echo "════════════════════════════════════════════"
            test "$FAIL" = "0"
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/arbx_key
