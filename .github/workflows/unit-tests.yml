name: unit-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token.
permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # `stable` follows the current Rust release. See rust.yml for rationale.
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend
      - name: Run cargo test --lib
        # --lib only — integration tests need PG/Redis live (not in CI).
        # sqlx offline mode satisfied by stub DATABASE_URL.
        run: cargo test --workspace --locked --lib
        env:
          DATABASE_URL: postgres://test:test@localhost/arbitragex_test
          REDIS_URL: redis://localhost:6379
          SIM_SIGNER_ADDRESS: "0x000000000000000000000000000000000000dead"

  typescript:
    name: TypeScript tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        # `npm ci` makes package-lock.json the source of truth. If the committed
        # lockfile lacks the Linux platform-native rollup optional dependency,
        # CI will fail honestly and the lockfile must be regenerated on a Linux
        # runner/WSL.
        run: npm ci --no-audit --no-fund
      - name: Build @arbx/shared
        # Dependent workspaces (selector-api, api-server, edge/*) resolve
        # @arbx/shared from `shared-ts/dist/`. Typecheck fails with
        # "Cannot find module '@arbx/shared'" if dist/ doesn't exist.
        run: npm run -w @arbx/shared build
      - name: Typecheck all workspaces
        # M4 hard-gate flip (FASE 1, omega/audit-fixes-20260628). The 5
        # pre-existing api-server type errors (registry-engine.ts
        # exactOptionalPropertyTypes drift, admin-promote-mainnet.ts missing
        # .js extensions + Redis namespace, operator.ts missing .js extension)
        # are CLEARED on main — `npm run typecheck --workspaces` exits 0.
        # Now a BLOCKING gate.
        run: npm run typecheck --workspaces --if-present
      - name: Run tests
        # M4 hard-gate flip (FASE 1): typecheck green → tests blocking too.
        # Verified `npm test --workspaces --if-present` exits 0 (671 tests pass).
        run: npm test --workspaces --if-present
