name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token. upload-artifact uses GITHUB_TOKEN
# implicitly but only requires contents:read in the v4+ artifact API.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking for the first week (per spec §7 risk register). Flip to
    # required on branch-protection once we have 5 consecutive greens.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Materialize .env for compose (CI dev defaults)
        # docker/compose.dev.yml references `env_file: [../.env]` on every
        # service. Without it, `docker compose up` aborts before any container
        # starts. We copy .env.example verbatim — it ships only public
        # endpoints and placeholder tokens, never real secrets (audit M12).
        #
        # The shared-ts secure-boot middleware rejects ARBX_*_TOKEN / JWT_SECRET
        # values shorter than 32 bytes (the .env.example ships human-readable
        # `<run: openssl rand ...>` placeholders that fail this assertion).
        # Generate ephemeral tokens here so api-server and edge boot cleanly
        # in CI. These tokens never leave the runner and are torn down with
        # the compose stack.
        run: |
          set -euo pipefail
          if [ ! -f .env ]; then
            cp .env.example .env
            # Replace each <run: openssl rand ...> placeholder with a fresh
            # ephemeral token. Use python with one assignment per call to
            # avoid heredoc indentation pitfalls inside GitHub Actions YAML.
            replace_token() {
              local key="$1"
              local val="$2"
              KEY="$key" VAL="$val" python3 -c 'import os,re,pathlib; p=pathlib.Path(".env"); p.write_text(re.sub(r"^"+re.escape(os.environ["KEY"])+r"=.*$", os.environ["KEY"]+"="+os.environ["VAL"], p.read_text(), flags=re.M))'
            }
            replace_token ARBX_EDGE_TOKEN    "$(openssl rand -base64 48 | tr -d '\n')"
            replace_token ARBX_ADMIN_TOKEN   "$(openssl rand -base64 48 | tr -d '\n')"
            replace_token ARBX_SERVICE_TOKEN "$(openssl rand -base64 48 | tr -d '\n')"
            replace_token JWT_SECRET         "$(openssl rand -base64 64 | tr -d '\n')"
            echo ".env materialized with ephemeral CI-only tokens"
          fi

      - name: Bring up compose stack (dev — defaults OK for CI)
        env:
          # Smoke tests assert no "edge error:" banner is rendered, which
          # means the browser MUST be able to reach edge. Playwright runs on
          # the runner host, and the edge container publishes 8787:8787, so
          # http://localhost:8787 is reachable from the test browser.
          # next.config.js production-build guardrail normally rejects
          # localhost; ARBX_BUILD_FOR_LOCAL_E2E=1 unlocks it explicitly with
          # a printed warning. Never set this in staging or prod.
          NEXT_PUBLIC_EDGE_URL: http://localhost:8787
          NEXT_PUBLIC_WS_URL: http://localhost:3000
          ARBX_BUILD_FOR_LOCAL_E2E: "1"
        run: |
          docker compose -f docker/compose.dev.yml up -d --build \
            postgres redis frontend edge api-server
          echo "stack up; waiting for frontend"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"  # CI runs without Alchemy; the rpc-down spec validates honest-idle
        run: npm run test:smoke

      - name: Run full suite (may skip killswitch if no admin token)
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"
        run: npm test

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== api-server ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 api-server || true
          echo "=== edge ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 edge || true
          echo "=== frontend ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 frontend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yml down -v
