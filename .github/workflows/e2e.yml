name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token. upload-artifact uses GITHUB_TOKEN
# implicitly but only requires contents:read in the v4+ artifact API.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BLOCKING (Gate 2 hardened): e2e failures fail CI. Remove branch-protection
    # exemption once 5 consecutive greens observed.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Materialize .env from .env.example (Ghost-safe — placeholders T2 only)
        run: |
          # Doctrina: .env.example contiene SOLO placeholders públicos T2 (puertos,
          # log levels, feature flags). NO contiene secretos reales. Compose.dev.yml
          # requiere env_file: ../.env por design — esto es materialización CI legítima.
          cp .env.example .env
          # ARBX-HARDENING (next.config.js): NEXT_PUBLIC_EDGE_URL/WS_URL must NOT
          # point to localhost when NODE_ENV=production (forced by frontend/Dockerfile).
          # Use Docker DNS service names — these are valid in both build and runtime.
          {
            echo "NEXT_PUBLIC_EDGE_URL=http://edge:8787"
            echo "NEXT_PUBLIC_WS_URL=http://api-server:3000"
          } >> .env
          # OMEGA-102 hot-fix (SECURE_BOOT): api-server / edge / shared-ts run
          # assertSecureBootTokens() at boot which REJECTS any token shorter than
          # 32 bytes (shared-ts/src/middleware/index.ts:51). The .env.example file
          # uses literal "<run: openssl rand -base64 48>" placeholders (30 chars)
          # which fail this check and cause api-server to crash-loop, producing
          # 502s on edge proxy → playwright timeouts. We generate ephemeral CI
          # tokens here (48-byte base64 ≈ 64 chars) — these never leave the
          # ephemeral CI runner and are NOT secrets.
          {
            echo "ARBX_ADMIN_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ARBX_EDGE_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ARBX_SERVICE_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
          } >> .env
          # PLAYWRIGHT-FIX: .env.example has <run: openssl rand -base64 48> placeholders
          # (lines 198/200/204) that break `bash . .env` sourcing in migrate.sh (bash
          # interprets < as redirection → syntax error → migration fails). Replace all
          # such placeholders with empty strings before migrate.sh is called.
          sed -i "s|=<run:[^>]*>$|=|g" .env
          # PLAYWRIGHT-FIX-2: DATABASE_MIGRATOR_URL in .env.example points to Docker
          # service name 'postgres' (only resolvable inside Docker network). migrate.sh
          # runs on the host runner where 5432 is mapped to localhost (compose.dev.yml
          # ports: ["127.0.0.1:5432:5432"]). Override to localhost so psql can connect.
          sed -i "s|DATABASE_MIGRATOR_URL=.*|DATABASE_MIGRATOR_URL=postgres://postgres:postgres@localhost:5432/arbitragex|" .env
          echo "::notice::.env materialized + placeholders cleaned + SECURE_BOOT tokens injected"

      - name: Bring up compose stack (dev — defaults OK for CI)
        run: |
          # OMEGA-102 hot-fix: --env-file .env is REQUIRED so compose reads the
          # root .env (NEXT_PUBLIC_EDGE_URL=http://edge:8787 injected at line 43
          # above), instead of falling back to compose.dev.yml's literal default
          # http://localhost:8787 which triggers the next.config.js R2 guard
          # under NODE_ENV=production during the frontend builder stage.
          docker compose --env-file .env -f docker/compose.dev.yml up -d postgres redis
          echo "waiting for postgres"
          for i in $(seq 1 60); do
            if docker compose --env-file .env -f docker/compose.dev.yml exec -T postgres pg_isready -U postgres -d arbitragex >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "postgres failed to become ready after 60s"
              docker compose --env-file .env -f docker/compose.dev.yml logs --tail=50 postgres
              exit 1
            fi
            sleep 1
          done
          echo "waiting for initdb to finish"
          for i in $(seq 1 60); do
            if PGPASSWORD=postgres psql -h localhost -U postgres -d arbitragex -c "SELECT 1" >/dev/null 2>&1; then
              echo "initdb done after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "initdb did not finish after 60s"
              docker compose --env-file .env -f docker/compose.dev.yml logs --tail=50 postgres
              exit 1
            fi
            sleep 1
          done
          bash ./automation/scripts/migrate.sh
          docker compose --env-file .env -f docker/compose.dev.yml up -d --build \
            frontend edge api-server
          echo "stack up; waiting for frontend"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "frontend failed to become ready after 60s"
              docker compose --env-file .env -f docker/compose.dev.yml logs --tail=50 frontend
              exit 1
            fi
            sleep 1
          done
          echo "waiting for edge health"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health >/dev/null 2>&1; then
              echo "edge ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "edge failed to become ready after 60s"
              docker compose --env-file .env -f docker/compose.dev.yml logs --tail=50 edge
              exit 1
            fi
            sleep 1
          done
          echo "waiting for api-server health"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "api-server ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "api-server failed to become ready after 60s"
              docker compose --env-file .env -f docker/compose.dev.yml logs --tail=50 api-server
              exit 1
            fi
            sleep 1
          done

      - name: Run smoke tests
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"  # CI runs without Alchemy; the rpc-down spec validates honest-idle
        run: npm run test:smoke

      - name: Run hot path pipeline tests
        working-directory: tests/e2e
        env:
          ARBX_EDGE_URL: http://localhost:8787
          ARBX_WS_URL: http://localhost:3000
          ARBX_ASSUME_NO_RPC: "1"
        run: npm run test:hotpath || echo "Hot path tests skipped — VALIDATION_PENDING_INFRASTRUCTURE"

      - name: Run full suite (may skip killswitch if no admin token)
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_EDGE_URL: http://localhost:8787
          ARBX_ASSUME_NO_RPC: "1"
        run: npm test

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== postgres ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 postgres || true
          echo "=== api-server ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 api-server || true
          echo "=== edge ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 edge || true
          echo "=== frontend ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 frontend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yml down -v

  lighthouse-budget:
    name: Lighthouse Performance Budget (F-14)
    needs: [playwright]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install LHCI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for frontend
        run: |
          LHCI_BASE_URL="${{ secrets.LHCI_BASE_URL }}"
          if [ -z "$LHCI_BASE_URL" ]; then
            echo "⚠️ LHCI_BASE_URL not set — skipping Lighthouse"
            exit 0
          fi
          curl --retry 10 --retry-delay 5 -sf "$LHCI_BASE_URL/" > /dev/null
          echo "✅ Frontend accessible"

      - name: Run Lighthouse CI
        run: |
          LHCI_BASE_URL="${{ secrets.LHCI_BASE_URL }}"
          [ -z "$LHCI_BASE_URL" ] && { echo "⚠️ LHCI_BASE_URL not set — skip"; exit 0; }
          lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BASE_URL: ${{ secrets.LHCI_BASE_URL }}
