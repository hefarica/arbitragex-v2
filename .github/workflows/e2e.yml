name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token. upload-artifact uses GITHUB_TOKEN
# implicitly but only requires contents:read in the v4+ artifact API.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking for the first week (per spec §7 risk register). Flip to
    # required on branch-protection once we have 5 consecutive greens.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Materialize .env from .env.example (Ghost-safe — placeholders T2 only)
        run: |
          # Doctrina: .env.example contiene SOLO placeholders públicos T2 (puertos,
          # log levels, feature flags). NO contiene secretos reales. Compose.dev.yml
          # requiere env_file: ../.env por design — esto es materialización CI legítima.
          cp .env.example .env
          # ARBX-HARDENING (next.config.js): NEXT_PUBLIC_EDGE_URL/WS_URL must NOT
          # point to localhost when NODE_ENV=production (forced by frontend/Dockerfile).
          # Use Docker DNS service names — these are valid in both build and runtime.
          {
            echo "NEXT_PUBLIC_EDGE_URL=http://edge:8787"
            echo "NEXT_PUBLIC_WS_URL=http://api-server:3000"
          } >> .env
          # OMEGA-102 hot-fix (SECURE_BOOT): api-server / edge / shared-ts run
          # assertSecureBootTokens() at boot which REJECTS any token shorter than
          # 32 bytes (shared-ts/src/middleware/index.ts:51). The .env.example file
          # uses literal "<run: openssl rand -base64 48>" placeholders (30 chars)
          # which fail this check and cause api-server to crash-loop, producing
          # 502s on edge proxy → playwright timeouts. We generate ephemeral CI
          # tokens here (48-byte base64 ≈ 64 chars) — these never leave the
          # ephemeral CI runner and are NOT secrets.
          {
            echo "ARBX_ADMIN_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ARBX_EDGE_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ARBX_SERVICE_TOKEN=$(openssl rand -base64 48 | tr -d '\n')"
          } >> .env
          echo "::notice::.env materialized + Docker DNS endpoints + SECURE_BOOT tokens injected"

      - name: Bring up compose stack (dev — defaults OK for CI)
        run: |
          # OMEGA-102 hot-fix: --env-file .env is REQUIRED so compose reads the
          # root .env (NEXT_PUBLIC_EDGE_URL=http://edge:8787 injected at line 43
          # above), instead of falling back to compose.dev.yml's literal default
          # http://localhost:8787 which triggers the next.config.js R2 guard
          # under NODE_ENV=production during the frontend builder stage.
          docker compose --env-file .env -f docker/compose.dev.yml up -d --build \
            postgres redis frontend edge api-server
          echo "stack up; waiting for frontend"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"  # CI runs without Alchemy; the rpc-down spec validates honest-idle
        run: npm run test:smoke

      - name: Run full suite (may skip killswitch if no admin token)
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"
        run: npm test

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== api-server ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 api-server || true
          echo "=== edge ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 edge || true
          echo "=== frontend ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 frontend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yml down -v
