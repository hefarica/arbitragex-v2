name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# M2 Capa1 Fase 4 — read-only token. upload-artifact uses GITHUB_TOKEN
# implicitly but only requires contents:read in the v4+ artifact API.
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking for the first week (per spec §7 risk register). Flip to
    # required on branch-protection once we have 5 consecutive greens.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install Playwright deps
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Bring up compose stack (dev — defaults OK for CI)
        run: |
          cp .env.example .env
          docker compose -f docker/compose.dev.yml up -d postgres redis
          echo "waiting for postgres"
          for i in $(seq 1 30); do
            if docker exec arbitragex-v2-postgres-1 pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ./automation/scripts/migrate.sh
          docker compose -f docker/compose.dev.yml up -d --build \
            frontend edge api-server
          echo "stack up; waiting for frontend"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 >/dev/null; then
              echo "frontend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"  # CI runs without Alchemy; the rpc-down spec validates honest-idle
        run: npm run test:smoke

      - name: Run full suite (may skip killswitch if no admin token)
        working-directory: tests/e2e
        env:
          ARBX_FRONTEND_URL: http://localhost:5173
          ARBX_ASSUME_NO_RPC: "1"
        run: npm test

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== api-server ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 api-server || true
          echo "=== edge ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 edge || true
          echo "=== frontend ==="
          docker compose -f docker/compose.dev.yml logs --tail=200 frontend || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.dev.yml down -v

  lighthouse-budget:
    name: Lighthouse Performance Budget (F-14)
    needs: [playwright]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install LHCI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for frontend
        run: |
          LHCI_BASE_URL="${{ secrets.LHCI_BASE_URL }}"
          if [ -z "$LHCI_BASE_URL" ]; then
            echo "⚠️ LHCI_BASE_URL not set — skipping Lighthouse"
            exit 0
          fi
          curl --retry 10 --retry-delay 5 -sf "$LHCI_BASE_URL/" > /dev/null
          echo "✅ Frontend accessible"

      - name: Run Lighthouse CI
        run: |
          LHCI_BASE_URL="${{ secrets.LHCI_BASE_URL }}"
          [ -z "$LHCI_BASE_URL" ] && { echo "⚠️ LHCI_BASE_URL not set — skip"; exit 0; }
          lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BASE_URL: ${{ secrets.LHCI_BASE_URL }}
