# Pipeline Integrity Gate — automated E2E verification that real data
# flows from searcher → Redis → PG → API → WS without loss.
#
# PIPELINE-INTEGRITY-03 (2026-09-25): runs every 15 minutes against the VPS
# and on-demand. Fails when ANY layer is empty, stale, or returns wrong types.
# This is the automated guarantee that the cards show REAL opportunities
# from REAL data in REAL time (RULE 00, R7, R8, R10).
#
# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE-INTEGRITY-REPAIR-01 (t64): EL VIGIA ERA MUDO.
#
# Medido por t58 en el log: TODOS sus runs morian en el PRIMER step con
# `ssh: Could not resolve hostname arbx` / exit 255. Los 6 `failure`
# consecutivos eran del CHEQUEO, no del pipeline: el workflow usaba el alias
# `ssh arbx` SIN NUNCA DEFINIRLO. Ese alias (definido por un bloque `Host` en `~/.ssh/config`) funciona en deploy.yml:57,
# deploy-edge-only.yml:38, deploy-edge-only-v2.yml:39 y
# audit-vps-wiring.yml:212, que SI escriben un bloque `Host arbx` en
# ~/.ssh/config — aca no habia ni clave, ni host, ni config.
#
# DOS MODOS DE ROJO, que hasta ahora se leian como uno solo:
#   * SIN CONEXION   -> `VIGIA=SIN_CONEXION`. NO dice nada del pipeline.
#                       (Esto es lo que decian, sin decirlo, los 6 failure.)
#   * PIPELINE ROJO  -> `VIGIA=EVALUADO` + `PIPELINE=ROJO`. Dice que una capa
#                       real esta vacia/rota. Solo puede afirmarse DESPUES de
#                       conectar.
# Leer el primero como el segundo es leer una etiqueta como si fuera otra.
#
# Lo unico que cambia aca es el TRANSPORTE (materializar ssh + usar la forma
# explicita + clasificar la causa). Las capas, los umbrales y los veredictos
# sobre el pipeline NO se tocan: esta orden restaura el instrumento.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# INCREMENTO SRE (t64-sre-increment-01, 2026-10-06) — sobre el transporte ya
# reparado por PIPELINE-INTEGRITY-REPAIR-01 (b5e3037/1ceb037/b295e16, PR #831).
# NO se re-repara lo que ya funciona: materializacion ssh, vocabulario
# VIGIA=SIN_CONEXION / PIPELINE ROJO, umbrales y las 5 capas quedan como estan.
# Se agregan DOS cosas, ambas medidas:
#   1) `always()` en las capas (antes: `if: steps.conn.outputs.reachable == 'true'`).
#      Evidencia: run 37411885810, Layer 3 rojo => Layer 4 y 5 `skipped`.
#      Un vigia que deja de medir tras el primer rojo entrega 1 dato, no 5.
#   2) Capa 3 auditable: se captura el codigo HTTP y se declara el parser.
#      Evidencia: run 37463450394 (instrumento anterior) reportaba "ZERO
#      opportunities" sobre un cuerpo de 8644 bytes con {"count":1,...}; el VPS no
#      tiene jq y el parseo del runner convertia ese fallo en un cero. Un cero sin
#      causa atribuible NO es un hecho del pipeline.
# ─────────────────────────────────────────────────────────────────────────────
name: Pipeline Integrity Gate

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # SIN input libre: el host sale de `secrets.VPS_SSH_HOST`. El input
    # `vps_host` (string libre, default 'localhost') se elimino por dos
    # motivos medidos: (a) en el cron `inputs.vps_host` es vacio, asi que los
    # checks de API/WS apuntaban a `localhost` —el runner— y su rojo no hablaba
    # del pipeline; (b) era superficie de inyeccion en una URL. t54 y t58 ya
    # descartaron parametros libres; aca directamente no hay ninguno.

permissions:
  contents: read

concurrency:
  group: pipeline-integrity
  cancel-in-progress: true

jobs:
  verify-e2e:
    name: Verify E2E no-loss pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Setup SSH (same mechanism as auto-deploy-vps.yml:58-71)
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          test -n "$VPS_KEY" && test -n "$VPS_HOST"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && (( VPS_PORT > 0 && VPS_PORT < 65536 ))
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$VPS_KEY" > ~/.ssh/deploy_key
          # `umask 077` ya deja la clave en 600; el chmod es cinturon y tirantes:
          # en G2-CHANNEL-01 (t60) una clave en 0644 hizo fallar el primer run
          # con "Load key: bad permissions". No se repite.
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          echo "ssh material ready (key never echoed)"

      - name: Connectivity preflight — clasifica la causa, no la esconde
        id: conn
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -uo pipefail
          set +e
          out="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
            -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'echo READY' 2>&1)"
          rc=$?
          set -e
          echo "$out" | sed 's/^/  ssh: /'
          if [ "$rc" -eq 0 ] && [ "$(echo "$out" | tr -d '\r')" = "READY" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "VIGIA=SIN_CONEXION_NO" >> "$GITHUB_ENV"
            echo "preflight OK: the vigia reached the host"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "VIGIA=SIN_CONEXION" >> "$GITHUB_ENV"
            echo "::error::VIGIA SIN CONEXION (ssh rc=$rc). El vigia NO pudo llegar al VPS, asi que NO PUEDE afirmar nada sobre el pipeline. Esto NO es 'el pipeline esta roto'."
            exit 1
          fi

      - name: "Layer 1 — Redis stream has recent detections"
        # INCREMENTO SRE (t64-sre-increment-01): `always()` para que un rojo NO oculte
        # las capas siguientes. Medido en el run 37411885810 (instrumento ya mergeado):
        # Layer 3 en rojo => Layer 4 y Layer 5 `skipped`, es decir 2 de 5 capas sin medir.
        if: always() && steps.conn.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -uo pipefail
          set +e
          XLEN="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker exec arbitragex-v2-redis-1 redis-cli XLEN arbx:opps:detected 2>/dev/null || echo 0" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::VIGIA SIN CONEXION en capa 1 (ssh rc=$rc): $XLEN"; exit 1
          fi
          XLEN="$(echo "$XLEN" | tr -d '\r' | tail -1)"
          echo "Redis XLEN arbx:opps:detected = $XLEN"
          if [ "$XLEN" -eq 0 ] 2>/dev/null; then
            echo '::error::PIPELINE ROJO capa 1: Redis stream arbx:opps:detected is EMPTY — searcher not producing'
            exit 1
          fi

      - name: "Layer 2 — PG has opportunities in last 5 minutes"
        if: always() && steps.conn.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -uo pipefail
          set +e
          COUNT="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker exec arbitragex-v2-postgres-1 psql -U postgres -d arbitragex -t -A -c \"SELECT COUNT(*) FROM opportunities WHERE detected_at > NOW() - INTERVAL '5 minutes'\" 2>/dev/null || echo 0" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::VIGIA SIN CONEXION en capa 2 (ssh rc=$rc): $COUNT"; exit 1
          fi
          COUNT="$(echo "$COUNT" | tr -d '\r' | tail -1)"
          echo "PG opportunities in last 5 min = $COUNT"
          if [ "$COUNT" -eq 0 ] 2>/dev/null; then
            echo '::error::PIPELINE ROJO capa 2: PG has ZERO opportunities in the last 5 minutes — pipeline broken between Redis and PG'
            exit 1
          fi

      - name: "Layer 3 — API serves opportunities with correct types"
        if: always() && steps.conn.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # R82 — LA RUTA EXISTE POR SUPERFICIE, NO POR ESTAR EN EL CODIGO.
          # edge/worker/src/index.ts:699:
          #   app.get("/api/opportunities/live", (c) => proxy(c, "/api/v1/opportunities/live", ...))
          # El edge declara la ruta SIN `v1` y le agrega `v1` al reenviar; el api-server
          # directo la exige CON `v1`. Tabla 2x2 MEDIDA:
          #   EDGE 8788 /api/opportunities/live    -> 200 · 6913 B
          #   EDGE 8788 /api/v1/opportunities/live -> 404 ·   21 B
          #   8080      /api/opportunities/live    -> 404 ·  161 B
          #   8080      /api/v1/opportunities/live -> 200 · 6218 B
          # Sonar la forma `v1` contra el edge da 404: es la superficie equivocada,
          # no una capa rota.
          # Y el parseo va EN EL RUNNER: el VPS **no tiene jq** (`command -v jq` -> NO_JQ).
          #
          # El curl corre EN el VPS, no en el runner. Motivo medido: el edge esta
          # publicado SOLO en loopback (`compose.prod.yml`: `- 127.0.0.1:8788:8787`),
          # asi que un curl desde el runner a `<host>:8787` no llega nunca — y su
          # rojo hablaria del transporte, no del pipeline. Desde el VPS, el rojo
          # si significa "la API no sirve oportunidades".
          set -uo pipefail
          set +e
          # ── N12 (t116): LENTA vs CAIDA, DOS superficies, DOS presupuestos, DOS formas ──
          # La sonda unica anterior (`limit=1` contra el edge, `-m 10`) NO distinguia
          # LENTA de CAIDA: medido en t103, `limit=1` es BIMODAL (7 abortos de 12 a
          # ~300,4-300,7 s y 5 completos en 74-117 ms) y el tope del aborto esta en la
          # capa HTTP (`api-server/src/index.ts:2051` sin requestTimeout/headersTimeout/
          # keepAliveTimeout => defaults de Node, 300 s). Con 10 s de presupuesto una
          # degradacion lenta se reportaba `HTTP 000`, indistinguible de una caida.
          #
          # Y el edge SIRVE DE CACHE (medido: 0,121938 -> 0,002147 -> 0,002453, y
          # 0,097747 tras 4 s de pausa), asi que un 200 del edge NO prueba que el
          # api-server haya contestado en ese instante.
          #
          # CRITERIO DECLARADO (se imprime en el log, no se asume):
          #   DIRECTO = api-server 8080 /api/v1/opportunities/live  -> SIN cache:
          #     es la superficie que prueba que el API contesta de verdad.
          #   EDGE    = edge 8788 /api/opportunities/live            -> la que consume el DApp.
          #   Presupuesto corto 10 s; si algo no contesta, se REINTENTA con 45 s y otra forma.
          #   PASS exige LAS DOS superficies en 200 (no es mas facil que antes).
          #   Si solo contesta con el presupuesto largo -> LENTA (reason=api_slow), no caida.
          #   Si ninguna contesta ni con 45 s           -> CAIDA (reason=api_down).
          #   Si el edge contesta y el DIRECTO no       -> cache no descartable (edge_masks_dead_api).
          #   Si el DIRECTO contesta y el edge no       -> el consumidor queda sin dato (edge_not_serving).
          BUDGET_SHORT=10
          BUDGET_LONG=45
          probe() { # probe <budget_s> <url>
            ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "curl -s -m $1 -w '\n%{http_code} %{time_total}' '$2' 2>/dev/null || echo '000 0'" 2>&1 | tr -d '\r'
          }
          parse() { CODE="$(printf '%s' "$1" | tail -n1 | awk '{print $1}')"; TIME="$(printf '%s' "$1" | tail -n1 | awk '{print $2}')"; BODY="$(printf '%s' "$1" | sed '$d')"; }
          R="$(probe "$BUDGET_SHORT" 'http://127.0.0.1:8080/api/v1/opportunities/live?limit=20')"; parse "$R"
          C_DIRECT="$CODE"; T_DIRECT="$TIME"; B_DIRECT="$BODY"
          echo "probe surface=direct8080 shape=limit20 budget=${BUDGET_SHORT}s http=${C_DIRECT} time=${T_DIRECT}s bytes=$(printf '%s' "$B_DIRECT" | wc -c | tr -d ' ')"
          R="$(probe "$BUDGET_SHORT" 'http://127.0.0.1:8788/api/opportunities/live?limit=1')"; parse "$R"
          C_EDGE="$CODE"; T_EDGE="$TIME"; B_EDGE="$BODY"
          echo "probe surface=edge8788 shape=limit1 budget=${BUDGET_SHORT}s http=${C_EDGE} time=${T_EDGE}s bytes=$(printf '%s' "$B_EDGE" | wc -c | tr -d ' ')"
          SLOW=""
          if [ "$C_DIRECT" != "200" ]; then
            R="$(probe "$BUDGET_LONG" 'http://127.0.0.1:8080/api/v1/opportunities/live?limit=1')"; parse "$R"
            echo "probe surface=direct8080 shape=limit1 budget=${BUDGET_LONG}s http=${CODE} time=${TIME}s bytes=$(printf '%s' "$BODY" | wc -c | tr -d ' ')"
            if [ "$CODE" = "200" ]; then SLOW="${SLOW}direct8080 "; C_DIRECT="200"; T_DIRECT="$TIME"; B_DIRECT="$BODY"; fi
          fi
          if [ "$C_EDGE" != "200" ]; then
            R="$(probe "$BUDGET_LONG" 'http://127.0.0.1:8788/api/opportunities/live?limit=20')"; parse "$R"
            echo "probe surface=edge8788 shape=limit20 budget=${BUDGET_LONG}s http=${CODE} time=${TIME}s bytes=$(printf '%s' "$BODY" | wc -c | tr -d ' ')"
            if [ "$CODE" = "200" ]; then SLOW="${SLOW}edge8788 "; C_EDGE="200"; T_EDGE="$TIME"; B_EDGE="$BODY"; fi
          fi
          if [ "$C_DIRECT" != "200" ] && [ "$C_EDGE" != "200" ]; then
            echo "::error::PIPELINE ROJO capa 3: NINGUNA superficie contesto — directo 8080 http=${C_DIRECT}, edge 8788 http=${C_EDGE} — ni con ${BUDGET_LONG}s de presupuesto. reason=api_down. NO es 'cero oportunidades': la API no responde."
            exit 1
          fi
          if [ "$C_DIRECT" != "200" ]; then
            echo "::error::PIPELINE ROJO capa 3: el EDGE contesto (http=${C_EDGE} en ${T_EDGE}s) pero el api-server DIRECTO no (http=${C_DIRECT}) ni con ${BUDGET_LONG}s. reason=edge_masks_dead_api — la respuesta del edge puede ser CACHE y NO se puede descartar que el API este caido."
            exit 1
          fi
          echo "cache_discarded_by=direct_8080 — el api-server contesto DIRECTO, asi que la respuesta no es cache del edge"
          if [ -n "$SLOW" ]; then
            echo "::warning::capa 3 DEGRADADA (LENTA, no caida) en: ${SLOW}| latencias finales: directo=${T_DIRECT}s edge=${T_EDGE}s. Contesto solo con el presupuesto de ${BUDGET_LONG}s."
          fi
          if [ "$C_EDGE" != "200" ]; then
            echo "::error::PIPELINE ROJO capa 3: el api-server responde (directo http=${C_DIRECT}) pero el EDGE no (http=${C_EDGE}) ni con ${BUDGET_LONG}s. reason=edge_not_serving — el consumidor del DApp queda sin dato."
            exit 1
          fi
          RESP="$B_DIRECT"
          SRC="direct8080"
          if [ -z "$RESP" ]; then RESP="$B_EDGE"; SRC="edge8788"; fi
          KEYS="$(printf '%s' "$RESP" | grep -o '"[A-Za-z_][A-Za-z_0-9]*":' | sort -u | tr -d '":' | paste -sd, -)"
          echo "evidence: http_direct=${C_DIRECT} http_edge=${C_EDGE} bytes=$(printf '%s' "$RESP" | wc -c | tr -d ' ') keys=$KEYS source=$SRC"
          JQ_RC=0
          COUNT="$(echo "$RESP" | jq 'if (.data|type)=="array" then (.data|length) elif (.items|type)=="array" then (.items|length) else (.count // 0) end' 2>/dev/null)" || JQ_RC=$?
          if [ "$JQ_RC" -ne 0 ] || [ -z "$COUNT" ]; then
            echo "::error::NO COMPUTADO capa 3: el parser del runner fallo (jq rc=$JQ_RC) sobre $(printf '%s' "$RESP" | wc -c | tr -d ' ') bytes (keys=$KEYS source=$SRC). Un 0 aca NO es un hecho del pipeline."
            exit 1
          fi
          echo "API /opportunities/live returns $COUNT items (source=$SRC)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::PIPELINE ROJO capa 3: API returns ZERO opportunities (source=$SRC) — pipeline broken between PG and API"
            exit 1
          fi
          AMOUNT_TYPE="$(echo "$RESP" | jq -r '((.data // .items // [])[0] | .amount_in_wei) | type' 2>/dev/null || echo 'null')"
          echo "evidence: amount_in_wei_as_string=$(printf '%s' "$RESP" | grep -c '"amount_in_wei":"')"
          echo "amount_in_wei type = $AMOUNT_TYPE"
          if [ "$AMOUNT_TYPE" != "string" ] && [ "$AMOUNT_TYPE" != "null" ]; then
            echo "::error::PIPELINE ROJO capa 3: amount_in_wei is $AMOUNT_TYPE — should be string or null (precision loss!)"
            exit 1
          fi

      - name: "Layer 4 — WS endpoint is alive"
        if: always() && steps.conn.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          # Igual que la capa 3: se mide DESDE el VPS (el API server no esta
          # publicado en la IP publica).
          set -uo pipefail
          set +e
          HTTP_CODE="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "curl -sf -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/socket.io/?EIO=4&transport=polling' 2>/dev/null || echo 000" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::VIGIA SIN CONEXION en capa 4 (ssh rc=$rc): $HTTP_CODE"; exit 1
          fi
          HTTP_CODE="$(echo "$HTTP_CODE" | tr -d '\r' | tail -1)"
          echo "WS polling endpoint HTTP status = $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PIPELINE ROJO capa 4: WebSocket polling endpoint returned $HTTP_CODE — WS not reachable"
            exit 1
          fi

      - name: "Layer 5 — Docker containers are healthy"
        if: always() && steps.conn.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -uo pipefail
          set +e
          OUT="$(ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "UNHEALTHY=\$(docker ps --filter 'name=arbitragex-v2' --filter 'health=unhealthy' --format '{{.Names}}' 2>/dev/null); if [ -n \"\$UNHEALTHY\" ]; then echo UNHEALTHY:\$UNHEALTHY; else docker ps --filter 'name=arbitragex-v2' --format '{{.Names}}' | wc -l; fi" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::VIGIA SIN CONEXION en capa 5 (ssh rc=$rc): $OUT"; exit 1
          fi
          OUT="$(echo "$OUT" | tr -d '\r' | tail -1)"
          case "$OUT" in
            UNHEALTHY:*)
              echo "::error::PIPELINE ROJO capa 5: Unhealthy containers: ${OUT#UNHEALTHY:}"
              exit 1 ;;
            *)
              echo "$OUT arbitragex containers running, all healthy"
              if [ "$OUT" -lt 10 ] 2>/dev/null; then
                echo "::warning::Only $OUT containers running — expected 20+"
              fi ;;
          esac

      - name: Verdict — distingue los DOS modos de rojo
        if: always()
        env:
          REACHABLE: ${{ steps.conn.outputs.reachable }}
        run: |
          {
            echo "### Pipeline Integrity Gate"
            echo ""
            if [ "${REACHABLE:-false}" != "true" ]; then
              echo "**VIGIA=SIN_CONEXION** — el vigia no pudo llegar al VPS."
              echo ""
              echo "Esto **NO** dice que el pipeline este roto: dice que **no se midio**. Las capas quedan"
              echo "\`NO EVALUADO\`, no \`ROJO\`. Son dos cosas distintas y hasta hoy se leian como una."
            else
              echo "**VIGIA=EVALUADO** — el vigia llego al VPS y midio las 5 capas."
              echo ""
              echo "Si el job esta en rojo, el rojo es sobre el **PIPELINE** (una capa vacia/rota), no sobre la conexion."
            fi
            echo ""
            echo "Layers: Redis(XLEN) → PG(COUNT) → API(types) → WS(alive) → Docker(healthy)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Pipeline integrity check completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "::notice::Layers verified: Redis(XLEN) → PG(COUNT) → API(types) → WS(alive) → Docker(healthy)"
