name: Foundry CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/foundry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/foundry.yml'

# M2 Capa1 Fase 4 — read-only token. fork-test job pulls MAINNET_RPC_URL
# from secrets but never writes back to the repo.
permissions:
  contents: read

jobs:
  test:
    name: forge build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # CONTRACT-CI-HOLE-01 (2026-10-08, medido): sin `submodules:` git materializa
          # contracts/lib/<lib> como directorio VACIO (los tres son gitlinks en modo
          # 160000) y `forge install` moria con
          #   Error: failed to create dir ".../lib/openzeppelin-contracts": File exists (os error 17)
          # dejando `forge build` y `forge test` en SKIPPED. Los gitlinks ya fijan
          # exactamente los commits que el install re-bajaba (cd058830 / fa525310 /
          # b0909683): la via correcta es git, no la red. Mismo patron que ci.yml.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: nightly

      - name: Verify contracts/lib is materialised (no forge install, no tolerance)
        # Se ELIMINA el paso `forge install dependencies || true`: su nombre prometia
        # tolerancia mientras su `run:` la rompia, y era el punto donde el job moria.
        # Sustituto explicito: comprobar que las tres libs estan presentes. NO hay
        # `|| true` ni continue-on-error: si falta una lib, este job FALLA.
        run: |
          missing=0
          for d in openzeppelin-contracts openzeppelin-contracts-upgradeable forge-std; do
            if [ -d "lib/$d" ] && [ -n "$(ls -A "lib/$d" 2>/dev/null)" ]; then
              echo "lib/$d present ($(ls -A "lib/$d" | wc -l) entries, $(git -C "lib/$d" rev-parse HEAD 2>/dev/null || echo 'no-git'))"
            else
              echo "::error::contracts/lib/$d MISSING or empty — the checkout must materialise the pinned submodules (submodules: recursive)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: CONTROL t171 TEMPORAL no se publica — inyectar un contrato roto a proposito
        # Control de vacuidad del arreglo: con el job ya ejecutando build/test, un
        # contrato roto TIENE que hacer fallar el job. Este step solo vive en la rama
        # scratch sre/t171-control-broken y se borra al terminar el control.
        run: |
          printf 'contract __T171ControlBroken { function f() public { uint256 x = ; } }\n' > src/__t171_control_broken.sol
          echo "injected control file:"
          ls -l src/__t171_control_broken.sol

      - name: forge build (with sizes)
        # BLOCKING: a build failure must fail CI. Compiles the FULL project including
        # script/ — the deploy scripts now compile cleanly (their view-mutability,
        # shadowed-param, console2 overload and stack-too-deep issues were fixed), so
        # they are no longer quarantined behind --skip.
        run: forge build --sizes

      - name: forge test (verbose)
        # BLOCKING: test failures now fail CI. Previously masked by `|| true`, which
        # let a stub DeterministicFactory test plus 33 red tests sit on main under a
        # green check. Compiles + runs the full project (scripts included).
        run: forge test -vv
        env:
          # forge test skips fork tests without RPC; mainnet/sepolia fork tests
          # are skipped automatically when these are absent.
          MAINNET_RPC_URL: ""
          SEPOLIA_RPC_URL: ""

  test-fork:
    name: forge fork test (mainnet)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main — not on every push.
    # Fork tests cost RPC credits and can be flaky under rate limits.
    #
    # M2 Capa1 Fase 5 (P1-2): fork guard. NEVER expose MAINNET_RPC_URL to a
    # PR originating from a fork — `pull_request.head.repo.fork` is `true` in
    # that case. Same-repo branch PRs and push events to main can use the
    # secret. The reference compare against `github.repository` is a belt-and-
    # braces second guard against `pull_request_target` misuse.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Require non-fork tests to pass first — no point forking if unit tests fail.
    needs: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Mismo defecto que en `test` (CONTRACT-CI-HOLE-01): sin submodules, `forge
          # install` moria con "File exists (os error 17)" y dejaba todo en skipped.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: nightly

      - name: Verify contracts/lib is materialised (no forge install, no tolerance)
        run: |
          missing=0
          for d in openzeppelin-contracts openzeppelin-contracts-upgradeable forge-std; do
            if [ -d "lib/$d" ] && [ -n "$(ls -A "lib/$d" 2>/dev/null)" ]; then
              echo "lib/$d present ($(ls -A "lib/$d" | wc -l) entries)"
            else
              echo "::error::contracts/lib/$d MISSING or empty — the checkout must materialise the pinned submodules (submodules: recursive)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: forge build
        run: forge build --sizes

      - name: forge fork test (testFork_*)
        # BLOCKING: fork tests must pass for merge. If RPC flakiness becomes
        # disruptive, the operator should either (a) provision a more stable
        # RPC endpoint, or (b) move fork tests to a scheduled job — never
        # re-introduce continue-on-error here, as that would re-create the
        # false-green path that Gate 2 closes.
        run: forge test --fork-url $MAINNET_RPC_URL --match-test "testFork_" -vvv
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || secrets.RPC_HTTP_1_ARCHIVE }}
