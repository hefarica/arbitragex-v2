name: Foundry CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/foundry.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/foundry.yml'

# M2 Capa1 Fase 4 — read-only token. fork-test job pulls MAINNET_RPC_URL
# from secrets but never writes back to the repo.
permissions:
  contents: read

jobs:
  test:
    name: forge build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v5
        # No submodules: contracts/lib/ is gitignored and managed via forge install.

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge install dependencies || true
        # contracts/lib/ is gitignored (contracts/.gitignore: lib/).
        # Three libs required by remappings.txt:
        #   @openzeppelin/contracts/  => lib/openzeppelin-contracts/contracts/
        #   @openzeppelin/contracts-upgradeable/ => lib/openzeppelin-contracts-upgradeable/contracts/
        #   forge-std/                => lib/forge-std/src/
        # --no-git avoids nested .git repos; --no-commit avoids dirty worktree.
        run: |
          # Pinned to the same commits as .gitmodules — the versions the contracts
          # actually compile against (OZ 5.6.1 / OZ-upgradeable 5.1.0 / forge-std 1.16.1).
          # Unpinned `forge install` pulled a newer openzeppelin-contracts-upgradeable
          # in which ReentrancyGuardUpgradeable is no longer under contracts/utils/,
          # so `forge build` failed — masked until now by `|| true`.
          forge install OpenZeppelin/openzeppelin-contracts@cd05883078060e0cd8a7bd36636944570dbe1722 --no-git --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@fa525310e45f91eb20a6d3baa2644be8e0adba31 --no-git --no-commit
          forge install foundry-rs/forge-std@b090968353a209833d4a6f1383230477e96d8438 --no-git --no-commit

      - name: forge build (with sizes)
        # BLOCKING: a build failure must fail CI. Compiles the FULL project including
        # script/ — the deploy scripts now compile cleanly (their view-mutability,
        # shadowed-param, console2 overload and stack-too-deep issues were fixed), so
        # they are no longer quarantined behind --skip.
        run: forge build --sizes

      - name: forge test (verbose)
        # BLOCKING: test failures now fail CI. Previously masked by `|| true`, which
        # let a stub DeterministicFactory test plus 33 red tests sit on main under a
        # green check. Compiles + runs the full project (scripts included).
        run: forge test -vv
        env:
          # forge test skips fork tests without RPC; mainnet/sepolia fork tests
          # are skipped automatically when these are absent.
          MAINNET_RPC_URL: ""
          SEPOLIA_RPC_URL: ""

  test-fork:
    name: forge fork test (mainnet)
    runs-on: ubuntu-latest
    # Only run on PRs targeting main — not on every push.
    # Fork tests cost RPC credits and can be flaky under rate limits.
    #
    # M2 Capa1 Fase 5 (P1-2): fork guard. NEVER expose MAINNET_RPC_URL to a
    # PR originating from a fork — `pull_request.head.repo.fork` is `true` in
    # that case. Same-repo branch PRs and push events to main can use the
    # secret. The reference compare against `github.repository` is a belt-and-
    # braces second guard against `pull_request_target` misuse.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Require non-fork tests to pass first — no point forking if unit tests fail.
    needs: test
    timeout-minutes: 20

    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v5

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge install dependencies || true
        run: |
          # Pinned to the same commits as .gitmodules — the versions the contracts
          # actually compile against (OZ 5.6.1 / OZ-upgradeable 5.1.0 / forge-std 1.16.1).
          # Unpinned `forge install` pulled a newer openzeppelin-contracts-upgradeable
          # in which ReentrancyGuardUpgradeable is no longer under contracts/utils/,
          # so `forge build` failed — masked until now by `|| true`.
          forge install OpenZeppelin/openzeppelin-contracts@cd05883078060e0cd8a7bd36636944570dbe1722 --no-git --no-commit
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@fa525310e45f91eb20a6d3baa2644be8e0adba31 --no-git --no-commit
          forge install foundry-rs/forge-std@b090968353a209833d4a6f1383230477e96d8438 --no-git --no-commit

      - name: forge build
        run: forge build --sizes

      - name: forge fork test (testFork_*)
        # continue-on-error: RPC hiccups (rate-limit, latency spike) must not
        # block merge.  The job is informational; a hard block is reserved for
        # the unit-test job above.
        continue-on-error: true
        run: forge test --fork-url $MAINNET_RPC_URL --match-test "testFork_" -vvv
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
