name: Readiness timeout diagnosis (read only)
on:
  push:
    branches: [ops/readiness-diagnosis-20260913]
permissions:
  contents: read
concurrency:
  group: readiness-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium from the frontend workspace
        run: node frontend/node_modules/playwright/cli.js install --with-deps chromium
      - name: Reproduce public page and both endpoints (read only)
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: node scripts/ci/readiness_browser_20260913.cjs
      - name: Preserve evidence (collection success is not a health assertion)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-browser-${{ github.run_id }}
          path: readiness-evidence/
          if-no-files-found: error
          retention-days: 7
