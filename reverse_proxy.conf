# ArbitrageX v2 reverse proxy (audit M1, 2026-05-10)
#
# EDGE-HARD-1 / WS-POLL-1 (2026-08-20) — CANONICAL socket.io upstream:
# WebSocket terminates at the api-server gateway, NEVER at the edge worker
# (RULE 02; the Hono edge has no socket.io route — proxying there 404s every
# handshake and the feed degrades to "FEED POLLING"). Applied live on the
# VPS 2026-08-20 (sites-enabled backup in /etc/nginx/backups). Mirror on any
# nginx rebuild:
#   location /socket.io/ {
#       proxy_pass http://127.0.0.1:8080/socket.io/;
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host $host;
#       proxy_read_timeout 300s;
#   }
#
# Hardened config:
# - HTTP redirects to HTTPS (port 80 -> 443)
# - TLS 1.2/1.3 only with strong ciphers
# - Security headers (HSTS, X-Frame-Options, X-Content-Type-Options, CSP-Report)
# - Rate limit per IP for /api/v1/admin/*, /api/, and public routes
# - Hostname placeholder (operator sets real domain before broadcast)
# - Block scanner traps (wp-admin, .env, .git, phpmyadmin)
#
# Cert source: operator runs certbot or provides cert via CF Tunnel volume mount.
#   certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN
# Backend ports remain loopback-only (5173 frontend, 8787 edge).
#
# If CF Tunnel + Pages domain is the primary path, this config is the
# fallback for direct VPS access only. CF Tunnel terminates TLS at the
# edge; in that case disable the HTTPS server block and keep only the
# ACME + redirect block pointing to the local Tunnel port.

# -----------------------------------------------------------------------
# Rate limiter zones (per IP, shared memory)
# -----------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/s;
limit_req_zone $binary_remote_addr zone=public:10m rate=120r/s;

# -----------------------------------------------------------------------
# HSTS value map (enables per-content-type tuning if needed)
# -----------------------------------------------------------------------
map $sent_http_content_type $hsts_value {
    default "max-age=31536000; includeSubDomains";
}

# -----------------------------------------------------------------------
# HTTP -> HTTPS redirect (port 80)
# Preserves ACME challenge for certbot webroot renewal.
# -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge passthrough (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # All other traffic: permanent redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------
# HTTPS server block (port 443)
# -----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # TODO: replace with real domain before broadcast (e.g. arbx.example.com)
    # Operator sets via certbot or CF Tunnel hostname.
    server_name _;

    # --- TLS configuration ---
    # Operator must provide cert + key via certbot or volume mount.
    # Replace REPLACE_DOMAIN with the actual domain name.
    ssl_certificate     /etc/letsencrypt/live/REPLACE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_DOMAIN/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5:!RC4:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # --- Security headers (defense in depth) ---
    # Next.js next.config.js may set some of these too; nginx wins at transport layer.
    add_header Strict-Transport-Security    $hsts_value always;
    add_header X-Frame-Options              "DENY" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=()" always;

    # CSP report-only: promote to enforce after report stream is clean.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; report-uri /csp-report" always;

    # --- Body size cap ---
    client_max_body_size 1m;

    # --- Logs (operator rotates via logrotate) ---
    access_log /var/log/nginx/arbx-access.log;
    error_log  /var/log/nginx/arbx-error.log warn;

    # ---------------------------------------------------------------
    # Block scanner traps — return 444 (close without response)
    # ---------------------------------------------------------------
    location ~ ^/(wp-admin|wp-login|admin|phpmyadmin|\.env|\.git) {
        return 444;
    }

    # ---------------------------------------------------------------
    # Admin API routes — stricter rate limit
    # ---------------------------------------------------------------
    location /api/v1/admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---------------------------------------------------------------
    # Edge worker — public API routes
    # ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---------------------------------------------------------------
    # Health + status passthrough (no rate limit; Prometheus scrapes)
    # ---------------------------------------------------------------
    location /status {
        proxy_pass http://127.0.0.1:8787/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---------------------------------------------------------------
    # Frontend (Next.js) — root catch-all with WebSocket upgrade
    # ---------------------------------------------------------------
    location / {
        limit_req zone=public burst=200 nodelay;
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade (Next.js HMR + Socket.IO)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
