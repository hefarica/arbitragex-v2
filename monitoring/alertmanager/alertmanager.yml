#  - name: telegram-alerts
#    telegram_configs:
#      - bot_token: "YOUR_BOT_TOKEN"
#        chat_id: YOUR_CHAT_ID
#        parse_mode: HTML
#        message: |
#          <b>{{ .Status | toUpper }}</b>
#          {{ range .Alerts }}
#          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
#          {{ .Annotations.summary }}
#          {{ .Annotations.description }}
#          {{ end }}

# MON-8: Inhibition rules — suppress redundant/noisy child alerts when parent fires
inhibit_rules:
  # If ContainerRestartLoop fires, suppress the less-severe ExcessiveRestarts for same container
  - source_match:
      alertname: ContainerRestartLoop
    target_match:
      alertname: ContainerExcessiveRestarts
    equal: ['container']
  # If a critical alert fires for a service, suppress warnings for the same service
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['service']
