# Dev configuration — Slack/PagerDuty receivers use env-var placeholders.
# (Audit M12, 2026-05-10)
#
# In production:
#   - Set SLACK_WEBHOOK_URL via Vault:
#       vault kv put arbx/prod/t1/slack_webhook_url value=https://hooks.slack.com/...
#   - Set PAGERDUTY_INTEGRATION_KEY via Vault:
#       vault kv put arbx/prod/t1/pagerduty_integration_key value=<key>
#   - vault-agent renders these into /run/secrets/arbx.env before alertmanager starts.
#   - alertmanager startup script sources /run/secrets/arbx.env, then envsubst
#     renders this config template into the final alertmanager.yml before launch.
#
# The ${SLACK_WEBHOOK_URL} and ${PAGERDUTY_INTEGRATION_KEY} placeholders below
# are NOT expanded by alertmanager itself — they require the envsubst render step
# documented in docs/operations/PRODUCTION_DEPLOY.md.
#
# DO NOT deploy this file to production without the render step.
# Secrets classification: docs/operations/SECRETS_POLICY.md (T1 tier).

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  # Hardened (2026-08-03): all severities route to the internal api-server
  # webhook, which is always available and never crashes alertmanager. The
  # Slack/PagerDuty receivers below are commented out because their
  # ${SLACK_WEBHOOK_URL} / ${PAGERDUTY_INTEGRATION_KEY} placeholders are NOT
  # expanded by alertmanager (it does not run envsubst) — an unrendered
  # placeholder yields an empty URL scheme and crashes the config load on
  # every restart. To re-enable Slack/PagerDuty, provision the secrets via
  # Vault and add an envsubst render step to the container entrypoint, then
  # uncomment the routes + receivers below.
  routes:
    - match_re:
        severity: critical|warning|info
      receiver: default
      repeat_interval: 2h

receivers:
  - name: default
    webhook_configs:
      - url: "http://api-server:8080/admin/alertmanager/webhook"
        send_resolved: true

  # ── EXTERNAL RECEIVERS (disabled — see route comment above) ───────────────
  # To enable: render the placeholders via envsubst in the container entrypoint
  # (alertmanager itself does NOT expand ${VAR}), then uncomment routes above
  # pointing critical → pagerduty-critical (+ continue → slack-critical) and
  # warning|info → slack-critical.
  #
  # - name: slack-critical
  #   slack_configs:
  #     - api_url: '${SLACK_WEBHOOK_URL}'
  #       channel: '#arbx-alerts-critical'
  #       send_resolved: true
  #       title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'
  #
  # - name: pagerduty-critical
  #   pagerduty_configs:
  #     - service_key: '${PAGERDUTY_INTEGRATION_KEY}'
  #       send_resolved: true

# === TELEGRAM RECEIVER (activate when bot token is ready) ===
# To enable:
# 1. Create bot via @BotFather on Telegram
# 2. Get your chat_id via @userinfobot
# 3. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to .env
# 4. Uncomment below and change route receiver to "telegram-alerts"
