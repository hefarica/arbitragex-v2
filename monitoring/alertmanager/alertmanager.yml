route:
  group_by: ["alertname","service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: default
  routes:
    # Critical alerts go immediately
    - match:
        severity: critical
      receiver: default
      group_wait: 0s
      repeat_interval: 15m
    # Warnings follow normal flow
    - match:
        severity: warning
      receiver: default
    # Info-level also notified but less urgently
    - match:
        severity: info
      receiver: default
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://api-server:8080/admin/alertmanager/webhook"
        send_resolved: true

