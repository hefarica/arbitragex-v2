# Prometheus Alert Rules for ArbitrageX v2
# Gate: ALERTS
# Version: 1.0.0
# Last Updated: 2026-05-26

groups:
  # =============================================================================
  # SYSTEM HEALTH ALERTS
  # =============================================================================
  - name: arbx_system_health
    interval: 30s
    rules:
      # API Server Health
      - alert: APIServerDown
        expr: up{job="api-server"} == 0
        for: 1m
        labels:
          severity: critical
          gate: ALERTS
        annotations:
          summary: "API Server is down"
          description: "API server has been unreachable for more than 1 minute."

      # Edge Worker Health
      - alert: EdgeWorkerDown
        expr: up{job="edge"} == 0
        for: 1m
        labels:
          severity: critical
          gate: ALERTS
        annotations:
          summary: "Edge Worker is down"
          description: "Edge worker has been unreachable for more than 1 minute."

      # Searcher (Rust) Health
      - alert: SearcherDown
        expr: up{job="searcher-rs"} == 0
        for: 1m
        labels:
          severity: critical
          gate: ALERTS
        annotations:
          summary: "Searcher is down"
          description: "Searcher-rs has been unreachable for more than 1 minute."

      # Database Health
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          gate: ALERTS
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is unreachable."

      # Redis Health
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          gate: ALERTS
        annotations:
          summary: "Redis is down"
          description: "Redis cache is unreachable."

  # =============================================================================
  # RPC PROVIDER ALERTS
  # =============================================================================
  - name: arbx_rpc_health
    interval: 30s
    rules:
      # RPC Provider Degradation
      - alert: RPCProvidersDegraded
        expr: count(arbx_rpc_provider_state == 0) >= 3
        for: 5m
        labels:
          severity: warning
          gate: G-RPC-1
        annotations:
          summary: "Multiple RPC providers are degraded"
          description: "{{ $value }} RPC providers are in degraded state."

      # RPC Provider Critical (less than 3 healthy)
      - alert: RPCProvidersCritical
        expr: count(arbx_rpc_provider_state == 1) < 3
        for: 1m
        labels:
          severity: critical
          gate: G-RPC-1
        annotations:
          summary: "Insufficient healthy RPC providers"
          description: "Only {{ $value }} RPC providers are healthy. Minimum 3 required."

  # =============================================================================
  # OPPORTUNITY ALERTS
  # =============================================================================
  - name: arbx_opportunities
    interval: 30s
    rules:
      # No opportunities detected
      - alert: NoOpportunitiesDetected
        expr: rate(arbx_opportunities_total[1h]) == 0
        for: 1h
        labels:
          severity: info
          gate: G-SIM-1
        annotations:
          summary: "No opportunities detected in the last hour"
          description: "The scanner has not detected any arbitrage opportunities in the last 60 minutes."

      # High opportunity rejection rate
      - alert: HighOpportunityRejectionRate
        expr: rate(arbx_opportunities_rejected_total[5m]) / rate(arbx_opportunities_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          gate: G-NET-1
        annotations:
          summary: "High opportunity rejection rate"
          description: "More than 90% of opportunities are being rejected."

  # =============================================================================
  # RISK MANAGEMENT ALERTS
  # =============================================================================
  - name: arbx_risk
    interval: 30s
    rules:
      # Kill-switch armed
      - alert: KillSwitchArmed
        expr: arbx_killswitch_enabled == 1
        for: 0m
        labels:
          severity: info
          gate: G-RIS-1
        annotations:
          summary: "Kill-switch is armed"
          description: "Global kill-switch is currently enabled. No executions will proceed."

      # Paper mode duration
      - alert: PaperModeDurationInsufficient
        expr: arbx_paper_mode_duration_hours < 168
        for: 0m
        labels:
          severity: info
          gate: G-PAP-1
        annotations:
          summary: "Paper mode duration insufficient"
          description: "Paper mode has been running for {{ $value }} hours. Minimum 168 hours (7 days) required."

  # =============================================================================
  # PERFORMANCE ALERTS
  # =============================================================================
  - name: arbx_performance
    interval: 30s
    rules:
      # High latency
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="api-server"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          gate: ALERTS
        annotations:
          summary: "High API latency"
          description: "95th percentile API latency is above 1 second."

      # Memory usage high
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / process_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          gate: ALERTS
        annotations:
          summary: "High memory usage"
          description: "Process is using more than 90% of memory limit."

  # =============================================================================
  # SECURITY ALERTS
  # =============================================================================
  - name: arbx_security
    interval: 30s
    rules:
      # Authentication failures
      - alert: HighAuthFailureRate
        expr: rate(arbx_auth_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          gate: V-AT-1
        annotations:
          summary: "High authentication failure rate"
          description: "More than 1 authentication failure per second detected."

      # Rate limit exceeded
      - alert: RateLimitExceeded
        expr: rate(arbx_rate_limit_total[1m]) > 10
        for: 1m
        labels:
          severity: warning
          gate: PR-1
        annotations:
          summary: "Rate limit frequently exceeded"
          description: "Rate limit is being triggered more than 10 times per minute."
