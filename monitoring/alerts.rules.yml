groups:
  - name: arbitragex-core
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: arbx_service_up == 0
        for: 1m
        labels: { severity: critical, platform: arbitragex }
        annotations:
          summary: "{{ $labels.service }} is DOWN"
          description: "Service {{ $labels.service }} reports arbx_service_up=0 for >= 1m."

      - alert: KillSwitchActivated
        expr: arbx_killswitch_enabled == 1
        for: 0m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "Kill switch is ON"
          description: "The global kill switch is armed. All executions are refused."

      - alert: HighHTTP5xxRate
        expr: |
          (
            sum by (service) (rate(arbx_http_requests_total{status=~"5.."}[5m]))
          /
            sum by (service) (rate(arbx_http_requests_total[5m]))
          ) > 0.10
        for: 5m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "Elevated 5xx on {{ $labels.service }}"
          description: ">10% of requests are 5xx on {{ $labels.service }} for 5m."

      - alert: LatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(arbx_http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 10m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "p95 latency > 1s on {{ $labels.service }}"
          description: "Investigate {{ $labels.service }} slowdown."

      - alert: NoOpportunitiesDetectedLongWindow
        expr: increase(arbx_opportunity_total{status="detected"}[15m]) == 0
        for: 15m
        labels: { severity: info, platform: arbitragex }
        annotations:
          summary: "No opportunities detected in the last 15m"
          description: "Searcher-rs may be idle or kill-switched; verify both."

      - alert: RpcAllProvidersUnhealthy
        expr: count(arbx_rpc_provider_state == 0) == 0 and count(arbx_rpc_provider_state) > 0
        for: 2m
        labels: { severity: critical, platform: arbitragex }
        annotations:
          summary: "All RPC providers unhealthy"
          description: "Pool has providers configured but none are Healthy. Reads will fall back to Degraded if any; otherwise pool returns AllUnhealthy. See runbooks/rpc-down.md."

      - alert: RpcCircuitBreakerOpen
        expr: arbx_rpc_provider_state == 2
        for: 1m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "RPC provider {{ $labels.provider }} circuit breaker OPEN"
          description: "Provider {{ $labels.provider }} ({{ $labels.kind }}) tripped on sustained errors. Will half-open after 30s."

      - alert: RpcSingleVendorPool
        expr: count by (kind) (arbx_rpc_provider_state) < 2
        for: 30m
        labels: { severity: info, platform: arbitragex }
        annotations:
          summary: "RPC pool has < 2 providers ({{ $labels.kind }})"
          description: "arbx-rpc-failover-discipline requires ≥2 vendors per chain. Add a backup in env RPC_HTTP_<chain_id> / RPC_WS_<chain_id> before flipping paper_mode=false."

      - alert: RpcDriftDetected
        expr: increase(arbx_rpc_pool_drift_detected_total[10m]) > 0
        for: 0m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "RPC provider {{ $labels.provider }} drifted behind tip"
          description: "Provider was demoted to Degraded for falling >2 blocks behind the tip for >60s. Investigate vendor health."

  # MON-3: Disk space alerts for postgres and grafana volumes
  - name: storage
    rules:
      - alert: PostgresDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint=~"/var/lib/postgresql.*"}
            / node_filesystem_size_bytes{mountpoint=~"/var/lib/postgresql.*"}
          ) < 0.15
        for: 5m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "Postgres volume has < 15% disk free"
          description: "Mountpoint {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free. Prune old data or expand volume."

      - alert: GrafanaDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint=~".*grafana.*"}
            / node_filesystem_size_bytes{mountpoint=~".*grafana.*"}
          ) < 0.15
        for: 5m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "Grafana volume has < 15% disk free"
          description: "Mountpoint {{ $labels.mountpoint }} on {{ $labels.instance }} is below 15% free."

  # MON-4: Container restart / crash-loop alerts
  - name: containers
    rules:
      - alert: ContainerRestartLoop
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="arbitragex"}[15m]) > 3
        for: 3m
        labels: { severity: critical, platform: arbitragex }
        annotations:
          summary: "Container {{ $labels.container }} is in a restart loop"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted > 3 times in 15m. Check logs immediately."

      - alert: ContainerExcessiveRestarts
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="arbitragex"}[1h]) > 5
        for: 5m
        labels: { severity: warning, platform: arbitragex }
        annotations:
          summary: "Container {{ $labels.container }} restarted > 5 times in 1h"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} had > 5 restarts in the past hour. Investigate root cause."

      # Fallback for Docker Compose (no kube metrics) — uses cAdvisor container_last_seen
      - alert: DockerContainerRestartLoop
        expr: |
          increase(container_start_time_seconds{name=~"arbitragex.*|searcher.*|api-server.*|postgres.*|redis.*"}[15m]) > 2
        for: 3m
        labels: { severity: critical, platform: arbitragex }
        annotations:
          summary: "Docker container {{ $labels.name }} restarting rapidly"
          description: "Container {{ $labels.name }} has restarted > 2 times in 15m. Run: docker logs {{ $labels.name }} --tail 50"
