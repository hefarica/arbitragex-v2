auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

# ARBX-RETENTION-01: antes sin compactor/retention, Loki crecía infinito
# (6.87GB al 2026-09-04 sin techo). 360h = 15 días — ver docs/RETENTION_POLICY.md
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
limits_config:
  retention_period: 360h

analytics:
  reporting_enabled: false
