apiVersion: 1

datasources:
  - name: Prometheus
    uid: arbx-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: arbx-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: traceID
          matcherRegex: "trace_id\":\"(\\w+)"
          url: "$${__value.raw}"
