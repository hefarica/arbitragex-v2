apiVersion: 1

providers:
  - name: arbitragex-dashboards
    orgId: 1
    folder: ArbitrageX
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
