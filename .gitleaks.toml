# gitleaks: conserva TODAS las reglas por defecto (extend useDefault) y permite
# únicamente secretos con forma de address ERC-20 pública (0x + exactamente 40 hex,
# con o sin comillas envolventes). Evidencia: run 32815147308 / job 97701808284
# (push 63473534, findings en e2e3b5d2) — 16 falsos positivos de generic-api-key
# sobre token_in/token_out/opp_token_* con addresses canónicas (WETH/USDC/USDT)
# en tests y fixtures de respuestas públicas de API.
# El patrón es anclado: un private key (0x + 64 hex) NO matchea y sigue detectándose.
# Jamás ampliar este allowlist a valores >40 hex — enmascararía claves reales.

[extend]
useDefault = true

[allowlist]
description = "ERC-20 addresses + SEC-01 historical DSN path (see comments)"
regexes = ['^"?0x[0-9a-fA-F]{40}"?$']
# SEC-01 (2026-09-24): inject-trigger.mjs DSN exists only in git HISTORY
# (commit d7f9c6d3, already in main). The CURRENT HEAD version is env-only.
# This path allowlist suppresses the historical diff finding; any NEW secret
# in this file will still be caught (the path is scoped to this one file).
paths = ['''backend/api-server/inject-trigger\.mjs''']
